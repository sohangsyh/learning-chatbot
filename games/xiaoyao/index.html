<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>逍遙遊</title>

<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .title{flex-direction:column;gap:14px} .title .v{writing-mode:horizontal-tb;font-size:56px} .title .v.a{margin-left:0;align-self:center;font-size:15px;letter-spacing:.15em} .title .side{align-items:center;text-align:center} .title .side .primary{align-self:center}
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}
.bn{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;background:rgba(244,235,214,.05);border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px;font-size:13px}.bn div{display:flex;justify-content:space-between;gap:8px}.bn span{color:var(--muted)}.bn b{color:var(--paper);font-weight:600;text-align:right}
.sl{margin:4px 0 8px}.slh{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}.slh b{font-family:var(--serif);font-size:18px;color:var(--gold)}.sl input{width:100%;accent-color:var(--gold);height:30px}
@media (max-width:560px){.bn{grid-template-columns:1fr}}
</style>
</head>

_id": "u3", "title": "浮於江湖", "key_quote": "何不慮以為大樽而浮於江湖？", "concept": "大瓠盛水不堅、做瓢太淺，莊子建議把它做成大樽，縛在身上浮遊於江湖；惠子只憂慮它無處可容，是因為心像蓬草一樣茅塞。", "misconceptions": ["瓠落無所容，只能丟掉", "大瓠只能用來盛東西"], "interactions": {"after_explore": "carve", "after_choice": "voyage"}, "lines": {"enter": "{address}，回到那個大瓠。莊子先生帶我們來到湖邊。", "guide": "大瓠盛水會裂，做瓢太淺，那就不要再拿它來盛東西。把它縛在身上，就能浮遊於江湖之上。", "dilemma": "瓠落無所容，又大又淺，除了丟掉，還能怎樣？", "prompt": "你會怎樣處置這個大瓠？"}, "hotspots": [{"id": "reed", "label": "蓬草", "text": "一叢彎曲雜亂的蓬草。莊子說惠子「猶有蓬之心」：心思像蓬草一樣茅塞不通。"}, {"id": "stele", "label": "湖邊石碑", "text": "「今子有五石之瓠，何不慮以為大樽而浮於江湖，而憂其瓠落無所容？」"}, {"id": "float", "label": "大瓠", "text": "大樽是一種縛在身上、幫助人浮水的大型浮具。大瓠又大又輕，正好合用。"}], "choices": [{"type": "correct", "text": "把它做成大樽，縛在身上，浮遊於江湖之上。", "feedback": "對！不再拿它盛東西，它就成了浮遊江湖的大樽。"}, {"type": "misconception", "text": "丟掉吧，又大又淺，放在哪裡都沒用。", "feedback": "這就是莊子說的「憂其瓠落無所容」。只看到它不能盛東西，看不到別的用處。"}, {"type": "suboptimal", "text": "不用來盛水，改用來盛米，米總不會漏。", "feedback": "還是只想到「盛東西」。莊子批評的正是這種被舊用法困住的「蓬之心」。"}], "reactions": {"rival_on_correct": "浮於江湖……我怎麼沒想到？", "rival_on_wrong": "就是嘛，丟了乾淨。", "companion_on_correct": "我們浮起來了！", "companion_on_wrong": "它又不會漏水，好像可以做別的……"}, "gate": {"question": "「夫子猶有蓬之心也夫」的「蓬之心」比喻甚麼？", "options": ["心思茅塞、見識淺窄", "心地善良", "心情愉快", "心中有大志"], "answer": 0, "explain": "蓬草彎曲叢生，比喻惠子的心思被成見塞住，看不到大瓠的其他用處。"}, "hints": {"dilemma": ["大瓠盛東西不行，換個完全不同的用法？", "湖邊石碑上寫了甚麼？", "做成大樽，浮於江湖。"], "gate": ["看看湖邊那叢蓬草的樣子。", "彎曲雜亂，塞得密密麻麻。", "心思茅塞、見識淺窄。"]}}, {"unit_id": "u4", "title": "無何有之鄉", "key_quote": "無所可用，安所困苦哉？", "concept": "惠子以不中繩墨的大樹比喻莊子之言大而無用。莊子以狸狌（有小用而死於罔罟）、斄牛（大而不能執鼠）作答，主張把大樹種在無何有之鄉，逍遙寢臥其下：無所可用，就不會受到傷害。", "misconceptions": ["不成材的樹應砍作柴薪", "靈巧有用才值得學習"], "interactions": {"after_explore": "wildcat_yak", "after_choice": "tree_fate"}, "lines": {"enter": "{address}，惠子先生又來了，他指著路邊那棵大樹。", "guide": "狸狌靈巧，東竄西跳，最後死在陷阱裡；斄牛大得像天邊的雲，卻捉不了一隻老鼠。大有大的用處，靈巧也會招來禍害。", "dilemma": "今子之言，大而無用，眾所同去也！你的話就像這棵樹，大而無用，大家都不理你。", "prompt": "你會怎樣回應惠子？"}, "hotspots": [{"id": "tree", "label": "大樗樹", "text": "「其大本擁腫而不中繩墨，其小枝卷曲而不中規矩。」樹幹臃腫，樹枝彎曲，做不了木材。"}, {"id": "axe", "label": "木匠的斧頭", "text": "木匠扛著斧頭經過，看也不看這棵樹：「立之塗，匠者不顧。」"}, {"id": "trap", "label": "捕獸陷阱", "text": "路邊設著捕獸的機關和網羅：「中於機辟，死於罔罟。」"}], "choices": [{"type": "correct", "text": "把它種在無何有之鄉、廣莫之野，在樹下逍遙寢臥；它無所可用，又有甚麼困苦？", "feedback": "這就是無用之用：「不夭斤斧，物無害者。無所可用，安所困苦哉？」"}, {"type": "misconception", "text": "砍下來當柴燒，總算物盡其用。", "feedback": "這仍是用世俗的標準衡量一切。莊子主張讓大樹免於斧斤，自在生長。"}, {"type": "suboptimal", "text": "學狸狌那樣靈巧，做一個有用的人。", "feedback": "狸狌正因為靈巧「有用」，才「中於機辟，死於罔罟」。莊子不是要人追求世俗的用處。"}], "reactions": {"rival_on_correct": "……罷了，今天又辯不過你。", "rival_on_wrong": "這才實際嘛！", "companion_on_correct": "在樹下睡一覺，真舒服！", "companion_on_wrong": "可是，狸狌最後不是被網住了嗎？"}, "gate": {"question": "「無所可用，安所困苦哉」的意思是？", "options": ["正因為沒有世俗的用處，才不會受到傷害和困苦", "沒有用的東西一定很困苦", "有用的人才能免於困苦", "大樹會因為無用而被砍掉"], "answer": 0, "explain": "大樹無所可用，所以斧頭不會砍它，萬物也不會傷害它，又怎會困苦？這就是無用之用。"}, "hints": {"dilemma": ["狸狌和斄牛，哪一個下場比較好？", "木匠看也不看這棵樹，這對大樹是好是壞？", "種在無何有之鄉，逍遙寢臥其下。"], "gate": ["「安所」是「哪裡會有」的意思。", "無用，所以斧頭不砍。", "沒有世俗的用處，才不會受到傷害。"]}}], "endings": {"best": {"title": "逍遙乎寢臥其下", "text": "你看懂了莊子：大有大的用處，無用也有無用之用。"}, "normal": {"title": "浮於江湖", "text": "你開始跳出舊的眼光，有些地方還被成見塞住。"}, "fail": {"title": "猶有蓬之心", "text": "你仍然常用惠子的眼光看事物。再聽一次莊子的寓言吧。"}}, "debrief": "惠子看見的是「無用」，我看見的是「怎樣用」。大瓠可以浮遊江湖，大樹可以讓人逍遙寢臥：這就是無用之用。"}</script>

  S.springMats=[];S.splashPts=[];const cs=new THREE.Group();cs.position.set(6.4,0,-5.2);g.add(cs);const stone=M(0x8E8A80,{flatShading:true});

  for(let q=0;q<10;q++){const r=mesh(new THREE.DodecahedronGeometry(.5+R()*.7,0),stone,(R()-.5)*5,.2+R()*1.2,-1.5-R()*2,cs);r.scale.y=.7;}
  for(let q=0;q<3;q++)mesh(new THREE.IcosahedronGeometry(.45,0),M(0x4E7A3E,{flatShading:true}),-1.6+q*1.6,3.3,-.6,cs);

  const pond=new THREE.Mesh(new THREE.CircleGeometry(4.2,32),new THREE.MeshLambertMaterial({color:0x4E86A8}));pond.rotation.x=-Math.PI/2;pond.position.set(5.6,.02,3.6);g.add(pond);
  S.lotus=[];for(let i=0;i<14;i++){const a=R()*6.28,d=1+R()*2.8;const l=mesh(new THREE.CylinderGeometry(.35,.35,.02,12),M(0x3E8A4A),5.6+Math.cos(a)*d,.06,3.6+Math.sin(a)*d,g);S.lotus.push(l);if(i%3===0)mesh(new THREE.ConeGeometry(.12,.25,6),M(0xF2A0B8),l.position.x,.2,l.position.z,g);}
  const boat=new THREE.Group();boat.position.set(9.8,.1,1.6);g.add(boat);box(1.6,.25,.5,0x6A4428,0,0,0,boat);box(.06,.9,.06,0x5A3A22,.5,.5,0,boat);const fm=new E.ancientFolk({hat:'farmer',robe:0x5A6A7A});fm.position.set(-.2,.05,0);fm.scale.setScalar(.8);boat.add(fm);S.boat=boat;

  S.fx={

<script>/* RPG mode built on ENG + scene kit */
(function(){
"use strict";
const E=ENG,$=E.$,V=(x,y,z)=>new THREE.Vector3(x,y,z);
const C=JSON.parse($('d-content').textContent),W=JSON.parse($('d-world').textContent),GM=JSON.parse($('d-game').textContent);
const KIT=E.kits[W.scene_kit];
const game={stage:-1,role:null,meter:50,shown:50,score:0,hints:0,history:[],hint:null,exploreCb:null};
window.__rpg=game;
const meterCfg=GM.state.meter;

E.init({canvas:$('scene'),onResize:changed=>{if(changed&&game.stage>=0){placeParty(game.stage,true);const v=stageView(game.stage);E.camSet(v.pos,v.look);}},onFrame});
E.bindDialog();
E.setEnv(W.stages[0].environment.time,true);
E.SPK={narrator:{name:'你',col:'#F4EBD6'},clue:{name:'線索',col:'#F2C14E'}};
Object.entries(C.npc_slots).forEach(([s,d])=>E.SPK[s]={name:d.display_name,col:E.hex(E.PAL[d.character_id][0])});
$('meterLabel').textContent=meterCfg.label;

/* world from kit */
const stagePos=W.stages.map(s=>V(...s.position));
KIT.build(W,stagePos);
const hotspots=[];
W.stages.forEach((s,si)=>s.hotspots.forEach(h=>{
  const pos=stagePos[si].clone().add(V(...h.offset));const {g,h:ht}=KIT.prop(h.prop);g.position.copy(pos);
  const toCenter=stagePos[si].clone().add(V(0,0,4)).sub(pos);g.rotation.y=Math.atan2(toCenter.x,toCenter.z);E.scene.add(g);
  const ring=E.mesh(new THREE.TorusGeometry(.2,.04,8,24),new THREE.MeshBasicMaterial({color:0xF2C14E}),pos.x,ht+.55,pos.z,E.scene);ring.visible=false;
  const hit=E.mesh(new THREE.SphereGeometry(.7,8,6),new THREE.MeshBasicMaterial({visible:false}),pos.x,ht*.6,pos.z,E.scene);
  const data=C.units[si].hotspots.find(x=>x.id===h.id);
  const el=document.createElement('button');el.className='spot';el.textContent=data.label;el.hidden=true;$('spots').appendChild(el);
  const hs={si,id:h.id,data,ring,hit,el,baseY:ht+.55,done:false,anchor:{el,pos:V(pos.x,ht+.85,pos.z)}};E.anchors.push(hs.anchor);
  el.addEventListener('click',()=>{if(game.exploreCb)game.exploreCb(hs);});hit.userData.hs=hs;hotspots.push(hs);
}));

/* characters */
Object.entries(C.npc_slots).forEach(([s,d])=>E.makeChar(s,d.character_id,d.costume));
if(W.player_avatar){const p=E.makeChar('player','P',[]);p.speed=3.6;}
const CH=E.chars;
E.lampValue=()=>game.shown/100;
function slotPos(i,slot){const l=W.npc_layout[slot];const s=E.portrait?.66:1;return stagePos[i].clone().add(V(l[0]*s,0,l[2]+(E.portrait&&slot==='companion'?.6:0)));}
function placeParty(i,instant,dur){Object.values(CH).forEach(c=>{const t=slotPos(i,c.slot);c.target.copy(t);c.face=null;
  if(instant)c.root.position.copy(t);else c.speed=Math.max(2.2,c.root.position.distanceTo(t)/(dur||3)*1.05);});}

/* camera */
function stageView(i){const p=stagePos[i];const d=E.portrait?15:10.5,h=E.portrait?4.8:3.7;return {pos:V(p.x,h,p.z+d),look:V(p.x,E.portrait?-.35:.55,p.z-1.6)};}
E.cam.idle=t=>{if(game.stage>=0)return;const a=t*.06;E.camera.position.set(Math.sin(a)*11,4.2,Math.cos(a)*11-1);E.cam.look.set(0,1,-1.2);};

/* frame */
function onFrame(dt,t){
  if(KIT.onFrame)KIT.onFrame(dt,t);
  game.shown+=(game.meter-game.shown)*Math.min(1,dt*2.5);E.env.dim=1-game.shown/100;
  hotspots.forEach(h=>{if(h.ring.visible){h.ring.rotation.y+=dt*2;h.ring.position.y=h.baseY+Math.sin(t*3+h.anchor.pos.x)*.06;}});
}

/* meter & score */
function setMeter(v){game.meter=Math.max(0,Math.min(100,v));$('mVal').textContent=Math.round(game.meter);
  const b=$('mBar');b.style.width=game.meter+'%';b.style.background=game.meter<40?'var(--cinnabar)':game.meter>=75?'var(--jade)':'var(--gold)';
  $('mGlow').setAttribute('opacity',(.15+game.meter/100*.85).toFixed(2));}
function addScore(n){game.score=Math.max(0,game.score+n);$('scoreVal').textContent=game.score;}
const fill=s=>s.replace(/\{address\}/g,game.role?game.role.address:'');

/* assistant */
function setHint(list){game.hint=list?{list,level:0}:null;const a=$('assist');a.disabled=!list;a.classList.toggle('ready',!!list);}
function giveHint(auto){const h=game.hint;if(!h)return;if(h.level>=h.list.length){E.bubble('學伴','提示已經用完了，相信自己的判斷吧！',3000);return;}
  const txt=h.list[h.level];h.level++;if(!auto){game.hints++;addScore(-GM.scoring.hint_penalty);}
  E.bubble('學伴提示 '+h.level+'/'+h.list.length+(auto?'':'（扣 '+GM.scoring.hint_penalty+' 分）'),txt);if(h.level>=h.list.length)$('assist').classList.remove('ready');}
$('assist').addEventListener('click',()=>giveHint(false));

/* explore */
function explore(si){
  const list=hotspots.filter(h=>h.si===si);let idle;
  const status=()=>{const n=list.filter(h=>h.done).length;$('whoName').textContent='調查';$('whoDot').style.background='#F2C14E';$('line').classList.remove('quote');
    $('line').textContent=n<list.length?'四處看看：點擊場景中發亮的地方調查線索（'+n+'/'+list.length+'）':'線索都調查過了。';};
  return new Promise(res=>{
    const arm=()=>{clearTimeout(idle);idle=setTimeout(()=>E.bubble('學伴','試試點擊金色圓環，或畫面上的標籤。',4000),GM.chapters[si].beats.explore.idle_hint_sec*1000);};
    list.forEach(h=>{h.ring.visible=true;h.el.hidden=false;});
    const back=()=>{status();const n=list.filter(h=>h.done).length;
      if(n>=list.length){clearTimeout(idle);E.actions([E.btn('next','繼續',()=>{list.forEach(h=>{h.ring.visible=false;h.el.hidden=true;});game.exploreCb=null;res();})]);}else{E.actions([]);arm();}};
    game.exploreCb=async h=>{if(h.si!==si||game.walking||h.busy)return;h.busy=true;clearTimeout(idle);E.hideBubble();await walkTo(h.anchor.pos.clone().setY(0));h.busy=false;h.done=true;h.el.classList.add('done');h.ring.material=new THREE.MeshBasicMaterial({color:0x5FB49C});
      E.actions([]);await E.showLine('clue',h.data.text,/「/.test(h.data.text));$('whoName').textContent=h.data.label;E.actions([E.btn('next','收起',back)]);};
    $('dialog').hidden=false;E.setTalker('');back();});
}
const ray=new THREE.Raycaster(),pm=new THREE.Vector2();
E.canvas.addEventListener('click',e=>{if(!game.exploreCb)return;const r=E.canvas.getBoundingClientRect();pm.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(pm,E.camera);const hit=ray.intersectObjects(hotspots.filter(h=>h.ring.visible).map(h=>h.hit))[0];if(hit){game.exploreCb(hit.object.userData.hs);return;}
  const PL=CH.player;if(PL&&!game.walking){const pt=V();if(ray.ray.intersectPlane(new THREE.Plane(V(0,1,0),0),pt)){const c=stagePos[game.stage];const d=pt.clone().sub(c);d.y=0;if(d.length()>6)d.setLength(6);PL.target.copy(c).add(d);PL.onArrive=null;}}});
function walkTo(pos){const PL=CH.player;if(!PL)return Promise.resolve();game.walking=true;const d=PL.root.position.clone().sub(pos);d.y=0;if(d.length()<.01)d.set(0,0,1);d.setLength(1.1);PL.target.copy(pos).add(d).setY(0);PL.lookAt=pos;
  return new Promise(r=>{PL.onArrive=()=>{PL.lookAt=null;game.walking=false;r();};if(PL.root.position.distanceTo(PL.target)<.06){PL.onArrive=null;PL.lookAt=null;game.walking=false;r();}});}

/* chapter */
async function chapterCard(i,u){
  E.overlay('<div class="chapcard"><small>第'+E.NUM[i]+'章</small><h2>'+u.title+'</h2><p>'+u.key_quote+'</p></div>',true);
  await Promise.race([E.sleep(E.RM?1200:2600),new Promise(r=>$('overlay').addEventListener('click',r,{once:true}))]);E.clearOverlay();
}
async function playChapter(i){
  const u=C.units[i],ch=GM.chapters[i],st=W.stages[i];
  E.hideDialog();setHint(null);E.hideBubble();
  await chapterCard(i,u);
  $('chapNo').textContent='第'+E.NUM[i]+'章';$('chapTitle').textContent=u.title;
  game.stage=i;E.setEnv(st.environment.time);
  const v=stageView(i);placeParty(i,false,3.2);await E.camTo(v.pos,v.look,i===0?2.4:3.4);
  await E.say('companion',fill(u.lines.enter));
  await explore(i);
  const ix=u.interactions||{};const ctx={i,u,pos:stagePos[i],CH,game};
  if(ix.after_explore&&KIT.interact)await KIT.interact(ix.after_explore,ctx);
  await E.say('mentor',u.lines.guide);
  const rv=CH.rival;rv.target.copy(slotPos(i,'rival')).add(V(0,0,1.2));rv.speed=2;
  if(ix.before_dilemma&&KIT.interact)await KIT.interact(ix.before_dilemma,ctx);
  await E.say('rival',u.lines.dilemma);
  setHint(u.hints.dilemma);
  const order=E.shuffle([0,1,2]);
  const pick=await E.ask('narrator',u.lines.prompt,order.map(k=>u.choices[k].text));
  const choice=u.choices[order[pick]],rule=ch.beats.choices.find(c=>c.type===choice.type);
  setHint(null);E.hideBubble();setMeter(game.meter+rule.meter);addScore(rule.score);game.history.push({unit:u,choice});
  const good=choice.type==='correct';E.flash(good,good?null:parseInt(GM.wrong_flash||'0x2A2440'));
  if(ix.after_choice&&KIT.interact){E.hideDialog();await KIT.interact(ix.after_choice,Object.assign({choice:choice.type},ctx));}
  if(good){E.emote(CH.rival,'slump');E.emote(CH.companion,'hop');}else{E.emote(CH.rival,'hop');E.emote(CH.companion,'shake');E.emote(CH.gatekeeper,'shake');}
  E.floatBubble(CH.companion,good?u.reactions.companion_on_correct:u.reactions.companion_on_wrong,3600);
  await E.say('rival',good?u.reactions.rival_on_correct:u.reactions.rival_on_wrong);
  rv.target.copy(slotPos(i,'rival'));if(!good)E.emote(CH.mentor,'shake');
  await E.say('mentor',choice.feedback);
  await gate(i,u);
}
async function gate(i,u){
  const gk=CH.gatekeeper;gk.target.copy(stagePos[i]).add(V(0,0,E.portrait?.6:1));gk.speed=2.2;await E.sleep(900);
  setHint(u.hints.gate);const wrong=new Set(),h0=game.hints;
  for(;;){const idx=await E.ask('gatekeeper',u.gate.question,u.gate.options,wrong,{skip:true});
    if(idx===-1){setHint(null);E.hideBubble();game.history[game.history.length-1].gate={wrong:wrong.size,hints:game.hints-h0,skipped:true};await E.say('gatekeeper','答案是「'+u.gate.options[u.gate.answer]+'」。'+u.gate.explain,{btn:i<C.units.length-1?'前往下一章':'看結局'});break;}
    if(idx===u.gate.answer){const pts=Math.max(GM.scoring.gate_min,GM.scoring.gate_first_try-wrong.size*GM.scoring.gate_wrong_penalty);addScore(pts);setHint(null);E.hideBubble();E.emote(gk,'hop');
      game.history[game.history.length-1].gate={wrong:wrong.size,hints:game.hints-h0};
      await E.say('gatekeeper','答對了。'+u.gate.explain,{btn:i<C.units.length-1?'前往下一章':'看結局'});break;}
    wrong.add(idx);E.emote(gk,'shake');const d=$('dialog');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');giveHint(true);}
  gk.target.copy(slotPos(i,'gatekeeper'));
}

/* screens */
async function title(){
  const tl=C.meta.title_lines||[];
  E.overlay('<div class="title"><div class="v">'+(C.meta.short_title||C.meta.topic)+'</div><div class="v a">'+C.meta.author+'</div><div class="side"><p>'+tl.join('<br>')+'</p><button class="primary" id="go">開始</button></div></div>',true);
  $('go').focus();await E.waitClick('#go');
  E.overlay('<div class="card"><h2>你是誰？</h2><p class="sub">不同身份的起始'+meterCfg.label+'不同，旁人對你的稱呼也不同。</p><div class="roles">'+
    C.player_roles.map((r,i)=>'<button class="role" data-i="'+i+'"><b>'+r.display_name+'</b><span>'+r.blurb+'</span><em>起始'+meterCfg.label+' '+r.start_value+'</em></button>').join('')+'</div></div>',true);
  const b=await E.waitClick('.role');game.role=C.player_roles[+b.dataset.i];
  const desc={mentor:'你的導師，會為你點破道理',companion:'和你一起經歷每個場景',rival:'會化身不同角色考驗你',gatekeeper:'每章結束時考問你'};
  E.overlay('<div class="card"><h2>登場人物</h2><div class="cast">'+Object.entries(C.npc_slots).map(([s,d])=>'<div>'+E.glyph(d.character_id)+'<p style="margin:0"><b>'+d.display_name+'</b><br><span>'+(d.persona||desc[s])+'</span></p></div>').join('')+
    '</div><p class="sub">右上角是你的「'+meterCfg.label+'」，每個選擇都會讓它升或降。卡住時可以按「學伴提示」，每次扣 '+GM.scoring.hint_penalty+' 分。</p><button class="primary" id="go">出發</button></div>',true);
  await E.waitClick('#go');E.clearOverlay();
}
async function ending(){
  setHint(null);E.hideDialog();
  const b=game.meter,tier=GM.endings.find(e=>b>=e.min_meter).id,EN=C.endings[tier];
  E.flash(tier==='best');if(tier==='best')Object.values(CH).forEach(c=>E.emote(c,'hop'));await E.sleep(900);
  const lab={correct:['做對了','ok'],misconception:['落入盲點','bad'],suboptimal:['未盡完善','mid']};
  const tl=game.history.map((h,i)=>{const [t,cls]=lab[h.choice.type];const right=h.unit.choices.find(c=>c.type==='correct');
    return '<li class="'+cls+'"><b>第'+E.NUM[i]+'章 '+h.unit.title+'</b><span class="tag">'+t+(h.gate&&(h.gate.wrong||h.gate.hints)?'，考問答錯 '+h.gate.wrong+' 次、提示 '+h.gate.hints+' 次':'')+'</span><p>你的選擇：'+h.choice.text+'</p>'+(h.choice.type==='correct'?'':'<p>正確做法：'+right.text+'</p>')+'</li>';}).join('');
  E.overlay('<div class="card"><p class="sub" style="margin:0">結局</p><h2>'+EN.title+'</h2><p>'+EN.text+'</p><div class="stats"><div><b>'+Math.round(b)+'</b>'+meterCfg.label+'</div><div><b>'+game.score+'</b>分數</div><div><b>'+game.hints+'</b>提示次數</div></div>'+
    '<ol class="tl">'+tl+'</ol><p style="font-family:var(--serif)">'+C.npc_slots.mentor.display_name+'：'+C.debrief+'</p><button class="primary" id="again">再玩一次</button></div>',true);
  await E.waitClick('#again');location.reload();
}
async function main(){
  setMeter(50);placeParty(0,true);E.camera.position.set(0,4.2,10);E.cam.look.set(0,1,-1.2);E.start();
  await title();
  game.meter=game.shown=game.role.start_value;setMeter(game.meter);$('hud').hidden=false;
  for(let i=Math.max(0,(window.__startCh||1)-1);i<C.units.length;i++)await playChapter(i);
  await ending();
}
main();
})();
</script>
