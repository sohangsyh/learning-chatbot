<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hong Kong Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .title{flex-direction:column;gap:14px} .title .v{writing-mode:horizontal-tb;font-size:56px} .title .v.a{margin-left:0;align-self:center;font-size:15px;letter-spacing:.15em} .title .side{align-items:center;text-align:center} .title .side .primary{align-self:center}
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}

.scorebox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:7px 14px;display:flex;gap:16px}
.scorebox div{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.scorebox b{font-family:var(--serif);font-size:20px;color:var(--paper);font-variant-numeric:tabular-nums}
.tool{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px}
.tool svg{width:17px;height:17px}.tool:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));background:var(--panel);border:1px solid var(--panel-line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 14px;pointer-events:none;z-index:3}
#toast.ok{border-left-color:var(--jade)}#toast.bad{border-left-color:var(--cinnabar)}
#toast b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:2px}#toast.ok b{color:var(--jade)}#toast.bad b{color:#F08A74}
#toast span{font-size:14px;line-height:1.55;color:#E6DCC4}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(244,235,214,.06);border:1px solid rgba(244,235,214,.28);border-radius:10px;padding:8px 10px;font-size:14px}
.pbtn b{font-family:var(--serif);font-size:16px;color:var(--muted)}
.pbtn.float{border-color:#5AA8E0}.pbtn.float b{color:#8CC8F2}.pbtn.sink{border-color:#C98E1E}.pbtn.sink b{color:#F2C14E}
.pbtn:hover{border-color:var(--gold)}
.shaper .srow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.shaper input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.status{font-size:13px;color:var(--muted);margin:6px 0 0}
.notes{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:14px}
.notes b{font-family:var(--serif)}.notes p{font-size:14px;margin:6px 0 0;line-height:1.6;color:#4C4434}
.dt{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.dt th{text-align:left;font-weight:600;color:#6F6450;border-bottom:1px solid #D9CCAE;padding:4px 6px}
.dt td{padding:4px 6px;border-bottom:1px solid #EEE4CC}.dt td.hit{color:#2E7D62;font-weight:600}.dt td.miss{color:#B5412E;font-weight:600}
.review{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:10px}
.review li{border-left:3px solid var(--jade);padding:2px 0 2px 12px}.review b{font-family:var(--serif)}.review p{font-size:14px;margin:3px 0 0;color:#4C4434;line-height:1.6}

.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.slabel{position:absolute;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
#line[lang="en"]{font-size:19px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid rgba(244,235,214,.3);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--muted)}
.mini svg,.mic svg,.play svg{width:16px;height:16px}
.zh{margin:0;font-size:14px;color:var(--muted)}
.target{margin:0;font-size:20px;line-height:1.5;color:var(--paper);background:rgba(244,235,214,.06);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 8px 8px 0}
#actions .mic{display:inline-flex;align-items:center;gap:8px}
.ghost{align-self:flex-start;background:none;border:1px solid rgba(244,235,214,.3);border-radius:10px;padding:7px 14px;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){#dialog.listening{animation:lis 1.2s ease-in-out infinite}@keyframes lis{50%{box-shadow:0 0 0 6px rgba(224,176,75,.35)}}}
.pb{list-style:none;padding:0;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.pb li{display:flex;gap:10px;align-items:flex-start}.pb b{display:block;font-weight:600}.pb span{font-size:13px;color:#6F6450}
.pb .play{flex:none;background:var(--ink);color:var(--paper);border:0;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.opt-row{display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 0}
.opt-row input{width:18px;height:18px;accent-color:#2E7D62}
.privacy{background:#F4EEDD;border-radius:8px;padding:8px 10px;margin-top:8px}
.mtrmap{width:100%;height:auto;border:1px solid #D9CCAE;border-radius:8px;background:#fff;margin:6px 0}
#hud .meters{flex-wrap:wrap;justify-content:flex-end;flex-direction:column;align-items:flex-end}
@media (max-width:560px){#ttsBtn,#speakBtn{font-size:12px;padding:5px 10px}}
.vstat{margin:0;font-size:14px;color:var(--muted);min-height:1.2em}
#actions .vans{align-self:flex-start;display:inline-flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 遊戲場景"></canvas>
  <div id="spots"></div>
  <div id="bubbles"></div>
  <header id="hud" hidden>
    <div class="chap"><span id="chapNo"></span><strong id="chapTitle"></strong></div>
    <div class="meters">
      <div class="scorebox"><div>分數<b id="score">0</b></div></div>
      <button class="tool" id="assist"><svg viewBox="0 0 24 24" fill="none" stroke="#E0B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>老師提示</button>
      <button class="tool" id="phrasebook"><svg viewBox="0 0 24 24" fill="none" stroke="#E0B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM9 8h6M9 12h6"/></svg>短語簿<small id="pbCount" style="color:var(--muted);font-size:11px;margin-left:4px">0</small></button>
      <button class="tool" id="ttsBtn">讀出對白：<span id="ttsSt">開</span></button>
      <button class="tool" id="speakBtn" aria-pressed="false">開口說話：<span id="speakSt">關</span></button>
    </div>
  </header>
  <div id="toast" hidden role="status"><b id="toastT"></b><span id="toastD"></span></div>
  <div id="assistBubble" hidden role="status"></div>
  <section id="dialog" hidden aria-live="polite">
    <div class="who"><i class="dot" id="whoDot"></i><span id="whoName"></span></div>
    <p id="line"></p>
    <div id="actions"></div>
  </section>
  <div id="overlay"></div>
</div>

<script type="application/json" id="d-content">{"meta": {"topic": "English in daily situations", "short_title": "Hong Kong Buddy", "author": "初中英國語文", "language": "en-GB", "ui_language": "zh-Hant", "audience": "初中學生", "central_thesis": "Choose responses that are both grammatically correct and polite for the situation.", "title_lines": ["帶交換生 Sam 遊香港一天。", "用英文點餐、指路、介紹、講價；開啟語音後，可以直接讀出答案。"]}, "npc_slots": {"mentor": {"character_id": "G", "display_name": "Miss Lee", "persona": "你的英文老師，會用中文解釋錯在哪裡", "costume": ["tie"]}, "companion": {"character_id": "O", "display_name": "Sam", "persona": "剛從英國來港的交換生，對甚麼都好奇", "costume": ["cap"]}, "rival": {"character_id": "A", "display_name": "Kenny", "persona": "你的同學，說英文總是太隨便，常常犯錯", "costume": []}, "gatekeeper": {"character_id": "I", "display_name": "Coach Ho", "persona": "每個場景結束時考你一題", "costume": ["beacon"]}}, "scenes": [{"id": "cafe", "title": "茶餐廳", "en_title": "At a cha chaan teng", "env": "indoor_warm", "intro_zh": "第一站帶 Sam 吃早餐。侍應很忙，要說得清楚又有禮貌。", "stranger": {"name": "Waiter", "zh": "侍應"}, "turns": [{"speaker": "stranger", "line": "Hi, what can I get you?", "zh": "你好，想要甚麼？", "options": [{"text": "Could we have two cups of iced lemon tea and a pineapple bun, please?", "correct": true}, {"text": "Give me two iced lemon tea and pineapple bun.", "why": "「Give me」對侍應太直接；飲品要說 two cups of iced lemon tea；pineapple bun 前面也漏了 a。"}, {"text": "I want to eat two cups of iced lemon tea.", "why": "飲品不能用 eat，要用 have 或 drink；而且 I want 不及 Could we have…, please? 有禮貌。"}, {"text": "Two cup iced lemon tea, one pineapple bun.", "why": "cup 是可數名詞，兩杯要說 two cups of；整句只有名詞，沒有 please，語氣生硬。"}], "kenny": "Give me two lemon tea lah!"}, {"speaker": "companion", "line": "What's a pineapple bun? Is there pineapple in it?", "zh": "菠蘿包是甚麼？裡面有菠蘿嗎？", "options": [{"text": "No, there isn't. It's called that because the top looks like a pineapple.", "correct": true}, {"text": "No, it don't have pineapple.", "why": "主語 it 是第三身單數，要用 doesn't，不是 don't。"}, {"text": "Pineapple bun is pineapple.", "why": "這句意思錯誤，也沒有回答 Sam 的問題。要解釋名字的由來。"}, {"text": "No, it isn't have pineapple.", "why": "is 和 have 不能一起用，應說 It doesn't have any pineapple。"}]}, {"speaker": "stranger", "line": "That'll be forty-six dollars.", "zh": "一共四十六元。", "options": [{"text": "Here you are. Can I pay by Octopus?", "correct": true}, {"text": "Forty-six? So expensive!", "why": "對侍應抱怨價錢並不禮貌，而且沒有回應付款。"}, {"text": "I pay by Octopus card, OK?", "why": "詢問可否做某事，用 Can I...? 比較自然有禮；句末加 OK 聽起來像命令。"}, {"text": "Here is it. Can I pay by Octopus?", "why": "次序錯了，應說 Here it is 或 Here you are。"}]}], "check": {"question": "在餐廳點餐，哪一個說法最有禮貌？", "options": ["Could I have a cup of milk tea, please?", "Give me a milk tea.", "I want milk tea.", "Milk tea, quick."], "answer": 0, "explain": "Could I have…, please? 是點餐最常用、最有禮貌的句式。"}}, {"id": "mtr", "title": "港鐵站", "en_title": "At Central MTR station", "env": "indoor_cool", "intro_zh": "你們在中環站，一位遊客走過來問路。可以點擊牆上的路線圖查看。", "stranger": {"name": "Tourist", "zh": "遊客"}, "map": true, "turns": [{"speaker": "stranger", "line": "Excuse me, how do I get to Tsim Sha Tsui?", "zh": "請問怎樣去尖沙咀？", "options": [{"text": "Take the Tsuen Wan Line towards Tsuen Wan. It's two stops from here.", "correct": true}, {"text": "You go red line, two stop.", "why": "句子不完整：要用 Take the... Line，而且 two 之後要用複數 stops。"}, {"text": "Take the Island Line to Tsim Sha Tsui.", "why": "看看路線圖：港島綫只在香港島行駛，不經過尖沙咀。"}, {"text": "Take the Tsuen Wan Line towards Central.", "why": "你們已經在中環。方向要看列車的終點站，去尖沙咀應乘往荃灣方向的列車。"}], "kenny": "Island Line lah, all the same!"}, {"speaker": "stranger", "line": "Do I need to change trains?", "zh": "需要轉車嗎？", "options": [{"text": "No, you don't. It's a direct train.", "correct": true}, {"text": "No, you don't need change.", "why": "need 之後要加 to 再接動詞：need to change。"}, {"text": "Yes, you must change at Kowloon Tong.", "why": "從中環乘荃灣綫，可以直達尖沙咀，不用轉車。"}, {"text": "No, you don't need to changing.", "why": "need to 之後要用動詞原形：need to change。"}]}, {"speaker": "stranger", "line": "Thank you so much!", "zh": "非常感謝！", "options": [{"text": "You're welcome. Enjoy your trip!", "correct": true}, {"text": "Welcome.", "why": "單獨說 Welcome 是「歡迎光臨」的意思，回應道謝要說 You're welcome。"}, {"text": "OK.", "why": "只說 OK 太簡短冷淡，回應別人道謝應該更友善。"}, {"text": "Never mind.", "why": "Never mind 用於回應道歉或表示「算了」，不是用來回應道謝。"}], "kenny": "Welcome! Welcome!"}], "check": {"question": "別人對你說 Thank you，最恰當的回應是？", "options": ["You're welcome.", "Welcome.", "Thank you too.", "Yes."], "answer": 0, "explain": "You're welcome 才是「不客氣」；Welcome 單獨使用是「歡迎」。"}}, {"id": "ferry", "title": "天星小輪", "en_title": "On the Star Ferry", "env": "ferry_day", "intro_zh": "你們乘天星小輪過海，Sam 對維港的一切都很好奇。", "turns": [{"speaker": "companion", "line": "Wow, what's that tall building over there?", "zh": "嘩，那邊那幢很高的大廈是甚麼？", "options": [{"text": "That's the ICC. It's the tallest building in Hong Kong.", "correct": true}, {"text": "That is ICC, it is most tall building in Hong Kong.", "why": "形容詞 tall 的最高級是 the tallest，不是 most tall；ICC 前面也要加 the。"}, {"text": "I don't know, who cares?", "why": "對客人這樣回答很不禮貌。"}, {"text": "That's the ICC. It's the most tallest building in Hong Kong.", "why": "最高級不能同時用 most 和 -est，應說 the tallest。"}]}, {"speaker": "companion", "line": "How long has the Star Ferry been running?", "zh": "天星小輪營運了多久？", "options": [{"text": "It has been running for over a hundred years.", "correct": true}, {"text": "It runs since 1888.", "why": "since 表示由過去持續到現在，要用現在完成式：has been running since 1888。"}, {"text": "It has been running since a hundred years.", "why": "since 之後接時間點（例如 1888），一段時間要用 for：for a hundred years。"}, {"text": "It has been run for over a hundred years.", "why": "持續到現在的動作用 has been running；has been run 是被動語態，意思不對。"}], "kenny": "It runs since long long ago!"}, {"speaker": "companion", "line": "Shall we take a photo together?", "zh": "我們一起拍張照好嗎？", "options": [{"text": "Sure, that's a great idea!", "correct": true}, {"text": "Yes, I am agree.", "why": "agree 本身是動詞，不用加 am：I agree。"}, {"text": "Photo? No need lah.", "why": "對客人的邀請這樣回應太隨便，句末的 lah 是廣東話語氣詞，不是英文。"}, {"text": "Sure, let's take photo.", "why": "photo 是可數名詞，前面要加冠詞：take a photo。"}]}], "check": {"question": "以下哪一句是正確的？", "options": ["It has been running for over a hundred years.", "It is running since 1888.", "It has been running since a hundred years.", "It run for a hundred years."], "answer": 0, "explain": "持續到現在的事用現在完成進行式；一段時間用 for，時間點用 since。"}}, {"id": "market", "title": "街市", "en_title": "At the wet market", "env": "morning", "intro_zh": "最後一站，Sam 想買芒果。檔主會說一點英文，試試幫 Sam 講價。", "stranger": {"name": "Stall owner", "zh": "檔主"}, "turns": [{"speaker": "stranger", "line": "Mangoes, twenty dollars each! Very sweet!", "zh": "芒果，每個二十元！很甜的！", "options": [{"text": "Excuse me, could you give us a discount if we buy three?", "correct": true}, {"text": "Cheaper! Cheaper!", "why": "只喊「平啲」既不禮貌，也沒有說清楚條件。"}, {"text": "Could you give us a discount if we will buy three?", "why": "if 條件句說將來的事，if 子句用現在式：if we buy，不用 will。"}, {"text": "Can you give discount?", "why": "discount 前面要加 a 或 us；而且 Could you…? 比 Can you…? 更有禮貌。"}], "kenny": "Cheaper la! Cheaper!"}, {"speaker": "stranger", "line": "OK, three for fifty-five dollars.", "zh": "好，三個五十五元。", "options": [{"text": "Great, that saves us five dollars. We'll take them.", "correct": true}, {"text": "Great, that saves us fifteen dollars.", "why": "算一算：三個原價 60 元，現在 55 元，只省了 5 元。"}, {"text": "Great, it are cheap.", "why": "it 要配 is：it is cheap。"}, {"text": "Great, that save us five dollars.", "why": "that 是單數主語，動詞要加 s：that saves us。"}]}, {"speaker": "stranger", "line": "Do you need a plastic bag?", "zh": "要膠袋嗎？", "options": [{"text": "No, thank you. We've brought our own bag.", "correct": true}, {"text": "No, thanks. We have brought our own bag yesterday.", "why": "現在完成式不能和 yesterday 這類過去時間連用。"}, {"text": "No need.", "why": "只說 No need 太簡短生硬，加上 thank you 會有禮貌得多。"}, {"text": "No, thank you. We bring our own bag.", "why": "表示已經帶備了，要用現在完成式 We've brought；We bring 表示習慣。"}]}], "check": {"question": "「Could you give us a discount if we buy three?」為甚麼用 buy 而不是 will buy？", "options": ["if 條件句說將來的事時，if 子句用現在式", "因為 buy 是不規則動詞", "因為句子是問句", "兩種都可以，沒有分別"], "answer": 0, "explain": "第一類條件句：if + 現在式，主句才用 will 或 can、could。"}}], "endings": {"best": {"title": "Excellent Buddy!", "text": "Sam 這一天玩得很開心，你的英文既正確又得體。"}, "normal": {"title": "Good Buddy", "text": "你帶 Sam 走完了一天，有幾句還可以說得更好。"}, "fail": {"title": "Keep Practising", "text": "有不少句子說錯了。看看短語簿，下次再試！"}}, "debrief": "好的英文不只是文法對，還要看場合：對陌生人用 Could I...? 和 please，回應道謝說 You're welcome，時態和單複數也要小心。"}</script>

E.emote=function(c,type){c.emote=type;c.emoteT=0;};

const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
function lcs(a,b){const dp=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);return dp[a.length][b.length];}

function similarity(said,target){const a=norm(said),b=norm(target);const dp=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));

$('assist').addEventListener('click',()=>{if(!st.hint)return;st.hints++;st.score=Math.max(0,st.score-GM.scoring.hint_penalty);hud();E.bubble(C.npc_slots.mentor.display_name+' 的提示（扣 '+GM.scoring.hint_penalty+' 分）',st.hint,7000);});
$('phrasebook').addEventListener('click',async()=>{if($('overlay').innerHTML)return;
  E.overlay('<div class="card"><h2>短語簿</h2><p class="sub">一路上學到的得體說法，按播放鍵可以再聽一次。</p><ul class="pb">'+(st.phrases.map((p,i)=>'<li><button class="play" data-i="'+i+'" aria-label="播放">'+PLAY+'</button><div><b lang="en">'+p.en+'</b><span>'+p.where+'</span></div></li>').join('')||'<p class="sub">還沒有短語。</p>')+'</ul><button class="primary" id="pbc">收起</button></div>',true);
  document.querySelectorAll('.pb .play').forEach(b=>b.addEventListener('click',()=>speak(st.phrases[+b.dataset.i].en)));await E.waitClick('#pbc');E.clearOverlay();});
const PLAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
async function showMap(){if($('overlay').innerHTML)return;
  E.overlay('<div class="card"><h2>港鐵路線圖（部分）</h2><p class="sub">你們在中環站。</p><svg viewBox="0 0 420 200" class="mtrmap" role="img" aria-label="港島綫由堅尼地城經中環、金鐘到灣仔；荃灣綫由中環經金鐘、尖沙咀到佐敦">'+
   '<path d="M20 150 H330" stroke="#1A5FB4" stroke-width="9" stroke-linecap="round"/><path d="M110 150 V60 Q110 40 130 40 H400" stroke="#C8352A" stroke-width="9" stroke-linecap="round" fill="none"/>'+
   '<g font-size="13" fill="#1C2A26"><circle cx="40" cy="150" r="8" fill="#fff" stroke="#1A5FB4" stroke-width="3"/><text x="18" y="178">上環</text>'+
   '<circle cx="110" cy="150" r="11" fill="#fff" stroke="#1C2A26" stroke-width="4"/><text x="92" y="180" font-weight="700">中環（你在這裡）</text>'+
   '<circle cx="200" cy="150" r="8" fill="#fff" stroke="#1A5FB4" stroke-width="3"/><text x="186" y="178">金鐘</text><circle cx="290" cy="150" r="8" fill="#fff" stroke="#1A5FB4" stroke-width="3"/><text x="276" y="178">灣仔</text>'+
   '<circle cx="110" cy="95" r="8" fill="#fff" stroke="#C8352A" stroke-width="3"/><text x="122" y="99">金鐘</text><circle cx="230" cy="40" r="8" fill="#fff" stroke="#C8352A" stroke-width="3"/><text x="212" y="26">尖沙咀</text><circle cx="330" cy="40" r="8" fill="#fff" stroke="#C8352A" stroke-width="3"/><text x="318" y="26">佐敦</text>'+
   '<text x="300" y="80" fill="#C8352A">荃灣綫 Tsuen Wan Line</text><text x="150" y="130" fill="#1A5FB4">港島綫 Island Line</text></g></svg><p class="sub">簡化示意圖，只顯示附近車站。</p><button class="primary" id="mpc">收起</button></div>',true);
  await E.waitClick('#mpc');E.clearOverlay();}

/* ---------- a dialogue turn ---------- */
function spkKey(sc,turn){if(turn.speaker==='stranger'){E.SPK.stranger={name:sc.stranger.name+'（'+sc.stranger.zh+'）',col:'#F2C14E'};return 'stranger';}return turn.speaker;}
async function doTurn(sc,turn,ti){
  const key=spkKey(sc,turn);const sg=STR[sc.id];
  st.hint='這句的意思是：「'+turn.zh+'」。選一個文法正確、語氣又有禮貌的回應。';
  if(turn.kenny){E.emote(CH.rival,'hop');E.floatBubble(CH.rival,turn.kenny,3200);}
  const opts=E.shuffle(turn.options);const dis=new Set();let wrong=0,skipped=false;
  if(sg)sg.userData.talk=true;speak(turn.line).then(()=>{if(sg)sg.userData.talk=false;});
  for(;;){const pick=await new Promise(async res=>{E.actions([]);await E.showLine(key,turn.line);$('line').setAttribute('lang','en');
      const tools=document.createElement('div');tools.className='tools';const zh=document.createElement('p');zh.className='zh';zh.textContent=turn.zh;zh.hidden=true;
      tools.appendChild(E.btn('mini',PLAY+'重聽',()=>speak(turn.line)));tools.appendChild(E.btn('mini','中文意思',()=>{zh.hidden=!zh.hidden;}));
      const nodes=[tools,zh].concat(opts.map((o,i)=>{const b=E.btn('opt','<span class="k">'+'ABCD'[i]+'</span><span lang="en">'+o.text+'</span>',()=>{st.byVoice=false;res(i);});if(dis.has(i))b.disabled=true;return b;}));
      if(st.speak){const vs=document.createElement('p');vs.className='vstat';let busy=false;
        const vb=E.btn('next mic vans',MIC+'讀出你的答案',async()=>{if(busy)return;busy=true;vb.disabled=true;vs.textContent='正在聆聽……請讀出你選擇的句子。';$('dialog').classList.add('listening');
          const r=await listen();$('dialog').classList.remove('listening');busy=false;vb.disabled=false;
          if(r.err){vs.textContent={unsupported:'此瀏覽器不支援語音辨識，請直接點選答案。','not-allowed':'未能使用咪高峰，請在瀏覽器設定中允許，或直接點選答案。','no-speech':'聽不到聲音，請靠近咪高峰再讀一次。'}[r.err]||'語音辨識出錯，請再試一次或直接點選。';return;}
          let best=null;r.alts.forEach(a=>opts.forEach((o,i)=>{if(dis.has(i))return;const sc=f1(a,o.text);if(!best||sc>best.s)best={i,s:sc,a};}));
          const second=Math.max(0,...opts.map((o,i)=>i===best.i||dis.has(i)?0:Math.max(...r.alts.map(a=>f1(a,o.text)))));
          if((best.s>=.95&&best.s-second>=.02)||(best.s>=GM.speaking.choose_min&&best.s-second>=GM.speaking.choose_margin)){vs.textContent='系統聽到：「'+best.a+'」，判斷你選了 '+'ABCD'[best.i]+'。';st.byVoice=true;await E.sleep(900);res(best.i);}
          else vs.textContent='系統聽到：「'+best.a+'」，未能確定是哪一句。請讀得完整一點再試，或直接點選。';});
        nodes.push(vb,vs);}
      nodes.push(E.skipBtn(()=>res(-1)));E.actions(nodes);});
    if(pick===-1){skipped=true;break;}
    const o=opts[pick];if(o.correct)break;
    wrong++;st.wrongs++;dis.add(pick);E.emote(CH.mentor,'shake');if(turn.kenny&&wrong===1)E.emote(CH.rival,'hop');toast('再想想',o.why,'bad');
    const d=$('dialog');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}
  const right=turn.options.find(o=>o.correct);
  if(skipped){await E.say('mentor','比較好的回應是：「'+right.text+'」');}
  else{const pts=Math.max(2,GM.scoring.choice_first_try-wrong*GM.scoring.choice_wrong_penalty);st.score+=pts;hud();E.emote(CH.companion,'hop');E.flash(true);toast(wrong?'答對了 +'+pts:'說得好 +'+pts,'','ok');}
  if(!st.phrases.find(p=>p.en===right.text))st.phrases.push({en:right.text,where:sc.title});hud();
  await speak(right.text);
  if(!skipped&&st.byVoice&&!wrong){st.spoken++;st.score+=GM.scoring.speak_pass;hud();toast('讀得清楚 +'+GM.scoring.speak_pass,'你用說話選出了正確答案。','ok');st.byVoice=false;return;}
  st.byVoice=false;if(st.speak)await practise(right.text);
}
async function practise(target){
  let tries=0;
  for(;;){const act=await new Promise(async res=>{E.actions([]);await E.showLine('mentor','試試把這句說出來：');
      const t=document.createElement('p');t.className='target';t.setAttribute('lang','en');t.textContent=target;
      const nodes=[t,E.btn('mini',PLAY+'聽示範',()=>speak(target)),E.btn('next mic',MIC+'按下後開始說',()=>res('rec')),E.btn('ghost','略過，繼續對話',()=>res('skip'))];E.actions(nodes);});
    if(act==='skip')return;
    tries++;E.actions([]);E.showLine('mentor','正在聆聽……請說出句子。');$('dialog').classList.add('listening');
    const r=await listen();$('dialog').classList.remove('listening');
    if(r.err){const msg={unsupported:'此瀏覽器不支援語音辨識，建議改用桌面版 Chrome 或 Edge。','not-allowed':'未能使用咪高峰。請在瀏覽器設定中允許使用咪高峰。','no-speech':'聽不到聲音，請靠近咪高峰再試一次。'}[r.err]||'語音辨識出錯（'+r.err+'），請再試一次。';
      toast('未能辨識',msg,'bad');if(r.err==='unsupported'||r.err==='not-allowed')return;if(tries>=3)return;continue;}
    const best=r.alts.map(a=>({a,s:similarity(a,target)})).sort((x,y)=>y.s-x.s)[0];
    if(best.s>=GM.speaking.pass_ratio){st.spoken++;st.score+=GM.speaking.score_pass||GM.scoring.speak_pass;hud();E.emote(CH.companion,'hop');toast('說得很清楚 +'+GM.scoring.speak_pass,'系統聽到：「'+best.a+'」','ok');await E.sleep(600);return;}
    toast('差一點','系統聽到：「'+best.a+'」，和目標句子吻合 '+Math.round(best.s*100)+'%。再慢一點、清楚一點試試。','bad');if(tries>=3){toast('沒關係','已經練習了三次，我們繼續吧。','');return;}}
}
async function check(sc){const q=sc.check,dis=new Set();let w=0;const gk=CH.gatekeeper;gk.target.copy(LP[sc.id]).add(V(-1.2,0,.8));await E.sleep(600);
  for(;;){const i=await E.ask('gatekeeper',q.question,q.options,dis,{skip:true});if(i===-1){await E.say('gatekeeper','答案是「'+q.options[q.answer]+'」。'+q.explain);break;}
    if(i===q.answer){st.score+=Math.max(2,GM.scoring.check_first_try-w*GM.scoring.check_wrong_penalty);hud();E.emote(gk,'hop');await E.say('gatekeeper','正確。'+q.explain);break;}w++;dis.add(i);E.emote(gk,'shake');}
  place(sc.id,false);}

/* ---------- flow ---------- */
async function scene(i){
  const sc=C.scenes[i];st.scene=i;
  E.overlay('<div class="chapcard"><small>第'+E.NUM[i]+'站</small><h2>'+sc.title+'</h2><p lang="en">'+sc.en_title+'</p></div>',true);await Promise.race([E.sleep(E.RM?800:1900),new Promise(r=>$('overlay').addEventListener('click',r,{once:true}))]);E.clearOverlay();
  $('chapNo').textContent='第'+E.NUM[i]+'站';$('chapTitle').textContent=sc.title;E.setEnv(sc.env);
  labels.forEach(l=>l.el.hidden=l.k!==sc.id);mapBtn.hidden=!sc.map;
  const v=view(sc.id);vw=null;place(sc.id,false);await E.camTo(v.look.clone().add(v.off),v.look,i?3:2);st.yaw=0;vw=v;
  if(sc.id==='mtr')S.trainArrive();
  await E.say('mentor',sc.intro_zh);
  for(let t=0;t<sc.turns.length;t++)await doTurn(sc,sc.turns[t],t);
  await check(sc);
}
async function main(){
  E.start();place('cafe',true);hud();
  E.overlay('<div class="title"><div class="v" lang="en">'+C.meta.short_title+'</div><div class="v a">'+C.meta.author+'</div><div class="side"><p>'+C.meta.title_lines.join('<br>')+'</p><button class="primary" id="go">開始</button></div></div>',true);
  $('go').focus();await E.waitClick('#go');
  E.overlay('<div class="card"><h2>出發前的設定</h2><div class="cast">'+Object.values(C.npc_slots).map(x=>'<div>'+E.glyph(x.character_id)+'<p style="margin:0"><b>'+x.display_name+'</b><br><span>'+x.persona+'</span></p></div>').join('')+'</div>'+
    '<label class="opt-row"><input type="checkbox" id="ttsChk" '+(st.tts?'checked':'')+'> 讀出對白（聆聽練習）</label>'+
    '<label class="opt-row"><input type="checkbox" id="spkChk" '+(st.speak?'checked':'')+'> 開口說話練習</label>'+
    '<p class="sub privacy">開口說話會使用咪高峰，錄音由瀏覽器供應商（例如 Google 或 Apple）的語音服務即時轉成文字，本遊戲不會儲存任何錄音。如學校政策不允許，請保持關閉；之後也可以在右上角隨時開關。'+(REC?'':'<br><b>此瀏覽器不支援語音辨識。</b>')+'</p><button class="primary" id="go">出發</button></div>',true);
  await E.waitClick('#go');st.tts=$('ttsChk').checked;st.speak=$('spkChk').checked;E.clearOverlay();$('hud').hidden=false;hud();
  for(let i=Math.max(0,(window.__startScene||1)-1);i<C.scenes.length;i++)await scene(i);
  E.hideDialog();labels.forEach(l=>l.el.hidden=true);mapBtn.hidden=true;
  const tier=GM.endings.find(e=>st.score>=e.min_score).id,EN=C.endings[tier];E.flash(true);Object.values(CH).forEach(c=>E.emote(c,'hop'));await E.sleep(600);
  E.overlay('<div class="card"><p class="sub" style="margin:0">一天結束</p><h2 lang="en">'+EN.title+'</h2><p>'+EN.text+'</p><div class="stats"><div><b>'+st.score+'</b>分數</div><div><b>'+st.phrases.length+'</b>短語</div><div><b>'+st.spoken+'</b>成功說出</div></div>'+
    '<ul class="pb">'+st.phrases.map((p,i)=>'<li><button class="play" data-i="'+i+'" aria-label="播放">'+PLAY+'</button><div><b lang="en">'+p.en+'</b><span>'+p.where+'</span></div></li>').join('')+'</ul><p style="font-family:var(--serif)">'+C.npc_slots.mentor.display_name+'：'+C.debrief+'</p><button class="primary" id="again">再玩一次</button></div>',true);
  document.querySelectorAll('.pb .play').forEach(b=>b.addEventListener('click',()=>speak(st.phrases[+b.dataset.i].en)));await E.waitClick('#again');location.reload();
}
main();
})();
</script>
