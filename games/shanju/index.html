<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>山居秋暝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .title{flex-direction:column;gap:14px} .title .v{writing-mode:horizontal-tb;font-size:56px} .title .v.a{margin-left:0;align-self:center;font-size:15px;letter-spacing:.15em} .title .side{align-items:center;text-align:center} .title .side .primary{align-self:center}
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}

.scorebox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:7px 14px;display:flex;gap:16px}
.scorebox div{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.scorebox b{font-family:var(--serif);font-size:20px;color:var(--paper);font-variant-numeric:tabular-nums}
.tool{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px}
.tool svg{width:17px;height:17px}.tool:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));background:var(--panel);border:1px solid var(--panel-line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 14px;pointer-events:none;z-index:3}
#toast.ok{border-left-color:var(--jade)}#toast.bad{border-left-color:var(--cinnabar)}
#toast b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:2px}#toast.ok b{color:var(--jade)}#toast.bad b{color:#F08A74}
#toast span{font-size:14px;line-height:1.55;color:#E6DCC4}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(244,235,214,.06);border:1px solid rgba(244,235,214,.28);border-radius:10px;padding:8px 10px;font-size:14px}
.pbtn b{font-family:var(--serif);font-size:16px;color:var(--muted)}
.pbtn.float{border-color:#5AA8E0}.pbtn.float b{color:#8CC8F2}.pbtn.sink{border-color:#C98E1E}.pbtn.sink b{color:#F2C14E}
.pbtn:hover{border-color:var(--gold)}
.shaper .srow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.shaper input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.status{font-size:13px;color:var(--muted);margin:6px 0 0}
.notes{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:14px}
.notes b{font-family:var(--serif)}.notes p{font-size:14px;margin:6px 0 0;line-height:1.6;color:#4C4434}
.dt{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.dt th{text-align:left;font-weight:600;color:#6F6450;border-bottom:1px solid #D9CCAE;padding:4px 6px}
.dt td{padding:4px 6px;border-bottom:1px solid #EEE4CC}.dt td.hit{color:#2E7D62;font-weight:600}.dt td.miss{color:#B5412E;font-weight:600}
.review{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:10px}
.review li{border-left:3px solid var(--jade);padding:2px 0 2px 12px}.review b{font-family:var(--serif)}.review p{font-size:14px;margin:3px 0 0;color:#4C4434;line-height:1.6}

#ready{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:14px 26px;z-index:4}
#ready b{font-family:var(--serif);font-size:30px;letter-spacing:.2em;color:var(--paper)}
#lane{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:0 14px;z-index:3;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
#lineText{text-align:center;font-family:var(--serif);font-size:clamp(30px,6vw,46px);letter-spacing:.18em;color:rgba(244,235,214,.4);text-shadow:0 2px 10px rgba(0,0,0,.5);margin-bottom:8px}
#lineText span.on{color:var(--paper)}#lineText span.gold{color:#F2C14E}#lineText i{font-style:normal;color:var(--gold);margin:0 .2em}
#trackWrap{position:relative;height:96px;background:rgba(14,22,30,.78);border:1px solid var(--panel-line);border-radius:16px;overflow:hidden}
#hitRing{position:absolute;left:14%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border:3px solid var(--gold);border-radius:50%;box-shadow:0 0 18px rgba(224,176,75,.45)}
#track{position:absolute;inset:0}
.note{position:absolute;left:-30px;top:50%;width:60px;height:60px;margin-top:-30px;border-radius:50%;background:#F4EBD6;color:#1C1A16;font-family:var(--serif);font-weight:700;font-size:34px;display:flex;align-items:center;justify-content:center;will-change:transform}
.note.gold{background:#F2C14E;box-shadow:0 0 14px rgba(242,193,78,.7)}.note.hit{opacity:0!important;transition:opacity .15s}.note.miss{background:#6A6460;color:#3A3430}
.pmark{position:absolute;left:-3px;top:10px;bottom:10px;width:6px;border-radius:3px;background:rgba(158,197,230,.6);will-change:transform}
.pmark span{position:absolute;top:-2px;left:10px;font-size:13px;color:#9EC5E6;font-family:var(--serif)}.pmark.ok{background:#5FB49C}.pmark.bad{background:#D2553F}
.jpop{position:absolute;left:14%;top:-6px;transform:translateX(-50%);font-family:var(--serif);font-weight:700;font-size:18px;color:var(--paper);pointer-events:none;animation:jp .65s ease-out forwards}
.jpop.pf{color:#F2C14E}.jpop.ok{color:#8FE0C4}.jpop.miss{color:#F08A74}
@keyframes jp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
@media (prefers-reduced-motion: reduce){.jpop{animation:none}}
.lhint{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}
.pairs{display:flex;gap:18px}.pcol{display:flex;flex-direction:column;gap:6px;flex:1}
.pchip{background:rgba(244,235,214,.06);border:1px solid rgba(244,235,214,.3);border-radius:10px;padding:9px 12px;font-family:var(--serif);font-size:20px;color:var(--paper)}
.pchip.sel{border-color:var(--gold);background:rgba(224,176,75,.2)}.pchip.done{opacity:.4;border-color:#5FB49C}
.poem p{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0}.poem b{font-family:var(--serif);font-size:20px;letter-spacing:.1em}.poem b i{font-style:normal;color:#B98A2A}.poem b u{text-decoration:none;color:#B5412E}
.poem span{text-align:right;color:#6F6450}.poem small{grid-column:1/3;color:#6F6450}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 遊戲場景"></canvas>
  <div id="spots"></div>
  <div id="bubbles"></div>
  <header id="hud" hidden>
    <div class="chap"><span id="chapNo"></span><strong id="chapTitle"></strong></div>
    <div class="meters">
      <div class="scorebox"><div>分數<b id="score">0</b></div><div>連擊<b id="combo">0</b></div><div>準確<b id="acc">—</b></div></div>
      <button class="tool" id="soundBtn">聲音：開</button>
    </div>

  <div id="ready" hidden><b id="readyLine"></b></div>
  <section id="lane" hidden aria-label="節拍軌道，點擊或按空白鍵">
    <div id="lineText" aria-live="polite"></div>
    <div id="trackWrap"><div id="hitRing"></div><div id="track"></div></div>
    <p class="lhint">字碰到圓圈時點擊　·　「停」那一拍不要按</p>
  </section>
  <div id="toast" hidden role="status"><b id="toastT"></b><span id="toastD"></span></div>
  <div id="assistBubble" hidden role="status"></div>
  <section id="dialog" hidden aria-live="polite">
    <div class="who"><i class="dot" id="whoDot"></i><span id="whoName"></span></div>
    <p id="line"></p>
    <div id="actions"></div>
  </section>
  <div id="overlay"></div>

  const boat=new THREE.Group();boat.position.set(9.8,.1,1.6);g.add(boat);box(1.6,.25,.5,0x6A4428,0,0,0,boat);box(.06,.9,.06,0x5A3A22,.5,.5,0,boat);const fm=new E.ancientFolk({hat:'farmer',robe:0x5A6A7A});fm.position.set(-.2,.05,0);fm.scale.setScalar(.8);boat.add(fm);S.boat=boat;
  S.washers=[0,1].map(i=>{const f=E.ancientFolk({basket:true,robe:[0x8A6A9A,0x9A7A5A][i]});f.position.set(7.4+i*.7,0,-1+i*.4);f.visible=false;g.add(f);return f;});
  S.petalT=0;S.state={};S.rain=true;
  const T=(d,fn)=>new Promise(res=>{const t0=performance.now();const D=Math.max(.01,d*(window.__fast?.15:1)*1000);const f=()=>{const k=Math.min(1,(performance.now()-t0)/D);fn(k);if(k<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);});
  S.fx={
    rain:q=>{S.rain=false;return T(1.5,k=>{E.scene.children.length;});},
    autumn:q=>T(1.6,k=>S.maples.forEach(m=>m.userData.leaves.forEach((l,i)=>l.material.color.setRGB(.42+(.85-.42)*k*q,.6-(.6-.3)*k*q,.29-(.29-.12)*k*q)))),
    moon:q=>T(2.4,k=>{S.moon.position.y=2+k*10;S.moon.material.opacity=Math.min(1,k*1.4)*(.4+.6*q);S.rays.material.opacity=.14*k*q;}),
    spring:q=>{S.springOn=.3+q*.7;return T(1.6,k=>{S.springMats.forEach(m=>m.opacity=.12+(.3+.55*q)*k);});},
    bamboo:q=>{S.washers.forEach(w=>w.visible=true);S.bambooSway=q;const p0=S.washers.map(w=>w.position.clone());return T(3,k=>{S.washers.forEach((w,i)=>{w.position.set(p0[i].x+k*6,0,p0[i].z-k*5);w.rotation.y=.9;const s=Math.sin(k*30)*.45;w.userData.legs[0].rotation.x=s;w.userData.legs[1].rotation.x=-s;});}).then(()=>S.washers.forEach(w=>w.visible=false));},
    lotus:q=>{const b0=S.boat.position.clone();return T(3,k=>{S.boat.position.set(b0.x-k*6*q-.6,b0.y+Math.sin(k*20)*.03,b0.z+k*2*q);S.lotus.forEach((l,i)=>{const d=l.position.distanceTo(S.boat.position);l.position.y=.06+(d<1.4?Math.sin(k*40+i)*.06*q:0);});});},
    petals:q=>{S.petalsOn=q;return T(2.4,()=>{}).then(()=>S.petalsOn=0);},
    stay:q=>{S.hutLamp.material.emissive.setHex(0xFF9A3A);S.hutLamp.material.emissiveIntensity=q;return T(1.2,k=>{});}
  };
  S.update=(dt,t)=>{if(S.rain&&Math.random()<.9){const m=new THREE.Mesh(new THREE.BoxGeometry(.015,.3,.015),new THREE.MeshBasicMaterial({color:0xBFD8E8,transparent:true,opacity:.6}));m.position.set((Math.random()-.5)*30,8,(Math.random()-.5)*20-2);E.scene.add(m);FX.push({m,v:V(0,-12,0),g:0,life:.7,spin:0});}
    S.springTex.offset.y+=dt*(S.springOn?1.6*S.springOn:.25);S.flowTex.offset.y+=dt*(S.springOn?.5*S.springOn:.08);if(S.springOn&&Math.random()<.6*S.springOn){const sp=S.splashPts[Math.floor(Math.random()*S.splashPts.length)];const m=new THREE.Mesh(new THREE.SphereGeometry(.04,5,4),new THREE.MeshBasicMaterial({color:0xFFFFFF,transparent:true,opacity:.85}));m.position.copy(sp).add(V((Math.random()-.5)*.8,0,0));E.scene.add(m);FX.push({m,v:V((Math.random()-.5)*.8,.8+Math.random()*.8,.4+Math.random()*.6),g:5,life:.6,spin:0});}if(S.bambooSway)S.bamboo.forEach((b,i)=>b.rotation.z=Math.sin(t*3+i)*.06*S.bambooSway);
    if(S.petalsOn&&Math.random()<.3){const m=new THREE.Mesh(new THREE.PlaneGeometry(.1,.1),new THREE.MeshBasicMaterial({color:0xF8C0D0,transparent:true,side:THREE.DoubleSide}));m.position.set(-4+Math.random()*8,4,-4+Math.random()*6);E.scene.add(m);FX.push({m,v:V(.3,-.5,0),g:0,life:5,spin:3});}};
  this._S=S;return S;};
})();
</script>
<script>/* Rhythm mode: recite a poem on the beat; each line brings the scene to life */
(function(){
"use strict";
const E=ENG,$=E.$,V=(x,y,z)=>new THREE.Vector3(x,y,z);
const C=JSON.parse($('d-content').textContent),W=JSON.parse($('d-world').textContent),GM=JSON.parse($('d-game').textContent);
const RH=C.rhythm,J=GM.judge,SC=GM.scoring;
const st={score:0,combo:0,maxCombo:0,lines:[],playing:false,notes:[],pauses:[],t0:0,res:null,checks:0};
window.__rhy=st;
E.init({canvas:$('scene'),onResize:()=>{},onFrame});E.bindDialog();E.parallax=.15;E.setEnv('anc_dusk',true);
E.SPK={narrator:{name:'你',col:'#F4EBD6'}};
Object.entries(C.npc_slots).forEach(([s,d])=>E.SPK[s]={name:d.display_name,col:E.hex(E.PAL[d.character_id][0])});
const S=E.kits[W.scene_kit].rhythmBuild(W);
Object.entries(C.npc_slots).forEach(([s,d])=>{const c=E.makeChar(s,d.character_id,d.costume);const l=W.npc_layout[s];c.root.position.set(...l);c.target.copy(c.root.position);});
const P=E.makeChar('player','P',[]);P.root.position.set(...W.npc_layout.player);P.target.copy(P.root.position);P.root.rotation.y=Math.PI;
const CH=E.chars;E.lampValue=()=>Math.min(1,.2+st.combo*.08);
let camHome={p:V(0,5.4,15.5),l:V(0,1.8,-3)};E.camera.position.copy(camHome.p);E.cam.look.copy(camHome.l);

/* audio: plucked-string synthesis */
let AC=null;const PENTA=[261.6,293.7,329.6,392,440,523.3,587.3,659.3];
function audio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}
function pluck(f,vol,dur){if(!AC||!st.sound)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),flt=AC.createBiquadFilter();o.type='triangle';o.frequency.value=f;flt.type='lowpass';flt.frequency.setValueAtTime(f*6,t);flt.frequency.exponentialRampToValueAtTime(f*1.2,t+(dur||1.2));
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.25,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+(dur||1.2));o.connect(flt);flt.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(dur||1.2)+.05);}
function tick(){if(!AC||!st.sound)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=1200;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0005,t+.05);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.06);}
st.sound=true;$('soundBtn').addEventListener('click',()=>{st.sound=!st.sound;$('soundBtn').textContent='聲音：'+(st.sound?'開':'關');});

/* camera & frame */
function onFrame(dt,t){S.update(dt,t);if(E.kits.ancient_town.onFrame)E.kits.ancient_town.onFrame(dt,t);if(st.playing)laneFrame();}
E.cam.idle=()=>{};

/* hud */
function hud(){$('score').textContent=st.score;$('combo').textContent=st.combo;const all=st.lines.filter(l=>l.acc!=null);$('acc').textContent=all.length?Math.round(all.reduce((s,l)=>s+l.acc,0)/all.length*100)+'%':'—';}
let toastT=null;function toast(title,text,cls){const el=$('toast');el.className=cls||'';$('toastT').textContent=title;$('toastD').textContent=text||'';el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3000);}
function pop(txt,cls){const el=document.createElement('div');el.className='jpop '+(cls||'');el.textContent=txt;$('lane').appendChild(el);setTimeout(()=>el.remove(),650);}

/* lane */
const now=()=>performance.now()/1000;
function playLine(line,clozeOK){return new Promise(res=>{
  const spb=60/RH.bpm*(window.__fast?.35:1),chars=[...line.text],lead=RH.lead_beats*spb;st.notes=[];st.pauses=[];const lane=$('lane'),track=$('track');track.innerHTML='';lane.hidden=false;
  $('lineText').innerHTML=chars.map((ch,i)=>'<span data-i="'+i+'">'+(i===chars.length-1&&line.cloze&&!clozeOK?'＿':ch)+'</span>'+(i===RH.pause_after-1?'<i>／</i>':'')).join('');
  let beat=0;chars.forEach((ch,i)=>{const n={i,ch,t:lead+beat*spb,hit:null,el:document.createElement('div'),rhyme:line.rhyme&&i===chars.length-1};n.el.className='note'+(n.rhyme?' gold':'');n.el.textContent=ch;track.appendChild(n.el);st.notes.push(n);beat++;
    if(i===RH.pause_after-1){const p={t:lead+beat*spb,el:document.createElement('div'),rushed:false,done:false};p.el.className='pmark';p.el.innerHTML='<span>停</span>';track.appendChild(p.el);st.pauses.push(p);beat++;}});
  st.spb=spb;st.lead=lead;st.lineEnd=lead+beat*spb+.5;st.t0=now();st.playing=true;st.res=()=>{st.playing=false;lane.hidden=true;res();};
  st.beatIdx=-1;});}
function laneFrame(){const t=now()-st.t0,W0=$('track').clientWidth,hitX=W0*.14,pxs=(W0-hitX)/(RH.lead_beats*st.spb)*.95;
  const b=Math.floor((t-st.lead)/st.spb);if(b>st.beatIdx&&t>=st.lead-.02){st.beatIdx=b;tick();}
  st.notes.forEach(n=>{const x=hitX+(n.t-t)*pxs;n.el.style.transform='translateX('+x+'px)';n.el.style.opacity=x<-40?0:1;
    if(window.__auto&&n.hit==null&&t>=n.t-.02&&t<=n.t+J.good)tap(true);
    if(n.hit==null&&t>n.t+J.good){n.hit='miss';n.el.classList.add('miss');st.combo=0;pop('漏拍','miss');hud();}});
  st.pauses.forEach(p=>{const x=hitX+(p.t-t)*pxs;p.el.style.transform='translateX('+x+'px)';p.el.style.opacity=x<-40?0:1;
    if(!p.done&&t>p.t+J.good){p.done=true;if(!p.rushed){st.score+=SC.pause_bonus;pop('停頓得好','ok');p.el.classList.add('ok');}hud();}});
  if(t>st.lineEnd&&st.res){const r=st.res;st.res=null;r();}}
function tap(auto){if(!st.playing)return;audio();const t=now()-st.t0;
  let best=null,bd=9;st.notes.forEach(n=>{if(n.hit==null){const d=Math.abs(n.t-t);if(d<bd){bd=d;best=n;}}});
  if(best&&bd<=J.good){const perfect=bd<=J.perfect;best.hit=perfect?'perfect':'good';best.el.classList.add('hit');st.combo++;st.maxCombo=Math.max(st.maxCombo,st.combo);
    st.score+=(perfect?SC.perfect:SC.good)+(best.rhyme?SC.rhyme_bonus:0)+Math.min(10,st.combo);pluck(PENTA[(best.i*2+st.lines.length)%PENTA.length],best.rhyme?.35:.22,best.rhyme?2:1.2);
    const sp=$('lineText').querySelector('span[data-i="'+best.i+'"]');if(sp){sp.classList.add('on');if(best.rhyme)sp.classList.add('gold');}pop(perfect?'完美':'不錯',perfect?'pf':'ok');hud();return;}
  const p=st.pauses.find(p=>!p.done&&Math.abs(p.t-t)<=J.good*1.4);if(p&&!auto){p.rushed=true;p.el.classList.add('bad');st.score=Math.max(0,st.score+SC.rush_penalty);st.combo=0;pop('搶拍！','miss');E.emote(CH.rival,'hop');hud();}}
$('lane').addEventListener('pointerdown',e=>{e.preventDefault();tap();});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='KeyJ'||e.code==='KeyF')&&st.playing){e.preventDefault();tap();}});

/* activities */
async function cloze(line){const opts=E.shuffle(line.cloze.options),right=[...line.text].pop();const dis=new Set();let first=true;
  for(;;){const i=await E.ask('companion','下一句的最後一個字是韻腳。「'+line.text.slice(0,-1)+'＿」應該填哪一個字？',opts,dis,{skip:true});
    if(i===-1){await E.say('companion','是「'+right+'」。'+C.rhyme_explain);return false;}
    if(opts[i]===right){if(first)st.score+=SC.cloze;hud();toast('押韻了！','「'+right+'」和前面的韻腳同屬一個韻。','ok');return true;}
    first=false;dis.add(i);E.emote(CH.rival,'hop');toast('讀起來不押韻',C.rhyme_explain,'bad');}}
async function pairs(stz){const P2=stz.pairs;const L=E.shuffle(P2.map(p=>p[0])),R=E.shuffle(P2.map(p=>p[1]));const done=new Set();let sel=null,wrong=0;
  await new Promise(async res=>{E.actions([]);await E.showLine('mentor','這一聯是對仗。把上句和下句相對的詞語配成一對。');const w=document.createElement('div');w.className='pairs';
    const colL=document.createElement('div'),colR=document.createElement('div');colL.className=colR.className='pcol';w.append(colL,colR);
    const draw=()=>{colL.innerHTML='';colR.innerHTML='';L.forEach(x=>{const b=E.btn('pchip'+(done.has(x)?' done':'')+(sel===x?' sel':''),x,()=>{if(done.has(x))return;sel=x;draw();});colL.appendChild(b);});
      R.forEach(y=>{const isDone=[...done].some(x=>P2.find(p=>p[0]===x)[1]===y);const b=E.btn('pchip'+(isDone?' done':''),y,()=>{if(!sel||isDone)return;const ok=P2.find(p=>p[0]===sel)[1]===y;if(ok){done.add(sel);st.score+=SC.pair;pluck(PENTA[done.size+2],.25,1.4);hud();}else{wrong++;toast('不相對',sel+'和'+y+'在句中的位置或詞性不同。','bad');}sel=null;draw();if(done.size===P2.length)setTimeout(res,500);});colR.appendChild(b);});};
    draw();E.actions([w,E.skipBtn(()=>{P2.forEach(p=>done.add(p[0]));draw();setTimeout(res,600);})]);});
  E.actions([]);toast('對仗完成',P2.map(p=>p[0]+'↔'+p[1]).join('　'),'ok');}
async function check(q){const dis=new Set();let w=0;for(;;){const i=await E.ask('gatekeeper',q.question,q.options,dis,{skip:true});if(i===-1){await E.say('gatekeeper','答案是「'+q.options[q.answer]+'」。'+q.explain);return;}
  if(i===q.answer){st.score+=Math.max(2,SC.check_first_try-w*SC.check_wrong_penalty);hud();E.emote(CH.gatekeeper,'hop');await E.say('gatekeeper','正確。'+q.explain);return;}w++;dis.add(i);E.emote(CH.gatekeeper,'shake');}}

/* flow */
async function doLine(line){let clozeOK=true;if(line.cloze)clozeOK=await cloze(line);E.hideDialog();
  const cam=W.line_cams[line.fx];if(cam)await E.camTo(V(...cam[0]),V(...cam[1]),1.6);
  let tries=0,acc=0;for(;;){tries++;$('ready').hidden=false;$('readyLine').textContent='準備：'+line.text.slice(0,RH.pause_after)+'／'+line.text.slice(RH.pause_after);await E.sleep(window.__fast?200:1300);$('ready').hidden=true;
    await playLine(line,clozeOK);const n=st.notes;acc=n.reduce((s,x)=>s+(x.hit==='perfect'?1:x.hit==='good'?.6:0),0)/n.length;const rush=st.pauses.some(p=>p.rushed);if(rush)acc=Math.max(0,acc-.2);
    if(acc>=GM.alive_threshold||tries>=2||!GM.retry_allowed)break;
    const r=await new Promise(async res=>{E.actions([]);await E.showLine('mentor','這句唸得有點亂'+(rush?'，在二三停頓的地方搶拍了':'')+'。要不要再唸一次？');E.actions([E.btn('next','再唸一次',()=>res(1)),E.btn('ghost','繼續',()=>res(0))]);});E.hideDialog();if(!r)break;}
  const q=acc>=GM.alive_threshold?1:.4;st.lines.push({text:line.text,gloss:line.gloss,acc});hud();await S.fx[line.fx](q);
  toast(q===1?'詩句活起來了':'景物淡淡的',line.gloss,q===1?'ok':'');if(q===1)E.flash(true);await E.sleep(window.__fast?200:900);}
async function main(){
  E.start();
  E.overlay('<div class="title"><div class="v">'+C.meta.short_title+'</div><div class="v a">'+C.meta.author+'</div><div class="side"><p>'+C.meta.title_lines.join('<br>')+'</p><button class="primary" id="go">開始</button></div></div>',true);
  $('go').focus();await E.waitClick('#go');audio();
  E.overlay('<div class="card"><h2>詩社練習</h2><div class="cast">'+Object.values(C.npc_slots).map(x=>'<div>'+E.glyph(x.character_id)+'<p style="margin:0"><b>'+x.display_name+'</b><br><span>'+x.persona+'</span></p></div>').join('')+'</div>'+
    '<p class="sub">字會從右邊移向左邊的圓圈，在字碰到圓圈時點擊下方的軌道（電腦可按空白鍵）。第二個字之後有一個「停」：那一拍不要按，這就是五言詩的二三停頓。金色的字是韻腳。唸得準，那一句描寫的景物就會在山中出現。</p><button class="primary" id="go">入山</button></div>',true);
  await E.waitClick('#go');E.clearOverlay();$('hud').hidden=false;hud();
  await E.say('mentor','雨剛停，山裡很靜。跟著拍子，把這首詩唸出來，你會看見詩裡的景色。');
  for(let si=Math.max(0,(window.__startStanza||1)-1);si<C.stanzas.length;si++){const stz=C.stanzas[si];$('chapNo').textContent=stz.name;$('chapTitle').textContent=stz.lines.map(l=>l.text).join('，');
    E.overlay('<div class="chapcard"><small>'+stz.name+'</small><h2>'+stz.lines.map(l=>l.text).join('<br>')+'</h2></div>',true);await Promise.race([E.sleep(window.__fast?300:1800),new Promise(r=>$('overlay').addEventListener('click',r,{once:true}))]);E.clearOverlay();
    E.emote(CH.rival,'hop');await E.say('rival',stz.rival);
    for(const line of stz.lines)await doLine(line);
    await E.camTo(camHome.p,camHome.l,1.4);if(stz.pairs)await pairs(stz);await check(stz.check);}
  E.hideDialog();const acc=st.lines.reduce((s,l)=>s+l.acc,0)/st.lines.length;const tier=GM.endings.find(e=>acc>=e.min_acc).id,EN=C.endings[tier];
  E.flash(true);Object.values(CH).forEach(c=>E.emote(c,'hop'));await E.sleep(600);
  E.overlay('<div class="card"><p class="sub" style="margin:0">朗誦完成</p><h2>'+EN.title+'</h2><p>'+EN.text+'</p><div class="stats"><div><b>'+Math.round(acc*100)+'%</b>準確度</div><div><b>'+st.score+'</b>分數</div><div><b>'+st.maxCombo+'</b>最高連擊</div></div>'+
    '<div class="poem">'+C.stanzas.map(s=>s.lines.map(l=>{const r=st.lines.find(x=>x.text===l.text);return '<p><b>'+l.text.slice(0,RH.pause_after)+'<i>／</i>'+l.text.slice(RH.pause_after,-1)+(l.rhyme?'<u>'+l.text.slice(-1)+'</u>':l.text.slice(-1))+'</b><span>'+(r?Math.round(r.acc*100)+'%':'')+'</span><small>'+l.gloss+'</small></p>';}).join('')).join('')+'</div>'+
    '<p style="font-family:var(--serif)">王維：'+C.debrief+'</p><button class="primary" id="again">再唸一次</button></div>',true);
  await E.waitClick('#again');location.reload();
}
main();
})();
</script>
