<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 訓練營</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .title{flex-direction:column;gap:14px} .title .v{writing-mode:horizontal-tb;font-size:56px} .title .v.a{margin-left:0;align-self:center;font-size:15px;letter-spacing:.15em} .title .side{align-items:center;text-align:center} .title .side .primary{align-self:center}
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}

.scorebox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:7px 14px;display:flex;gap:16px}
.scorebox div{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.scorebox b{font-family:var(--serif);font-size:20px;color:var(--paper);font-variant-numeric:tabular-nums}
.tool{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px}
.tool svg{width:17px;height:17px}.tool:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));background:var(--panel);border:1px solid var(--panel-line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 14px;pointer-events:none;z-index:3}
#toast.ok{border-left-color:var(--jade)}#toast.bad{border-left-color:var(--cinnabar)}
#toast b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:2px}#toast.ok b{color:var(--jade)}#toast.bad b{color:#F08A74}
#toast span{font-size:14px;line-height:1.55;color:#E6DCC4}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(244,235,214,.06);border:1px solid rgba(244,235,214,.28);border-radius:10px;padding:8px 10px;font-size:14px}
.pbtn b{font-family:var(--serif);font-size:16px;color:var(--muted)}
.pbtn.float{border-color:#5AA8E0}.pbtn.float b{color:#8CC8F2}.pbtn.sink{border-color:#C98E1E}.pbtn.sink b{color:#F2C14E}
.pbtn:hover{border-color:var(--gold)}
.shaper .srow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.shaper input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.status{font-size:13px;color:var(--muted);margin:6px 0 0}
.notes{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:14px}
.notes b{font-family:var(--serif)}.notes p{font-size:14px;margin:6px 0 0;line-height:1.6;color:#4C4434}
.dt{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.dt th{text-align:left;font-weight:600;color:#6F6450;border-bottom:1px solid #D9CCAE;padding:4px 6px}
.dt td{padding:4px 6px;border-bottom:1px solid #EEE4CC}.dt td.hit{color:#2E7D62;font-weight:600}.dt td.miss{color:#B5412E;font-weight:600}
.review{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:10px}
.review li{border-left:3px solid var(--jade);padding:2px 0 2px 12px}.review b{font-family:var(--serif)}.review p{font-size:14px;margin:3px 0 0;color:#4C4434;line-height:1.6}
.status.big{font-size:16px;font-weight:700;margin:0;color:var(--paper)}
.seg{display:flex;flex-wrap:wrap;gap:8px}.segb{background:rgba(255,255,255,.08);border:2px solid var(--gold);color:var(--paper);border-radius:12px;padding:9px 16px;font-size:15px;cursor:pointer}.segb:hover{background:rgba(224,176,75,.2)}.segb.done{border-color:#5FD08A;color:#BFF0D0}
.bars{display:flex;flex-direction:column;gap:6px;min-width:min(420px,100%)}.br{display:grid;grid-template-columns:7.5em 1fr 3.4em;gap:8px;align-items:center;font-size:14px}.bl{color:var(--paper)}.bt{height:14px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}.bt i{display:block;height:100%;border-radius:999px;animation:bg .9s ease-out both}@keyframes bg{from{width:0}}.br b{text-align:right;color:#FFE08A}
.photos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%}.ph{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 2px;cursor:pointer;color:var(--paper)}.ph .pi{font-size:26px}.ph .pl{font-size:12px}.ph.ok{border-color:#5FD08A}
@media (max-width:620px){.photos{grid-template-columns:repeat(4,minmax(0,1fr))}.br{grid-template-columns:6em 1fr 3em;font-size:13px}}
.shop{display:flex;flex-direction:column;gap:8px;width:100%}.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.grp b{width:4.6em;color:#FFE08A;font-size:14px}.opt2{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);color:var(--paper);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}.opt2 small{color:#FFE08A;margin-left:4px}.opt2.on{background:#2E8A5A;border-color:#5FD08A}
.budget{position:relative;height:26px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}.budget i{position:absolute;left:0;top:0;bottom:0;background:#3ACB5A;opacity:.55}.budget span{position:relative;z-index:1;display:block;text-align:center;line-height:26px;font-weight:700;font-size:14px}.budget.over i{background:#D8322A}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.three div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px}.three b{display:block;color:#FFE08A}.three span{font-size:13px}
.tw{max-height:50vh;overflow:auto}.dt{width:100%;border-collapse:collapse;font-size:13px}.dt th,.dt td{border-bottom:1px solid rgba(255,255,255,.15);padding:5px 6px;text-align:left}
#notebook b{margin-left:6px;background:var(--gold);color:#1B1408;border-radius:999px;padding:0 7px;font-size:12px}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 遊戲場景"></canvas>
  <div id="spots"></div>
  <div id="bubbles"></div>
  <header id="hud" hidden>
    <div class="chap"><span id="chapNo"></span><strong id="chapTitle"></strong></div>
    <div class="meters">
      <div class="scorebox"><div>分數<b id="score">0</b></div><div>預測命中<b id="acc">0/0</b></div></div>
      <button class="tool" id="assist" disabled aria-label="學伴提示，扣兩分"><svg viewBox="0 0 24 24" fill="none" stroke="#E0B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>學伴提示</button>
      <button class="pill" id="notebook" aria-label="實驗記錄"><span>實驗記錄</span><b id="nbCount">0</b></button>
    </div>
  </header>
  <div id="toast" hidden role="status"><b id="toastT"></b><span id="toastD"></span></div>
  <div id="assistBubble" hidden role="status"></div>
  <section id="dialog" hidden aria-live="polite">
    <div class="who"><i class="dot" id="whoDot"></i><span id="whoName"></span></div>
    <p id="line"></p>
    <div id="actions"></div>
  </section>
  <div id="overlay"></div>
</div>

      const y=eyeObjs[0].y;box(Math.abs(eyeObjs[1].x-eyeObjs[0].x)-.1,.018,.012,0xD8E6EE,(eyeObjs[0].x+eyeObjs[1].x)/2,y,.27,body);}

      const lb=mesh(new THREE.SphereGeometry(.5,14,10),M(0xC8452F,{emissive:0xFF7A2A}),0,0,0,lg);lb.scale.set(.3,.36,.3);
      mesh(new THREE.CylinderGeometry(.1,.1,.06,10),M(0xE0B04B),0,.2,0,lg);mesh(new THREE.CylinderGeometry(.1,.1,.06,10),M(0xE0B04B),0,-.2,0,lg);

E.emote=function(c,type){c.emote=type;c.emoteT=0;};
E.lookFocus=null;E.lampValue=()=>.6;
const tv=new THREE.Vector3(),tv2=new THREE.Vector3(),tv3=new THREE.Vector3();
function updateChar(c,dt,t){
  const p=c.root.position;tv.copy(c.target).sub(p);tv.y=0;const dist=tv.length();let moving=false;
  if(dist>.04){moving=true;p.addScaledVector(tv.normalize(),Math.min(dist,c.speed*dt));}

    if(c.emote==='hop')by+=Math.max(0,Math.sin(e*9))*.35*Math.max(0,1-e/1.1);

    if(c.emote==='slump'){const f=Math.max(0,1-Math.max(0,e-1.2)/.6);sy-=.12*Math.sin(Math.min(1,e/.5)*Math.PI/2)*f;sx+=.06*f;}
    if(e>1.9)c.emote=null;}

  c.blinkAt-=dt;if(c.blinkAt<0){c.blinkT=.14;c.blinkAt=2+Math.random()*3.5;}

  let look;if(c.lookAt)look=tv2.copy(c.lookAt);else if(E.lookFocus&&E.lookFocus!==c)look=tv2.copy(E.lookFocus.root.position).add(tv3.set(0,1.3,0));else look=tv2.copy(camera.position);

  if(c.lamp){const b=E.lampValue();c.lamp.light.intensity=.25+b*1.9;if(c.lamp.beacon){c.lamp.mat.emissive.setRGB(.9-b*.8,.15+b*.6,.1+b*.3);c.lamp.light.color.setRGB(1-b*.5,.3+b*.7,.3+b*.45);}else{c.lamp.mat.emissive.setRGB(.25+b*.75,.12+b*.36,.04);c.lamp.g.position.y=1.35+Math.sin(t*1.6)*.06;c.lamp.g.rotation.z=Math.sin(t*1.3)*.08;}}
}

/* camera */

/* occlusion fade: anything between the camera and what it looks at becomes see-through */
E.fade={on:true,extra:null,list:new Map(),tick:0};
const fray=new THREE.Raycaster(),fdir=new THREE.Vector3();
function occlusion(dt){const F=E.fade;if(!F.on||!scene)return;const now=performance.now();F.tick++;
  for(const k in E.chars){const c=E.chars[k];if(c&&c.root)c.root.userData.isChar=true;}
  if(F.tick%4===0){const tg=[cam.look].concat(F.extra||[]);

        if(p&&((p.width&&p.width>30)||(p.radius&&p.radius>30)))continue;
        let rec=F.list.get(m);if(!rec){const src=m.material,cl=src.clone();cl.transparent=true;cl.depthWrite=false;rec={src,cl,base:src.transparent?src.opacity:1};cl.opacity=rec.base;m.material=cl;F.list.set(m,rec);}rec.seen=now;}}}
  F.list.forEach((rec,m)=>{const hid=now-rec.seen<450;const want=hid?Math.min(rec.base,.22):rec.base;rec.cl.opacity+=(want-rec.cl.opacity)*Math.min(1,dt*9);
    if(!hid&&Math.abs(rec.cl.opacity-rec.base)<.03){m.material=rec.src;rec.cl.dispose();F.list.delete(m);}});}

/* responsive camera: fit the landscape framing on narrow screens; swipe left/right to see the rest */
E.resp={on:true,baseFov:46,maxFov:80,keep:.85,pan:0,panLim:0,allowPan:true,off:null};
const rv=new THREE.Vector3(),rl=new THREE.Vector3();

      camera.position.add(rv);R.off=rv.clone();camera.lookAt(rl.copy(cam.look).add(rv));camera.updateMatrixWorld();}}
    else R.pan=0;}
  if(R.on){const h=E.$('panHint');if(h){if(hint&&!R.hintAt)R.hintAt=performance.now();h.hidden=!(hint&&performance.now()-R.hintAt<5000);}}}
(function(){let drag=null;const hint=document.createElement('div');hint.id='panHint';hint.hidden=true;hint.setAttribute('aria-hidden','true');hint.textContent='← 左右滑動查看 →';
  hint.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:rgba(20,28,36,.78);color:#FFE08A;font:700 14px system-ui,sans-serif;padding:6px 14px;border-radius:999px;z-index:6;pointer-events:none';

(function(){
"use strict";
const E=ENG;E.kits=E.kits||{};const V=(x,y,z)=>new THREE.Vector3(x,y,z);

  if(kind==='timber'){c.fillStyle='#EFE6D2';c.fillRect(0,0,w,h);c.fillStyle='#4A3424';[0,62,124].forEach(x=>c.fillRect(x,0,6,h));c.fillRect(0,0,w,6);c.fillRect(0,62,w,6);c.fillRect(0,122,w,6);c.save();c.lineWidth=5;c.strokeStyle='#4A3424';c.beginPath();c.moveTo(6,68);c.lineTo(62,122);c.moveTo(68,122);c.lineTo(124,68);c.stroke();c.restore();c.fillStyle='#5A7A9A';c.fillRect(20,18,24,30);c.fillRect(84,18,24,30);}

function acc(alg,n,noise,night,hw){const A=MD.algs[alg],ch=MD.chance;const learn=1-Math.exp(-3*n/A.need);const clean=ch+(A.cap-ch)*learn;
  const t=n*A.cost/MD.hw[hw].speed;const p=t>0?Math.min(1,MD.time_limit/t):1;const a=ch+(clean-ch)*Math.pow(p,.7)-noise*A.noise_sens;
  const day=Math.max(ch,a),ngt=night?day:ch+(day-ch)*MD.night_without;return {day,night:ngt,time:t,done:p>=1,progress:p};}

async function train(alg,hw,n,noise,night){await go('lab');const g=HW[hw];st.hwGlow.position.copy(g.getWorldPosition(V())).setY(.03);st.hwGlow.material.opacity=.9;

  const p=document.createElement('p');p.className='status big';E.actions([p]);let ok=0;
  for(let i=0;i<n;i++){const kind=kinds[i%3],it=ITEM[kind]();const cv=st.conveyor.g;const start=cv.localToWorld(V(-3.6,st.conveyor.y,st.conveyor.z)),mid=cv.localToWorld(V(-.4,st.conveyor.y,st.conveyor.z));it.position.copy(start);E.scene.add(it);

  await E.say('mentor','打開照片看看：有些照片的標籤貼錯了。把貼錯的找出來，點擊改成正確的類別。');await labelTask();
  const b=await cycle({alg:'tree',hw:'gpu',n:2000,noise:0,night:false},'已修正標籤 · 只有日間照片',false);
  await results('修正標籤後，日間準確率升到 '+pct(b.day)+'。',[{label:'未檢查標籤',v:a.day,col:'#E8A01A'},{label:'已修正標籤',v:b.day}]);
  await E.say('companion','晚上回收站也會開放。我們在晚上測試一下。');const nightA=await test(b,true);E.setEnv('world_day');st.isNight=false;logRun('夜間測試（只有日間照片）',{day:b.day,night:b.night,time:b.time},{});
  E.emote(CH.companion,'shake');await results('晚上準確率只有 '+pct(nightA)+'！',[{label:'日間',v:b.day},{label:'夜間',v:nightA,col:'#D8322A'}],'所有訓練照片都在日間拍攝，AI 從沒見過夜間的樣子。');
  await choice('怎樣改善？',[{v:1,label:'在晚上拍攝更多照片，加入訓練數據'}]);await photograph(500,true);
  const c=await cycle({alg:'tree',hw:'gpu',n:2000,noise:0,night:true},'已修正標籤 · 日間＋夜間照片',true);
  await results('加入夜間照片後：',[{label:'日間',v:c.day},{label:'夜間',v:c.night}],'數據要正確，也要涵蓋實際會遇到的各種情況。');}
function labelTask(){return new Promise(async res=>{const kinds=['paper','metal','plastic'],nm={paper:'廢紙',metal:'金屬',plastic:'塑膠'},icon={paper:'📰',metal:'🥫',plastic:'🧴'};
  const cards=[];for(let i=0;i<12;i++){const k=kinds[i%3];cards.push({k,lab:k});}[2,5,9].forEach((i,j)=>{cards[i].lab=kinds[(kinds.indexOf(cards[i].k)+1+j%2)%3];});
  const draw=async()=>{E.actions([]);await E.showLine('companion','點擊標籤貼錯的照片，改成正確類別。（還有 '+cards.filter(c=>c.lab!==c.k).length+' 張貼錯）');const g=document.createElement('div');g.className='photos';
    cards.forEach((c,i)=>{const b=E.btn('ph'+(c.fixed?' ok':''),'<span class="pi">'+icon[c.k]+'</span><span class="pl">'+nm[c.lab]+'</span>',()=>{if(c.lab===c.k){toast('這張標籤正確','',' ');return;}c.lab=c.k;c.fixed=true;addScore(SC.fix_label);if(cards.every(x=>x.lab===x.k)){E.actions([]);E.say('companion','全部修正了！其餘照片我用同樣方法檢查好了。').then(res);}else draw();});g.appendChild(b);});
    E.actions([g,E.skipBtn(()=>{cards.forEach(c=>c.lab=c.k);res();})]);if(window.__auto)setTimeout(()=>{cards.forEach(c=>c.lab=c.k);E.actions([]);res();},300);};draw();});}
async function r3(){st.hint='三種演算法都試，再比較只有二十張照片時的表現。';const done={},res={};const names={rule:'簡單規則',tree:'決策樹',nn:'神經網絡'};
  while(Object.keys(done).length<3){const alg=await choice('選擇演算法（二千張照片、遊戲電腦）。三種都試試。',['rule','tree','nn'].map(v=>({v,label:names[v],done:done[v]})));
    if(alg==='rule')await E.say('mentor','簡單規則：例如「藍色的就是廢紙、有金屬光澤的就是金屬」。');
    const r=await cycle({alg,hw:'gpu',n:2000,noise:0,night:true},names[alg]+' · 2000 張',false);done[alg]=1;res[alg]=r.day;await results(names[alg]+'：'+pct(r.day),Object.keys(res).map(k=>({label:names[k],v:res[k]})));}
  await E.say('mentor','神經網絡最好。不過，如果只有二十張照片呢？');const a=await cycle({alg:'nn',hw:'gpu',n:20,noise:0,night:true},'神經網絡 · 20 張',false);const b=acc('tree',20,0,true,'gpu');logRun('決策樹 · 20 張',b,{});
  await results('只有二十張照片時：',[{label:'神經網絡',v:a.day,col:'#E8A01A'},{label:'決策樹',v:b.day}],'複雜的演算法需要更多數據才能學好；演算法要配合數據。');}
async function r4(){st.hint='三種電腦都試，留意訓練能否在三十分鐘內完成。';const done={},res={};
  while(Object.keys(done).length<3){const hw=await choice('選擇電腦（神經網絡、二千張照片，限時三十分鐘）。三種都試試。',['laptop','gpu','cloud'].map(v=>({v,label:MD.hw[v].name,done:done[v]})));
    const r=await cycle({alg:'nn',hw,n:2000,noise:0,night:true},MD.hw[hw].name,false);done[hw]=1;res[hw]=r;await results(MD.hw[hw].name+'：'+pct(r.day)+'（需要 '+(r.time<.05?'即時':r.time.toFixed(1)+' 分鐘')+'）',Object.keys(res).map(k=>({label:MD.hw[k].name,v:res[k].day})));}
  E.emote(CH.rival,'hop');await E.say('rival','咁用雲端，唔使檢查標籤都得啦？');const r=await cycle({alg:'nn',hw:'cloud',n:2000,noise:MD.raw_noise,night:true},'雲端 · 未檢查標籤',false);
  await results('雲端運算 + 未檢查標籤：'+pct(r.day),[{label:'雲端＋正確標籤',v:res.cloud.day},{label:'雲端＋錯誤標籤',v:r.day,col:'#E8A01A'}],'運算能力決定能否及時完成訓練，但不能修正數據的錯誤。');}
async function r5(){const B=C.budget,I=Object.fromEntries(B.items.map(i=>[i.id,i]));const sel={data:'d200',night:false,clean:false,alg:'tree',hw:'laptop'};st.hint='日夜都要 90%：想想數據的數量、質素和多樣性，演算法的上限，以及訓練時間。';
  for(let attempt=1;;attempt++){const cfg=await new Promise(async res=>{E.actions([]);await E.showLine('mentor','分配 100 點預算，然後開始訓練。目標：日間和夜間都達到 90%，並在三十分鐘內完成。');
      const w=document.createElement('div');w.className='shop';const draw=()=>{const cost=I[sel.data].cost+(sel.night?I.night.cost:0)+(sel.clean?I.clean.cost:0)+I[sel.alg].cost+I[sel.hw].cost;
        w.innerHTML='<div class="grp"><b>數據</b>'+['d200','d2000'].map(k=>'<button data-g="data" data-k="'+k+'" class="opt2'+(sel.data===k?' on':'')+'">'+I[k].name+' <small>'+I[k].cost+'</small></button>').join('')+'<button data-t="night" class="opt2'+(sel.night?' on':'')+'">'+I.night.name+' <small>'+I.night.cost+'</small></button><button data-t="clean" class="opt2'+(sel.clean?' on':'')+'">'+I.clean.name+' <small>'+I.clean.cost+'</small></button></div>'+
          '<div class="grp"><b>演算法</b>'+['rule','tree','nn'].map(k=>'<button data-g="alg" data-k="'+k+'" class="opt2'+(sel.alg===k?' on':'')+'">'+I[k].name+' <small>'+I[k].cost+'</small></button>').join('')+'</div>'+
          '<div class="grp"><b>運算能力</b>'+['laptop','gpu','cloud'].map(k=>'<button data-g="hw" data-k="'+k+'" class="opt2'+(sel.hw===k?' on':'')+'">'+I[k].name+' <small>'+I[k].cost+'</small></button>').join('')+'</div>'+
          '<div class="budget'+(cost>B.total?' over':'')+'"><span>已用 '+cost+' / '+B.total+' 點</span><i style="width:'+Math.min(100,cost)+'%"></i></div>';
        w.querySelectorAll('button[data-g]').forEach(b=>b.onclick=()=>{sel[b.dataset.g]=b.dataset.k;draw();});w.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{sel[b.dataset.t]=!sel[b.dataset.t];draw();});
        go2.disabled=cost>B.total;};const go2=E.btn('next','開始訓練',()=>res({...sel}));draw();E.actions([w,go2,E.skipBtn(()=>{Object.assign(sel,{data:'d2000',night:true,clean:true,alg:'nn',hw:'gpu'});res({...sel});})]);
      if(window.__auto)setTimeout(()=>{if(attempt===1)res({data:'d2000',night:false,clean:true,alg:'nn',hw:'cloud',_over:true});else{Object.assign(sel,{data:'d2000',night:true,clean:true,alg:'nn',hw:'gpu'});res({...sel});}},200);});
    const n=I[cfg.data].n;const label=[I[cfg.data].name,cfg.night?'夜間照片':'',cfg.clean?'檢查標籤':'',I[cfg.alg].name,I[cfg.hw].name].filter(Boolean).join(' · ');
    await photograph(n,false);if(cfg.night)await photograph(500,true);const r=await cycle({alg:cfg.alg,hw:cfg.hw,n,noise:cfg.clean?0:MD.raw_noise,night:cfg.night},label,true);
    const win=r.day>=B.target&&r.night>=B.target&&r.done;
    if(win){addScore(SC.mission);E.flash(true);Object.values(CH).forEach(c=>E.emote(c,'hop'));await results('任務完成！日間 '+pct(r.day)+'，夜間 '+pct(r.night)+'，用了 '+r.time.toFixed(1)+' 分鐘。',[{label:'日間',v:r.day},{label:'夜間',v:r.night}],'你平衡了數據、演算法和運算能力。');return;}
    const why=!r.done?'訓練未能在三十分鐘內完成：運算能力不足。':MD.algs[cfg.alg].cap<B.target?'這個演算法的上限低於 90%：要選更合適的演算法。':!cfg.night?'夜間準確率太低：數據缺少夜間照片。':!cfg.clean?'標籤錯誤拖低了準確率：要檢查數據質素。':'照片太少，神經網絡未學好：要更多數據。';
    E.emote(CH.rival,'shake');await results('未達標：日間 '+pct(r.day)+'，夜間 '+pct(r.night)+'。',[{label:'日間',v:r.day,col:r.day>=.9?'#3ACB5A':'#E8A01A'},{label:'夜間',v:r.night,col:r.night>=.9?'#3ACB5A':'#E8A01A'}],why);}}
const RUN=[r1,r2,r3,r4,r5];
async function main(){E.start();
  E.overlay('<div class="title"><div class="v">'+C.meta.short_title+'</div><div class="v a">'+C.meta.author+'</div><div class="side"><p>'+C.meta.title_lines.join('<br>')+'</p><button class="primary" id="go">開始</button></div></div>',true);$('go').focus();await E.waitClick('#go');
  E.overlay('<div class="card"><h2>AI 學會</h2><div class="cast">'+Object.values(C.npc_slots).map(x=>'<div>'+E.glyph(x.character_id)+'<p style="margin:0"><b>'+x.display_name+'</b><br><span>'+x.persona+'</span></p></div>').join('')+'</div><p class="sub">'+C.meta.note+'</p><button class="primary" id="go">開始訓練</button></div>',true);
  await E.waitClick('#go');E.clearOverlay();$('hud').hidden=false;await E.say('mentor','學校的智能回收站要裝一部 AI 鏡頭，自動分辨廢紙、金屬和塑膠。AI 要先從大量例子中學習。我們一步步找出甚麼會影響它的表現。');
  for(let i=Math.max(0,(window.__startR||1)-1);i<C.rounds.length;i++){const Rr=C.rounds[i];st.r=i;
    E.overlay('<div class="chapcard"><small>第'+E.NUM[i]+'回合</small><h2>'+Rr.title+'</h2></div>',true);await Promise.race([E.sleep(window.__fast?300:1600),new Promise(r=>$('overlay').addEventListener('click',r,{once:true}))]);E.clearOverlay();
    $('chapNo').textContent='第'+E.NUM[i]+'回合';$('chapTitle').textContent=Rr.title;await go('station');await E.say('mentor',Rr.intro);E.emote(CH.rival,'hop');await E.say('rival',Rr.rival);
    await RUN[i](Rr);await check(Rr.check);E.hideDialog();st.hint=null;}
  const tier=GM.endings.find(e=>st.score>=e.min_score).id,EN=C.endings[tier];E.flash(true);
  E.overlay('<div class="card"><p class="sub" style="margin:0">訓練營完成</p><h2>'+EN.title+'</h2><p>'+EN.text+'</p><div class="stats"><div><b>'+st.score+'</b>分數</div><div><b>'+st.log.length+'</b>次實驗</div><div><b>'+st.hints+'</b>提示</div></div>'+
    '<div class="three"><div><b>數據</b><span>數量、質素、多樣性</span></div><div><b>演算法</b><span>學習的方法，要配合數據</span></div><div><b>運算能力</b><span>決定能否及時學完</span></div></div><p style="font-family:var(--serif)">何老師：'+C.debrief+'</p><button class="primary" id="again">再玩一次</button></div>',true);
  await E.waitClick('#again');location.reload();}
main();
})();
</script>
