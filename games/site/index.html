<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地盤三視圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .title{flex-direction:column;gap:14px} .title .v{writing-mode:horizontal-tb;font-size:56px} .title .v.a{margin-left:0;align-self:center;font-size:15px;letter-spacing:.15em} .title .side{align-items:center;text-align:center} .title .side .primary{align-self:center}
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}

.scorebox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:7px 14px;display:flex;gap:16px}
.scorebox div{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.scorebox b{font-family:var(--serif);font-size:20px;color:var(--paper);font-variant-numeric:tabular-nums}
.tool{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px}
.tool svg{width:17px;height:17px}.tool:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));background:var(--panel);border:1px solid var(--panel-line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 14px;pointer-events:none;z-index:3}
#toast.ok{border-left-color:var(--jade)}#toast.bad{border-left-color:var(--cinnabar)}
#toast b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:2px}#toast.ok b{color:var(--jade)}#toast.bad b{color:#F08A74}
#toast span{font-size:14px;line-height:1.55;color:#E6DCC4}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(244,235,214,.06);border:1px solid rgba(244,235,214,.28);border-radius:10px;padding:8px 10px;font-size:14px}
.pbtn b{font-family:var(--serif);font-size:16px;color:var(--muted)}
.pbtn.float{border-color:#5AA8E0}.pbtn.float b{color:#8CC8F2}.pbtn.sink{border-color:#C98E1E}.pbtn.sink b{color:#F2C14E}
.pbtn:hover{border-color:var(--gold)}
.shaper .srow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.shaper input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.status{font-size:13px;color:var(--muted);margin:6px 0 0}
.notes{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:14px}
.notes b{font-family:var(--serif)}.notes p{font-size:14px;margin:6px 0 0;line-height:1.6;color:#4C4434}
.dt{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.dt th{text-align:left;font-weight:600;color:#6F6450;border-bottom:1px solid #D9CCAE;padding:4px 6px}
.dt td{padding:4px 6px;border-bottom:1px solid #EEE4CC}.dt td.hit{color:#2E7D62;font-weight:600}.dt td.miss{color:#B5412E;font-weight:600}
.review{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:10px}
.review li{border-left:3px solid var(--jade);padding:2px 0 2px 12px}.review b{font-family:var(--serif)}.review p{font-size:14px;margin:3px 0 0;color:#4C4434;line-height:1.6}

#views{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:4px;background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:4px}
.vbtn{background:none;border:0;border-radius:9px;padding:7px 14px;font-size:14px;color:var(--muted);white-space:nowrap}
.vbtn[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:600}
#bp{position:absolute;left:12px;top:64px;width:250px;background:rgba(14,30,48,.92);border:1px solid #3A6A9A;border-radius:12px;padding:10px 12px;color:#E6EEF6;max-height:calc(100% - 300px);overflow:auto}
#bp.min #bpViews,#bp.min .leg{display:none}
.bph{display:flex;align-items:center;gap:8px;font-size:13px}.bph b{font-family:var(--serif);font-size:15px;white-space:nowrap}.bph span{color:#A8C0D8;margin-right:auto}
.bph button{background:none;border:1px solid #3A6A9A;color:#A8C0D8;border-radius:8px;padding:2px 8px;font-size:12px}
.vrow{margin-top:8px}.vlab{display:flex;gap:6px;align-items:baseline;font-size:12px;color:#A8C0D8}.vlab b{color:#E6EEF6;font-size:14px}
.pair{display:flex;gap:10px;margin-top:3px}.pair figure{margin:0;flex:1}.pair figcaption{font-size:11px;color:#A8C0D8;text-align:center}
.vg{width:100%;height:auto;background:#0E2238;border-radius:4px;display:block}
.leg{font-size:11px;color:#A8C0D8;margin:8px 0 0;display:flex;gap:4px;align-items:center;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
.leg .k1{background:#3A7FC8}.leg .k2{background:#2E9B5E}.leg .k3{background:#D2553F}.leg .k4{border:1.5px dashed #D2553F}
.seg{display:flex;gap:0;border:1px solid rgba(244,235,214,.3);border-radius:10px;overflow:hidden;align-self:flex-start}
.segb{background:none;border:0;padding:8px 14px;font-size:14px;color:var(--muted)}.segb[aria-pressed="true"]{background:rgba(224,176,75,.2);color:var(--paper);font-weight:600}
.ghost{align-self:flex-start;background:none;border:1px solid rgba(244,235,214,.3);border-radius:10px;padding:7px 14px;font-size:14px;color:var(--muted)}
#actions{flex-direction:row;flex-wrap:wrap;align-items:center}#actions .opt{flex-basis:100%}
@media (max-width:560px){#bp{width:176px;top:108px;padding:8px;max-height:calc(100% - 420px)}#views{top:60px}.vbtn{padding:6px 10px;font-size:13px}.chap strong{font-size:14px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 遊戲場景"></canvas>
  <div id="spots"></div>
  <div id="bubbles"></div>
  <header id="hud" hidden>
    <div class="chap"><span id="chapNo"></span><strong id="chapTitle"></strong></div>
    <div class="meters">
      <div class="scorebox"><div>分數<b id="score">0</b></div></div>
      <button class="tool" id="assist"><svg viewBox="0 0 24 24" fill="none" stroke="#E0B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>工程師提示</button>
    </div>
  </header>
  <nav id="views" hidden aria-label="觀看角度">
    <button class="vbtn" data-v="front" aria-pressed="false">正視</button><button class="vbtn" data-v="side" aria-pressed="false">側視</button><button class="vbtn" data-v="top" aria-pressed="false">俯視</button><button class="vbtn" data-v="free" aria-pressed="true">自由</button>
  </nav>
  <aside id="bp" hidden aria-label="藍圖">
    <div class="bph"><b>藍圖對照</b><span id="bpCount"></span><button id="bpToggle">收起</button></div>
    <div id="bpViews"></div>
    <p class="leg"><i class="k1"></i>藍圖<i class="k2"></i>相符<i class="k3"></i>多了<i class="k4"></i>欠缺</p>
  </aside>
    <div id="toast" hidden role="status"><b id="toastT"></b><span id="toastD"></span></div>
  <div id="assistBubble" hidden role="status"></div>
  <section id="dialog" hidden aria-live="polite">
    <div class="who"><i class="dot" id="whoDot"></i><span id="whoName"></span></div>
    <p id="line"></p>
    <div id="actions"></div>
  </section>
  <div id="overlay"></div>
</div>

<script>/* Building-workshop mode: 3D views & volume on a construction site */

E.SPK={narrator:{name:'你',col:'#F4EBD6'}};

const cellPos=(x,z,y)=>V(x-(N-1)/2,S.slabTop+.5+(y||0),(N-1)/2-z);
/* concrete block material */
const ctex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#B8B2A6';x.fillRect(0,0,128,128);for(let i=0;i<500;i++){x.fillStyle=Math.random()<.5?'#A8A296':'#C6C0B4';x.fillRect(Math.random()*128,Math.random()*128,2,2);}x.strokeStyle='#8E887C';x.lineWidth=3;x.strokeRect(2,2,124,124);x.beginPath();x.moveTo(0,64);x.lineTo(128,64);x.stroke();return new THREE.CanvasTexture(c);})();

/* ---------- camera: orbit + preset views ---------- */
const CTR=V(0,1.2,0);
E.cam.idle=t=>{st.yaw+=(st.tYaw-st.yaw)*.12;st.pitch+=(st.tPitch-st.pitch)*.12;const d=E.portrait?st.dist*1.45:st.dist;const cp=Math.cos(st.pitch);
  E.camera.position.set(CTR.x+Math.sin(st.yaw)*cp*d,CTR.y+Math.sin(st.pitch)*d,CTR.z+Math.cos(st.yaw)*cp*d);E.cam.look.copy(CTR);};
const PRESET={front:[0,.12],side:[Math.PI/2,.12],top:[0,1.52],free:[.65,.55]};
function setView(k){const p=PRESET[k];let y=p[0];while(y-st.yaw>Math.PI)y-=Math.PI*2;while(st.yaw-y>Math.PI)y+=Math.PI*2;st.tYaw=y;st.tPitch=p[1];document.querySelectorAll('.vbtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===k)));}
const cv=E.canvas;
cv.addEventListener('pointerdown',e=>{st.drag={x:e.clientX,y:e.clientY,yaw:st.tYaw,pitch:st.tPitch,m:0};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{const d=st.drag;if(!d){hover(e);return;}const dx=e.clientX-d.x,dy=e.clientY-d.y;d.m=Math.max(d.m,Math.hypot(dx,dy));if(d.m>6){st.tYaw=d.yaw-dx*.008;st.tPitch=Math.max(.05,Math.min(1.53,d.pitch+dy*.006));document.querySelectorAll('.vbtn').forEach(b=>b.setAttribute('aria-pressed','false'));}});
cv.addEventListener('pointerup',e=>{const d=st.drag;st.drag=null;if(d&&d.m<=6)tap(e);});
cv.addEventListener('wheel',e=>{st.dist=Math.max(8,Math.min(22,st.dist+e.deltaY*.01));e.preventDefault();},{passive:false});
const ray=new THREE.Raycaster(),pm=new THREE.Vector2();
function pick(e){const r=cv.getBoundingClientRect();pm.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pm,E.camera);
  const objs=[];st.blocks.forEach(col=>col.forEach(c=>c.forEach(b=>objs.push(b))));const hit=ray.intersectObjects(objs)[0];if(hit)return hit.object.userData.cell;
  const p=new THREE.Plane(V(0,1,0),-S.slabTop),pt=V();if(!ray.ray.intersectPlane(p,pt))return null;const x=Math.round(pt.x+(N-1)/2),z=Math.round((N-1)/2-pt.z);if(x<0||z<0||x>=N||z>=N)return null;return {x,z};}
function hover(e){if(!st.building||st.busy){ghost.visible=false;return;}const c=pick(e);if(!c){ghost.visible=false;return;}const h=st.h[c.x][c.z];
  if(st.mode==='add'&&h<MAXH){ghost.visible=true;ghost.position.copy(cellPos(c.x,c.z,h));ghostMat.color.setHex(0xF2C81A);}else if(st.mode==='remove'&&h>0){ghost.visible=true;ghost.position.copy(cellPos(c.x,c.z,h-1));ghostMat.color.setHex(0xE0574A);}else ghost.visible=false;}
function tap(e){if(!st.building||st.busy)return;const c=pick(e);if(!c)return;if(st.mode==='add')addBlock(c.x,c.z);else removeBlock(c.x,c.z);}

/* ---------- crane ---------- */
function anim(dur,update){return new Promise(res=>st.anims.push({t:0,dur:E.RM?.01:dur*(window.__fast?.15:1),update,done:res}));}
function onFrame(dt){for(let i=st.anims.length-1;i>=0;i--){const a=st.anims[i];a.t+=dt;const k=Math.min(1,a.t/a.dur);a.update(k);if(k>=1){st.anims.splice(i,1);a.done();}}S.update(dt);}
const craneBase=S.crane.position;
function aimCrane(target){const dx=target.x-craneBase.x,dz=target.z-craneBase.z;const ang=Math.atan2(-dz,dx),rad=Math.hypot(dx,dz);const a0=S.slew.rotation.y,r0=S.trolley.position.x;let da=ang-a0;da=Math.atan2(Math.sin(da),Math.cos(da));
  return anim(.55,k=>{const e=k*k*(3-2*k);S.slew.rotation.y=a0+da*e;S.trolley.position.x=r0+(rad-r0)*e;});}
function setCable(worldY){const ty=S.craneH+.45;const L=Math.max(.3,ty-worldY);S.cable.scale.y=L;S.cable.position.y=-L/2;S.hook.position.y=-L;}
setCable(9);
async function addBlock(x,z,silent){const h=st.h[x][z];if(h>=MAXH){if(!silent)toast('太高了','每一格最多疊 '+MAXH+' 層。','bad');return;}st.busy=true;ghost.visible=false;
  const to=cellPos(x,z,h);await aimCrane(to);const b=new THREE.Mesh(blockGeo,blockMat);b.userData.cell={x,z};E.scene.add(b);
  const topY=to.y+5;await anim(.5,k=>{const y=topY+(to.y-topY)*k;b.position.set(to.x,y,to.z);setCable(y+.75);});
  st.h[x][z]++;st.blocks[x][z].push(b);E.emote(CH.companion,'hop');await anim(.3,k=>setCable(to.y+.75+k*4));st.busy=false;refresh();}
async function removeBlock(x,z){const h=st.h[x][z];if(!h)return;st.busy=true;ghost.visible=false;const b=st.blocks[x][z].pop();st.h[x][z]--;const from=b.position.clone();await aimCrane(from);
  await anim(.25,k=>setCable(from.y+4.75-k*4));await anim(.5,k=>{b.position.y=from.y+k*5;setCable(b.position.y+.75);});E.scene.remove(b);st.busy=false;refresh();}
function clearAll(instant){for(let x=0;x<N;x++)for(let z=0;z<N;z++){st.blocks[x][z].forEach(b=>E.scene.remove(b));st.blocks[x][z]=[];st.h[x][z]=0;}refresh();}
function placeInstant(list){list.forEach(([x,z,h])=>{for(let k=0;k<h;k++){const b=new THREE.Mesh(blockGeo,blockMat);b.userData.cell={x,z};b.position.copy(cellPos(x,z,st.h[x][z]));E.scene.add(b);st.blocks[x][z].push(b);st.h[x][z]++;}});refresh();}

/* ---------- views ---------- */
function viewsOf(h){const front=[],side=[],top=[];for(let x=0;x<N;x++)front.push(Math.max(...h[x]));for(let z=0;z<N;z++){let m=0;for(let x=0;x<N;x++)m=Math.max(m,h[x][z]);side.push(m);}
  for(let x=0;x<N;x++)for(let z=0;z<N;z++)if(h[x][z]>0)top.push([x,z]);return {front,side,top};}

const topSet=v=>new Set(v.top.map(([x,z])=>x+','+z));
function sameViews(a,b){if(a.front.join()!==b.front.join()||a.side.join()!==b.side.join())return false;const A=topSet(a),B=topSet(b);if(A.size!==B.size)return false;for(const k of A)if(!B.has(k))return false;return true;}
const count=()=>st.h.flat().reduce((s,v)=>s+v,0);
function grid(kind,v,ref){const c=14,cols=N,rows=kind==='top'?N:MAXH;let s='<svg viewBox="0 0 '+cols*c+' '+rows*c+'" class="vg" aria-hidden="true">';
  const T=ref?topSet(ref):null,V2=topSet(v);
  for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){let on,refOn;
    if(kind==='top'){on=V2.has(i+','+(N-1-j));refOn=T&&T.has(i+','+(N-1-j));}else{const arr=kind==='front'?v.front:v.side;on=arr[i]>=rows-j;if(ref){const ra=kind==='front'?ref.front:ref.side;refOn=ra[i]>=rows-j;}}
    const fill=on?(ref?(refOn?'#2E9B5E':'#D2553F'):'#3A7FC8'):(ref&&refOn?'none':'none');const stroke=ref&&refOn&&!on?'#D2553F':'#C9D3D8';
    s+='<rect x="'+(i*c+.5)+'" y="'+(j*c+.5)+'" width="'+(c-1)+'" height="'+(c-1)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(ref&&refOn&&!on?1.6:.6)+'"'+(ref&&refOn&&!on?' stroke-dasharray="2 2"':'')+'/>';}
  return s+'</svg>';}
function refresh(){const bp=$('bp');if(!st.target){bp.hidden=true;return;}bp.hidden=false;const cur=viewsOf(st.h);const T=st.target;
  $('bpViews').innerHTML=['front','side','top'].map(k=>'<div class="vrow"><div class="vlab"><b>'+VN[k].name+'</b><span>'+VN[k].from+'</span></div><div class="pair"><figure>'+grid(k,T)+'<figcaption>藍圖</figcaption></figure><figure>'+grid(k,cur,T)+'<figcaption>你的</figcaption></figure></div></div>').join('');
  $('bpCount').textContent='已用 '+count()+' 塊';}

/* ---------- solutions for skip ---------- */
function solve(L){if(L.target)return L.target;const v=L.views,cells=v.top.map(([x,z])=>[x,z,1]);const H=(x,z)=>cells.find(c=>c[0]===x&&c[1]===z);
  if(L.type==='max'){cells.forEach(c=>c[2]=Math.min(v.front[c[0]],v.side[c[1]]));return cells;}
  const needX=new Set(),needZ=new Set();v.front.forEach((f,x)=>{if(f>1)needX.add(x);});v.side.forEach((s,z)=>{if(s>1)needZ.add(z);});
  for(const x of [...needX]){const z=[...needZ].find(z=>v.side[z]===v.front[x]&&H(x,z));if(z!=null){H(x,z)[2]=v.front[x];needX.delete(x);needZ.delete(z);}}
  for(const x of needX){const c=cells.find(c=>c[0]===x&&v.side[c[1]]>=v.front[x]);c[2]=v.front[x];}
  for(const z of needZ){const c=cells.find(c=>c[1]===z&&v.front[c[0]]>=v.side[z]);c[2]=Math.max(c[2],v.side[z]);}return cells;}

async function buildLevel(L){
  st.target=L.target?viewsOf(hFromList(L.target)):{front:L.views.front,side:L.views.side,top:L.views.top};refresh();setView('free');
  st.hint=L.hint;st.hintLv=0;st.attempts=0;st.building=true;let skipped=false;
  for(;;){const act=await new Promise(async res=>{E.actions([]);await E.showLine('mentor',L.type==='min'?'砌出符合三視圖的結構，而且要用最少的方塊。':L.type==='max'?'砌出符合三視圖的結構，而且要用最多的方塊。':'砌出符合三個視圖的結構。點擊地台放置方塊，可以拖動畫面轉換角度。');
      E.actions([modeBtns(),E.btn('next','交給驗收主任',()=>res('submit')),E.btn('ghost','全部清除',()=>res('clear')),E.skipBtn(()=>res('skip'),'跳過，看正確砌法')]);});
    if(st.busy){await new Promise(r=>{const iv=setInterval(()=>{if(!st.busy){clearInterval(iv);r();}},50);});}
    if(act==='clear'){clearAll();continue;}
    if(act==='skip'){skipped=true;clearAll();placeInstant(solve(L));E.flash(true);await E.say('mentor','這是其中一個正確砌法。轉動畫面，從三個方向對照藍圖看看。');break;}
    st.attempts++;const cur=viewsOf(st.h);const ok=sameViews(cur,st.target);const n=count();
    const gk=CH.gatekeeper;E.emote(gk,'hop');
    if(!ok){const bad=[];if(cur.front.join()!==st.target.front.join())bad.push(VN.front.name);if(cur.side.join()!==st.target.side.join())bad.push(VN.side.name);if(!sameViews({front:[],side:[],top:cur.top},{front:[],side:[],top:st.target.top}))bad.push(VN.top.name);
      E.emote(CH.rival,'hop');toast('驗收不合格',bad.join('、')+'與藍圖不符。看藍圖面板上紅色的格子。','bad');if(st.attempts===1)E.floatBubble(CH.rival,L.rival,2600);continue;}
    if((L.type==='min'||L.type==='max')&&n!==L.answer_count){toast('三視圖正確，但……','你用了 '+n+' 塊。'+(L.type==='min'?'還可以更少嗎？':'還可以更多嗎？'),'bad');E.emote(gk,'shake');continue;}
    break;}
  st.building=false;ghost.visible=false;
  const pts=skipped?0:(st.attempts<=1?GM.scoring.match_first_try:GM.scoring.match_retry);st.score+=pts;hud();
  st.results.push({title:L.title,ok:!skipped,attempts:st.attempts,count:count()});
  if(!skipped){E.flash(true);Object.values(CH).forEach(c=>{if(c.slot!=='rival')E.emote(c,'hop');});E.emote(CH.rival,'slump');toast('驗收合格 +'+pts,'用了 '+count()+' 塊方塊。','ok');}
  await E.sleep(700);
}
function exposedArea(h){let a=0;for(let x=0;x<N;x++)for(let z=0;z<N;z++){const k=h[x][z];if(!k)continue;a+=1;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dz])=>{const nx=x+dx,nz=z+dz;const nh=(nx<0||nz<0||nx>=N||nz>=N)?0:h[nx][nz];a+=Math.max(0,k-nh);});}return a;}
async function measureLevel(L){
  clearAll();st.target=null;refresh();setView('free');
  for(const [x,z,k] of L.target)for(let i=0;i<k;i++)await addBlock(x,z,true);
  const h=hFromList(L.target),vol=L.target.reduce((s,c)=>s+c[2],0),area=exposedArea(h),topN=L.target.length;
  st.hint=L.hint;st.hintLv=0;
  const qs=[{q:C.measure_questions.volume,ans:vol+' m³',opts:[vol+' m³',topN+' m³',(vol+2)+' m³',vol*6+' m³'],ex:'每塊方塊 1 m³，一共 '+vol+' 塊，體積是 '+vol+' m³。'},
            {q:C.measure_questions.area,ans:area+' m²',opts:[area+' m²',vol*6+' m²',(area+topN)+' m²',(area-4)+' m²'],ex:'只計算露在外面的面：一共 '+area+' 個面，即 '+area+' m²。'+vol*6+' m² 是把相貼的面和底部也計算了。'}];
  for(const q of qs){const opts=E.shuffle(q.opts),dis=new Set();let w=0;
    for(;;){const i=await E.ask('mentor',q.q,opts,dis,{skip:true});if(i===-1){await E.say('mentor','答案是 '+q.ans+'。'+q.ex);break;}
      if(opts[i]===q.ans){st.score+=Math.max(2,GM.scoring.measure_first_try-w*3);hud();E.flash(true);await E.say('mentor','正確。'+q.ex);break;}
      w++;dis.add(i);E.emote(CH.rival,opts[i]===vol*6+' m²'?'hop':'shake');toast('再算一次',opts[i]===vol*6+' m²'?L.rival:'仔細數一數。可以轉動畫面，從不同方向看。','bad');}}
  st.results.push({title:L.title,ok:true,attempts:1,count:vol});
}
async function check(L){if(!L.check)return;const q=L.check,dis=new Set();let w=0;
  for(;;){const i=await E.ask('gatekeeper',q.question,q.options,dis,{skip:true});if(i===-1){await E.say('gatekeeper','答案是「'+q.options[q.answer]+'」。'+q.explain);return;}
    if(i===q.answer){st.score+=Math.max(2,GM.scoring.check_first_try-w*GM.scoring.check_wrong_penalty);hud();E.emote(CH.gatekeeper,'hop');await E.say('gatekeeper','正確。'+q.explain);return;}w++;dis.add(i);E.emote(CH.gatekeeper,'shake');}}

window.__bldApi={addBlock:(...a)=>addBlock(...a),clearAll:()=>clearAll(),solve:L=>solve(L),setView:k=>setView(k)};
async function main(){
  E.start();hud();
  E.overlay('<div class="title"><div class="v">'+C.meta.short_title+'</div><div class="v a">'+C.meta.author+'</div><div class="side"><p>'+C.meta.title_lines.join('<br>')+'</p><button class="primary" id="go">開工</button></div></div>',true);
  $('go').focus();await E.waitClick('#go');
  E.overlay('<div class="card"><h2>今日開工</h2><div class="cast">'+Object.values(C.npc_slots).map(x=>'<div>'+E.glyph(x.character_id)+'<p style="margin:0"><b>'+x.display_name+'</b><br><span>'+x.persona+'</span></p></div>').join('')+'</div><p class="sub">'+C.meta.unit+'。點擊地台，起重機會把方塊吊過去；拖動畫面可以轉換角度，也可以用「正視、側視、俯視」按鈕對照藍圖。</p><button class="primary" id="go">戴好安全帽</button></div>',true);
  await E.waitClick('#go');E.clearOverlay();$('hud').hidden=false;$('views').hidden=false;if(E.portrait){$('bp').classList.add('min');$('bpToggle').textContent='展開藍圖';}
  for(let i=Math.max(0,(window.__startLv||1)-1);i<C.levels.length;i++){const L=C.levels[i];st.lv=i;
    E.overlay('<div class="chapcard"><small>第'+E.NUM[i]+'關</small><h2>'+L.title+'</h2></div>',true);await Promise.race([E.sleep(E.RM?700:1600),new Promise(r=>$('overlay').addEventListener('click',r,{once:true}))]);E.clearOverlay();
    $('chapNo').textContent='第'+E.NUM[i]+'關';$('chapTitle').textContent=L.title;clearAll();
    await E.say('mentor',L.brief);E.emote(CH.rival,'hop');await E.say('rival',L.rival);
    if(L.type==='measure')await measureLevel(L);else await buildLevel(L);
    await check(L);}
  E.hideDialog();$('bp').hidden=true;const tier=GM.endings.find(e=>st.score>=e.min_score).id,EN=C.endings[tier];
  E.overlay('<div class="card"><p class="sub" style="margin:0">今日收工</p><h2>'+EN.title+'</h2><p>'+EN.text+'</p><div class="stats"><div><b>'+st.score+'</b>分數</div><div><b>'+st.results.filter(r=>r.ok).length+'/'+st.results.length+'</b>完成關卡</div><div><b>'+st.hints+'</b>提示</div></div><ul class="review">'+
    st.results.map(r=>'<li><b>'+r.title+'</b><p>'+(r.ok?'完成，嘗試 '+r.attempts+' 次，用了 '+r.count+' 塊':'已跳過')+'</p></li>').join('')+'</ul><p style="font-family:var(--serif)">陳工程師：'+C.debrief+'</p><button class="primary" id="again">再開一次工</button></div>',true);
  await E.waitClick('#again');location.reload();
}
main();
})();
</script>
