<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>送貨機械人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .title{flex-direction:column;gap:14px} .title .v{writing-mode:horizontal-tb;font-size:56px} .title .v.a{margin-left:0;align-self:center;font-size:15px;letter-spacing:.15em} .title .side{align-items:center;text-align:center} .title .side .primary{align-self:center}
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}

.scorebox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:7px 14px;display:flex;gap:16px}
.scorebox div{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.scorebox b{font-family:var(--serif);font-size:20px;color:var(--paper);font-variant-numeric:tabular-nums}
.tool{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px}
.tool svg{width:17px;height:17px}.tool:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));background:var(--panel);border:1px solid var(--panel-line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 14px;pointer-events:none;z-index:3}
#toast.ok{border-left-color:var(--jade)}#toast.bad{border-left-color:var(--cinnabar)}
#toast b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:2px}#toast.ok b{color:var(--jade)}#toast.bad b{color:#F08A74}
#toast span{font-size:14px;line-height:1.55;color:#E6DCC4}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(244,235,214,.06);border:1px solid rgba(244,235,214,.28);border-radius:10px;padding:8px 10px;font-size:14px}
.pbtn b{font-family:var(--serif);font-size:16px;color:var(--muted)}
.pbtn.float{border-color:#5AA8E0}.pbtn.float b{color:#8CC8F2}.pbtn.sink{border-color:#C98E1E}.pbtn.sink b{color:#F2C14E}
.pbtn:hover{border-color:var(--gold)}
.shaper .srow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.shaper input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.status{font-size:13px;color:var(--muted);margin:6px 0 0}
.notes{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:14px}
.notes b{font-family:var(--serif)}.notes p{font-size:14px;margin:6px 0 0;line-height:1.6;color:#4C4434}
.dt{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.dt th{text-align:left;font-weight:600;color:#6F6450;border-bottom:1px solid #D9CCAE;padding:4px 6px}
.dt td{padding:4px 6px;border-bottom:1px solid #EEE4CC}.dt td.hit{color:#2E7D62;font-weight:600}.dt td.miss{color:#B5412E;font-weight:600}
.review{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:10px}
.review li{border-left:3px solid var(--jade);padding:2px 0 2px 12px}.review b{font-family:var(--serif)}.review p{font-size:14px;margin:3px 0 0;color:#4C4434;line-height:1.6}

#code{position:absolute;right:12px;top:118px;bottom:14px;width:300px;background:rgba(14,22,30,.92);border:1px solid var(--panel-line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;z-index:3;overflow:hidden}
#code[hidden]{display:none}
.ch{display:flex;justify-content:space-between;align-items:baseline}.ch b{font-family:var(--serif);font-size:17px}#bcount{font-size:13px;color:var(--muted)}#bcount.over{color:#F08A74;font-weight:700}
#pal{display:flex;flex-wrap:wrap;gap:6px}
.pal{border:0;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:600;color:#14231E;cursor:pointer}
.p-fwd,.b-fwd>span{background:#5FB49C}.p-left,.b-left>span,.p-right,.b-right>span{background:#7AB8FF}.p-repeat{background:#F2C14E}.p-wait,.b-wait>span{background:#F08A74}
.pal:disabled{opacity:.4}
#tgt{margin:0;font-size:12px;color:var(--muted)}
#prog{flex:1;overflow:auto;background:rgba(244,235,214,.04);border-radius:10px;padding:8px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;counter-reset:n}
.plist.inner{margin:6px 0 2px 14px;padding:6px;border-left:3px solid #F2C14E;border-radius:0 8px 8px 0;background:rgba(242,193,78,.06)}
.plist.inner.target{background:rgba(242,193,78,.16);outline:1px dashed #F2C14E}
.plist li.empty{font-size:12px;color:var(--muted);padding:4px}
.blk{cursor:pointer;border-radius:9px}.blk>span{display:inline-block;padding:6px 12px;border-radius:9px;color:#14231E;font-weight:600;font-size:14px}
.b-repeat>.rh{display:flex;align-items:center;gap:6px;background:#F2C14E;color:#14231E;border-radius:9px;padding:4px 8px;font-weight:600;font-size:14px;width:max-content}
.nb{border:0;background:rgba(0,0,0,.15);border-radius:6px;width:24px;height:24px;font-weight:700;cursor:pointer}
.blk.sel{outline:2px solid #fff;outline-offset:2px}.blk.run>span,.blk.run>.rh{box-shadow:0 0 0 3px #fff,0 0 14px #F2C14E}
.cbtns{display:flex;gap:6px;flex-wrap:wrap}.mini2{background:none;border:1px solid rgba(244,235,214,.3);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}.mini2:disabled{opacity:.4}
#runBtn{flex:1}#runBtn:disabled{opacity:.45}
.glabel{position:absolute;transform:translate(-50%,-100%);background:#F2C14E;color:#14231E;font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px;pointer-events:none;white-space:nowrap}.glabel.done{background:#5FD08A}
@media (min-width:900px){#dialog{left:calc(50% - 165px)}}
@media (max-width:560px){#code{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:44%}#toast{bottom:calc(44% + 18px)!important}}
#facing{margin:0;font-size:15px;font-weight:700;color:#FFD23A}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 遊戲場景"></canvas>
  <div id="spots"></div>
  <div id="bubbles"></div>
  <header id="hud" hidden>
    <div class="chap"><span id="chapNo"></span><strong id="chapTitle"></strong></div>
    <div class="meters">
      <div class="scorebox"><div>分數<b id="score">0</b></div></div>
      <button class="tool" id="assist"><svg viewBox="0 0 24 24" fill="none" stroke="#E0B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>老師提示</button>
    </div>
  </header>
  <aside id="code" hidden aria-label="程式編輯器">
    <div class="ch"><b>積木</b><span id="bcount"></span></div>
    <div id="pal"></div>
    <p id="facing" aria-live="polite"></p>
    <p id="tgt"></p>
    <div id="prog" aria-live="polite"></div>
    <div class="cbtns"><button id="outBtn" class="mini2" hidden>完成這個重複</button><button id="delBtn" class="mini2">刪除所選</button><button id="clrBtn" class="mini2">全部清除</button></div>
    <div class="cbtns"><button id="runBtn" class="primary">▶ 執行</button><button id="skipBtn" class="skipbtn">跳過，看答案</button></div>
  </aside>
  <div id="toast" hidden role="status"><b id="toastT"></b><span id="toastD"></span></div>
  <div id="assistBubble" hidden role="status"></div>
  <section id="dialog" hidden aria-live="polite">
    <div class="who"><i class="dot" id="whoDot"></i><span id="whoName"></span></div>
    <p id="line"></p>
    <div id="actions"></div>
  </section>
  <div id="overlay"></div>
</div>

E.emote=function(c,type){c.emote=type;c.emoteT=0;};

  panel(robot,.7,.35,face,0,.55,.41,0,true);[[-.45,-.28],[.45,-.28],[-.45,.28],[.45,.28]].forEach(([x,z])=>{const w=mesh(new THREE.CylinderGeometry(.16,.16,.12,14),M(0x2A2A2A),x,.16,z,robot);w.rotation.z=Math.PI/2;});

/* ---------- level objects ---------- */
let LG=null,light=null;const goalEls=[];
function obstacle(g,kind,p){const o=new THREE.Group();o.position.copy(p);g.add(o);
  if(kind==='barrier'){for(let i=-1;i<=1;i+=2)box(.08,.9,.08,0x8A8E92,i*.8,.45,0,o);for(let k=0;k<4;k++)box(.4,.4,.06,k%2?0xFFFFFF:0xF27A1A,-.6+k*.4,.7,0,o);mesh(new THREE.ConeGeometry(.22,.6,12),M(0xF27A1A),.5,.3,.5,o);}
  else if(kind==='stall'){box(1.6,.8,1.1,0x7A8088,0,.4,0,o);const aw=box(1.8,.06,1.4,0xD8322A,0,1.7,0,o);aw.rotation.x=.12;[-.8,.8].forEach(x=>box(.06,1.6,.06,0x2A2A2A,x,.85,.6,o));for(let i=0;i<6;i++)mesh(new THREE.SphereGeometry(.12,8,6),M([0xF2A23A,0x6AB84A,0xD8322A][i%3]),-.5+(i%3)*.5,.9,-.2+Math.floor(i/3)*.4,o);}
  else if(kind==='minibus'){box(1.7,1.1,.95,0xF4ECD8,0,.75,0,o);box(1.72,.18,.97,0xC8221A,0,1.35,0,o);box(1.4,.35,.98,0x2A3A4A,.05,1.0,0,o);[[-.55,-.42],[.55,-.42],[-.55,.42],[.55,.42]].forEach(([x,z])=>{const w=mesh(new THREE.CylinderGeometry(.2,.2,.1,12),M(0x1A1A1A),x,.2,z,o);w.rotation.x=Math.PI/2;});}
  else if(kind==='rail'){for(let i=-1;i<=1;i++)box(.07,.9,.07,0x5A8A5A,i*.8,.45,0,o);box(1.8,.06,.06,0x5A8A5A,0,.85,0,o);box(1.8,.06,.06,0x5A8A5A,0,.45,0,o);}
  else{mesh(new THREE.CylinderGeometry(.6,.6,.5,14),M(0x9A9488),0,.25,0,o);mesh(new THREE.IcosahedronGeometry(.55,0),M(0x4E8A3E,{flatShading:true}),0,.8,0,o);}
  o.rotation.y=(R()-.5)*.3;return o;}
function buildLevel(L){if(LG)E.scene.remove(LG);goalEls.forEach(a=>{a.el.remove();E.anchors.splice(E.anchors.indexOf(a),1);});goalEls.length=0;LG=new THREE.Group();E.scene.add(LG);light=null;
  const kinds=L.id==='L3'?['barrier']:L.id==='L4'?['rail']:['stall','minibus','planter','barrier'];
  L.obstacles.forEach((o,i)=>obstacle(LG,kinds[i%kinds.length],cellPos(o[0],o[1])));
  if(L.crossing){const cp=cellPos(...L.crossing);for(let i=0;i<5;i++)box(.3,.02,1.7,0xF4F4EF,cp.x-.8+i*.4,.03,cp.z,LG);const pole=new THREE.Group();pole.position.copy(cp).add(V(1.1,0,.9));LG.add(pole);box(.08,2.4,.08,0x3A3E44,0,1.2,0,pole);box(.34,.7,.26,0x1A1A1A,0,2.5,0,pole);
    const red=mesh(new THREE.SphereGeometry(.1,10,8),new THREE.MeshBasicMaterial({color:0x5A1A1A}),0,2.7,.14,pole),grn=mesh(new THREE.SphereGeometry(.1,10,8),new THREE.MeshBasicMaterial({color:0x1A3A1A}),0,2.32,.14,pole);light={red,grn};}
  L.goals.forEach((gp,i)=>{const p=cellPos(gp[0],gp[1]);const r=mesh(new THREE.TorusGeometry(.7,.07,8,28),new THREE.MeshBasicMaterial({color:0xF2C14E}),p.x,.08,p.z,LG);r.rotation.x=Math.PI/2;r.userData.noFade=true;
    const el=document.createElement('div');el.className='glabel';el.textContent=L.goals.length>1?(i+1)+' 號點':'收件點';$('spots').appendChild(el);const a={el,pos:p.clone().add(V(0,1.4,0))};E.anchors.push(a);goalEls.push(a);a.ring=r;});
  placeRobot(...L.start);}
function isRed(L,t){const lt=L.light;if(!lt)return false;const per=lt.red+lt.green,p=t%per;return lt.start_red?p<lt.red:p>=lt.green;}
function showLight(L){if(!light)return;const r=isRed(L,st.tick);light.red.material.color.setHex(r?0xFF3A2A:0x4A1A1A);light.grn.material.color.setHex(r?0x1A3A1A:0x3AFF6A);}

/* ---------- editor ---------- */
const count=p=>p.reduce((s,b)=>s+1+(b.t==='repeat'?count(b.body):0),0);
function render(){const L=C.levels[st.lv];const box2=$('prog');box2.innerHTML='';const n=count(st.prog);
  const list=(arr,parent,depth)=>{const ul=document.createElement('ol');ul.className='plist'+(depth?' inner':'');
    if(!arr.length){const li=document.createElement('li');li.className='empty';li.textContent=depth?'（點擊上方積木加入這個重複）':'（點擊上方積木開始編寫）';ul.appendChild(li);}
    arr.forEach((b,i)=>{const li=document.createElement('li');li.className='blk b-'+b.t+(st.sel===b?' sel':'')+(b===st.running&&false?'':'');li.dataset.id=b.id;
      if(b.t==='repeat'){li.innerHTML='<div class="rh"><span>重複</span><button class="nb" data-a="dec" aria-label="減少次數">−</button><b>'+b.n+'</b><button class="nb" data-a="inc" aria-label="增加次數">＋</button><span>次</span></div>';
        li.querySelector('[data-a=dec]').onclick=e=>{e.stopPropagation();b.n=Math.max(2,b.n-1);render();};li.querySelector('[data-a=inc]').onclick=e=>{e.stopPropagation();b.n=Math.min(9,b.n+1);render();};
        const inner=list(b.body,b,depth+1);if(st.target===b)inner.classList.add('target');li.appendChild(inner);}
      else li.innerHTML='<span>'+BL[b.t]+'</span>';
      li.onclick=e=>{e.stopPropagation();if(st.running)return;st.sel=st.sel===b?null:b;if(b.t==='repeat')st.target=st.sel?b:null;render();};ul.appendChild(li);});return ul;};
  box2.appendChild(list(st.prog,null,0));
  $('bcount').textContent='積木：'+n+(L.max_blocks?' / '+L.max_blocks:'');$('bcount').classList.toggle('over',!!(L.max_blocks&&n>L.max_blocks));
  $('tgt').textContent=st.target?'正在加入：重複 '+st.target.n+' 次 之內':'正在加入：主程式';$('outBtn').hidden=!st.target;$('delBtn').disabled=!st.sel||st.running;
  $('runBtn').disabled=st.running||!n||!!(L.max_blocks&&n>L.max_blocks);
  document.querySelectorAll('.pal').forEach(b=>b.disabled=st.running);}
let uid=1;const mk=t=>t==='repeat'?{id:uid++,t,n:3,body:[]}:{id:uid++,t};
function add(t){if(st.running)return;const b=mk(t);(st.target?st.target.body:st.prog).push(b);if(t==='repeat'){st.target=b;st.sel=b;}render();}
function findParent(arr,b){for(const x of arr){if(x===b)return arr;if(x.t==='repeat'){const r=findParent(x.body,b);if(r)return r;}}return null;}
function del(){if(!st.sel)return;const p=findParent(st.prog,st.sel);if(p)p.splice(p.indexOf(st.sel),1);if(st.target===st.sel)st.target=null;st.sel=null;render();}
$('delBtn').onclick=del;$('clrBtn').onclick=()=>{if(st.running)return;st.prog=[];st.sel=null;st.target=null;render();};$('outBtn').onclick=()=>{st.target=null;st.sel=null;render();};
function palette(L){const p=$('pal');p.innerHTML='';L.palette.forEach(t=>{const b=document.createElement('button');b.className='pal p-'+t;b.textContent=BL[t];b.onclick=()=>add(t);p.appendChild(b);});}

/* ---------- execution ---------- */
function sleep(ms){return E.sleep(ms*(window.__fast?.15:1));}
function tween(d,fn){return new Promise(res=>{const t0=performance.now();const D=Math.max(.01,d*(window.__fast?.15:1)*1000);const f=()=>{const k=Math.min(1,(performance.now()-t0)/D);fn(k);if(k<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);});}
function hl(b,on){const el=document.querySelector('.blk[data-id="'+(b&&b.id)+'"]');if(el)el.classList.toggle('run',on);}
async function exec(L){const obs=new Set(L.obstacles.map(o=>o.join(','))),goals=L.goals.map(g=>g.join(','));let gi=0;st.tick=0;showLight(L);
  const SP=GM.step_sec;
  async function runList(arr){for(const b of arr){if(b.t==='repeat'){hl(b,true);for(let k=0;k<b.n;k++){const r=await runList(b.body);if(r){hl(b,false);return r;}}hl(b,false);continue;}
      hl(b,true);st.tick++;showLight(L);
      if(b.t==='fwd'){const nx=RB.x+DIRS[RB.d][0],ny=RB.y+DIRS[RB.d][1];const from=robot.position.clone();
        if(nx<0||ny<0||nx>=N||ny>=N||obs.has(nx+','+ny)){const to=cellPos(nx,ny);await tween(SP*.5,k=>robot.position.lerpVectors(from,from.clone().lerp(to,.3),Math.sin(k*Math.PI)));hl(b,false);return nx<0||ny<0||nx>=N||ny>=N?'edge':'crash';}
        if(L.crossing&&nx===L.crossing[0]&&ny===L.crossing[1]&&isRed(L,st.tick)){hl(b,false);E.flash(false,0xD8322A);return 'red';}
        const to=cellPos(nx,ny);await tween(SP,k=>{robot.position.lerpVectors(from,to,k);robot.position.y=Math.abs(Math.sin(k*Math.PI*2))*.04;});RB.x=nx;RB.y=ny;
        if(gi<goals.length&&goals[gi]===nx+','+ny){const a=goalEls[gi];a.ring.material.color.setHex(0x5FD08A);a.el.classList.add('done');gi++;E.flash(true);}}
      else if(b.t==='left'||b.t==='right'){const y0=robot.rotation.y;RB.d=(RB.d+(b.t==='left'?3:1))%4;facing();await tween(SP*.7,k=>robot.rotation.y=y0+(b.t==='left'?1:-1)*Math.PI/2*k);}
      else if(b.t==='wait'){let waited=0;while(isRed(L,st.tick)){robot.userData.lamp.material.emissive.setHex(waited%2?0x8A6A00:0xFF3A2A);await sleep(350);st.tick++;showLight(L);waited++;}robot.userData.lamp.material.emissive.setHex(0x8A6A00);}
      await sleep(80);hl(b,false);}return null;}
  const r=await runList(st.prog);return r||(gi===goals.length?'ok':'short');}
const REASON={edge:['撞到街邊了','機械人走出了街道範圍。檢查前進的次數和轉向。'],crash:['撞到障礙物了','前面有障礙物。看看路線，在甚麼地方需要轉彎。'],red:['紅燈不可以過馬路！','機械人在紅燈時走上斑馬線。過馬路前要先「等候綠燈」。'],short:['還未送到','程式執行完了，但機械人還沒到達收件點。']};

/* ---------- flow ---------- */
let toastT=null;function toast(title,text,cls){const el=$('toast');el.className=cls||'';$('toastT').textContent=title;$('toastD').textContent=text||'';el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,4200);}
function addScore(n){st.score=Math.max(0,st.score+n);$('score').textContent=st.score;}
$('assist').onclick=()=>{const L=C.levels[st.lv];if(!L||st.hintLv>=3)return;st.hintLv++;st.hints++;addScore(-SC.hint_penalty);E.bubble('李老師的提示 '+st.hintLv+'/3（扣 '+SC.hint_penalty+' 分）',L.hints[st.hintLv-1],8000);};
function toProg(arr){return arr.map(b=>b[0]==='repeat'?{id:uid++,t:'repeat',n:b[1],body:toProg(b[2])}:{id:uid++,t:b[0]});}
async function level(i){const L=C.levels[i];st.lv=i;st.hintLv=0;st.prog=L.prefill?toProg(L.prefill):[];st.sel=null;st.target=null;buildLevel(L);
  E.overlay('<div class="chapcard"><small>第'+E.NUM[i]+'張訂單　'+L.concept+'</small><h2>'+L.title+'</h2></div>',true);await Promise.race([sleep(1700),new Promise(r=>$('overlay').addEventListener('click',r,{once:true}))]);E.clearOverlay();
  $('chapNo').textContent='第'+E.NUM[i]+'張訂單';$('chapTitle').textContent=L.title;palette(L);render();$('code').hidden=true;
  await E.say('mentor',L.brief);E.emote(CH.rival,'hop');await E.say('rival',L.rival);E.hideDialog();$('code').hidden=false;render();
  let tries=0,skipped=false;
  for(;;){const act=await new Promise(res=>{$('runBtn').onclick=()=>res('run');$('skipBtn').onclick=()=>res('skip');});
    if(act==='skip'){skipped=true;st.prog=toProg(SOL[L.id]);render();}
    st.running=true;render();placeRobot(...L.start);L.goals.forEach((g,k)=>{goalEls[k].ring.material.color.setHex(0xF2C14E);goalEls[k].el.classList.remove('done');});tries++;
    const r=await exec(L);st.running=false;render();
    if(r==='ok'){const n=count(st.prog),stars=skipped?0:(n<=L.ideal?3:n<=L.ideal+2?2:1);if(!skipped){addScore(SC.clear+stars*SC.star);E.emote(CH.companion,'hop');}E.emote(CH.rival,'slump');
      toast(skipped?'這是參考答案':'送到了！'+'★'.repeat(stars),skipped?'看看它怎樣用最少的積木完成。':'用了 '+n+' 個積木'+(n<=L.ideal?'，已是最精簡！':'，最精簡只需 '+L.ideal+' 個。'),'ok');st.results.push({title:L.title,stars,tries,blocks:n,skipped});break;}
    E.emote(CH.companion,'shake');if(tries===1)E.floatBubble(CH.rival,'唔關我事㗎！',2000);toast(...REASON[r],'bad');await sleep(900);placeRobot(...L.start);}
  $('code').hidden=true;await sleep(900);const q=L.check,dis=new Set();let w=0;
  for(;;){const k=await E.ask('gatekeeper',q.question,q.options,dis,{skip:true});if(k===-1){await E.say('gatekeeper','答案是「'+q.options[q.answer]+'」。'+q.explain);break;}
    if(k===q.answer){addScore(Math.max(2,SC.check_first_try-w*SC.check_wrong_penalty));E.emote(CH.gatekeeper,'hop');await E.say('gatekeeper','正確。'+q.explain);break;}w++;dis.add(k);E.emote(CH.gatekeeper,'shake');}
  E.hideDialog();}
const SOL={L1:[['fwd'],['fwd'],['fwd'],['right'],['fwd'],['fwd']],L2:[['repeat',3,[['fwd'],['right'],['fwd'],['left']]]],L3:[['fwd'],['right'],['repeat',4,[['fwd']]],['left'],['repeat',3,[['fwd']]]],
  L4:[['fwd'],['wait'],['fwd'],['fwd'],['fwd']],L5:[['repeat',2,[['fwd']]],['right'],['repeat',3,[['fwd']]]],L6:[['repeat',4,[['fwd']]],['right'],['repeat',4,[['fwd']]]]};
async function main(){E.start();
  E.overlay('<div class="title"><div class="v">'+C.meta.short_title+'</div><div class="v a">'+C.meta.author+'</div><div class="side"><p>'+C.meta.title_lines.join('<br>')+'</p><button class="primary" id="go">開始</button></div></div>',true);$('go').focus();await E.waitClick('#go');
  E.overlay('<div class="card"><h2>物流中心</h2><div class="cast">'+Object.values(C.npc_slots).map(x=>'<div>'+E.glyph(x.character_id)+'<p style="margin:0"><b>'+x.display_name+'</b><br><span>'+x.persona+'</span></p></div>').join('')+'</div><p class="sub">點擊右邊的積木編寫程式，再按「執行」。「重複」積木可以把其他積木放進去；點擊程式中的積木可以選取或刪除。拖動畫面可以轉換角度。</p><button class="primary" id="go">開始送貨</button></div>',true);
  await E.waitClick('#go');E.clearOverlay();$('hud').hidden=false;
  for(let i=Math.max(0,(window.__startLv||1)-1);i<C.levels.length;i++)await level(i);
  const total=st.results.reduce((s,r)=>s+r.stars,0);const tier=GM.endings.find(e=>st.score>=e.min_score).id,EN=C.endings[tier];E.flash(true);Object.values(CH).forEach(c=>E.emote(c,'hop'));
  E.overlay('<div class="card"><p class="sub" style="margin:0">今日訂單完成</p><h2>'+EN.title+'</h2><p>'+EN.text+'</p><div class="stats"><div><b>'+st.score+'</b>分數</div><div><b>'+total+'/'+st.results.length*3+'</b>星數</div><div><b>'+st.hints+'</b>提示</div></div><ul class="review">'+
    st.results.map(r=>'<li><b>'+r.title+'</b><p>'+(r.skipped?'已看參考答案':'★'.repeat(r.stars)+'　'+r.blocks+' 個積木，執行 '+r.tries+' 次')+'</p></li>').join('')+'</ul><p style="font-family:var(--serif)">李老師：'+C.debrief+'</p><button class="primary" id="again">再送一次</button></div>',true);
  await E.waitClick('#again');location.reload();}
main();
