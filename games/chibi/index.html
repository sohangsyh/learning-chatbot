<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>赤壁疑案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121A24; --panel:rgba(18,26,37,.92); --panel-line:rgba(224,176,75,.38);
  --paper:#F4EBD6; --ink:#16202A; --muted:#B8AD94; --gold:#E0B04B; --gold-deep:#B9862A;
  --jade:#5FB49C; --cinnabar:#D2553F;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E141C; --panel:rgba(14,20,29,.94); } }
:root[data-theme="dark"]{ --bg:#0E141C; --panel:rgba(14,20,29,.94); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* HUD */
#hud{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.chap{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:8px 14px;display:flex;align-items:baseline;gap:10px;min-width:0}
.chap span{font-size:12px;color:var(--muted);white-space:nowrap}
.chap strong{font-family:var(--serif);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meters{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lamp{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px}
.lamp svg{width:26px;height:34px;flex:none}
.lamp .lab{display:flex;flex-direction:column;gap:4px;min-width:92px}
.lamp .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.lamp .row b{color:var(--paper);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:rgba(244,235,214,.14);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--gold);transition:width .6s ease,background .6s}
#assist{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px}
#assist svg{width:18px;height:18px}
#assist:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#assist.ready{box-shadow:0 0 0 0 rgba(224,176,75,.6)}
@media (prefers-reduced-motion: no-preference){ #assist.ready{animation:ping 1.8s ease-out infinite} @keyframes ping{0%{box-shadow:0 0 0 0 rgba(224,176,75,.55)}80%,100%{box-shadow:0 0 0 10px rgba(224,176,75,0)}} }
#assistBubble{position:absolute;right:12px;top:118px;width:min(320px,calc(100% - 24px));background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#assistBubble .t{font-size:12px;color:#7A6A45;margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
#assistBubble button{background:none;border:0;color:#7A6A45;font-size:12px;padding:0}

/* dialog */
#dialog{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(760px,calc(100% - 20px));max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 18px 16px}
.who{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:15px;color:var(--gold);margin-bottom:6px}
.who .dot{width:12px;height:12px;border-radius:50%;flex:none}
#line{margin:0;font-size:17px;line-height:1.75;min-height:1.75em}
#line.quote{font-family:var(--serif);font-weight:500}
#actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
#actions .next{align-self:flex-end;background:var(--gold);color:var(--ink);border:0;border-radius:10px;padding:9px 20px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(244,235,214,.05);border:1px solid rgba(244,235,214,.22);border-radius:10px;padding:11px 14px;font-size:16px;line-height:1.55}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(224,176,75,.1)}
.opt .k{font-family:var(--serif);color:var(--gold);flex:none}
.opt:disabled{opacity:.45;border-color:rgba(210,85,63,.6);text-decoration:line-through;cursor:default}
.status{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(calc(-50% - 6px))}75%{transform:translateX(calc(-50% + 6px))}} }

/* 3D-anchored labels */
#spots,#bubbles{position:absolute;inset:0;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.spot.done{border-color:var(--jade);color:var(--jade)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border-radius:12px;padding:7px 12px;font-size:14px;max-width:220px;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}

/* overlays */
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#overlay.dim{background:rgba(10,15,22,.7)}
#overlay:empty{display:none}
.card{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 24px;width:min(560px,100%);max-height:100%;overflow:auto}
.card h2{font-family:var(--serif);font-weight:900;font-size:26px;margin:0 0 6px;letter-spacing:.04em}
.card p{line-height:1.75;margin:0 0 12px}
.card .sub{color:#6F6450;font-size:14px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:11px 24px;font-weight:600;font-size:16px}
.title{display:flex;align-items:center;gap:28px;color:var(--paper)}
.title .v{writing-mode:vertical-rl;font-family:var(--serif);font-weight:900;font-size:clamp(52px,11vh,96px);letter-spacing:.12em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title .v.a{font-size:clamp(18px,2.6vh,24px);font-weight:500;letter-spacing:.4em;color:var(--gold);align-self:flex-start;margin-left:-14px}
.title .side{display:flex;flex-direction:column;gap:18px;max-width:260px}
.title .side p{font-family:var(--serif);font-size:18px;line-height:1.8;margin:0;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.title .side .primary{background:var(--gold);color:var(--ink);align-self:flex-start}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.role{text-align:left;background:#fff;border:1.5px solid #D9CCAE;border-radius:12px;padding:14px;color:var(--ink)}
.role:hover{border-color:var(--gold-deep)}
.role b{font-family:var(--serif);font-size:19px;display:block;margin-bottom:6px}
.role span{font-size:14px;line-height:1.6;display:block;color:#4C4434}
.role em{font-style:normal;font-size:12px;color:#8A7A55;display:block;margin-top:8px}
.cast{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px}
.cast div{display:flex;align-items:center;gap:12px}
.cast svg{width:34px;height:34px;flex:none}
.cast b{font-family:var(--serif)}
.cast span{font-size:14px;color:#4C4434}
.chapcard{text-align:center;color:var(--paper)}
.chapcard small{font-size:14px;color:var(--gold);letter-spacing:.3em}
.chapcard h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,6vw,54px);margin:8px 0 14px;letter-spacing:.08em}
.chapcard p{font-family:var(--serif);font-size:17px;line-height:1.8;max-width:30em;margin:0 auto;color:#E9DFC6}
.tl{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.tl li{border-left:3px solid #D9CCAE;padding:2px 0 2px 12px}
.tl li.ok{border-color:var(--jade)} .tl li.bad{border-color:var(--cinnabar)} .tl li.mid{border-color:var(--gold-deep)}
.tl b{font-family:var(--serif)} .tl .tag{font-size:12px;margin-left:6px;color:#6F6450}
.tl p{font-size:14px;margin:4px 0 0;color:#4C4434;line-height:1.6}
.stats{display:flex;gap:18px;font-size:14px;color:#6F6450;margin-bottom:6px}
.stats b{font-size:20px;color:var(--ink);font-family:var(--serif);display:block}
@media (max-width:560px){
  .title{flex-direction:column;gap:14px} .title .v{writing-mode:horizontal-tb;font-size:56px} .title .v.a{margin-left:0;align-self:center;font-size:15px;letter-spacing:.15em} .title .side{align-items:center;text-align:center} .title .side .primary{align-self:center}
  .roles{grid-template-columns:1fr}
  #line{font-size:16px}
  .chap strong{font-size:15px}
  .title{gap:18px}
  #assistBubble{top:112px}
}

.scorebox{background:var(--panel);border:1px solid var(--panel-line);border-radius:12px;padding:7px 14px;display:flex;gap:16px}
.scorebox div{display:flex;flex-direction:column;align-items:flex-end;font-size:12px;color:var(--muted)}
.scorebox b{font-family:var(--serif);font-size:20px;color:var(--paper);font-variant-numeric:tabular-nums}
.tool{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:6px 12px 6px 9px;font-size:13px}
.tool svg{width:17px;height:17px}.tool:disabled{opacity:.4;cursor:default;border-color:var(--panel-line)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));background:var(--panel);border:1px solid var(--panel-line);border-left:4px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 14px;pointer-events:none;z-index:3}
#toast.ok{border-left-color:var(--jade)}#toast.bad{border-left-color:var(--cinnabar)}
#toast b{font-family:var(--serif);font-size:15px;display:block;margin-bottom:2px}#toast.ok b{color:var(--jade)}#toast.bad b{color:#F08A74}
#toast span{font-size:14px;line-height:1.55;color:#E6DCC4}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(244,235,214,.06);border:1px solid rgba(244,235,214,.28);border-radius:10px;padding:8px 10px;font-size:14px}
.pbtn b{font-family:var(--serif);font-size:16px;color:var(--muted)}
.pbtn.float{border-color:#5AA8E0}.pbtn.float b{color:#8CC8F2}.pbtn.sink{border-color:#C98E1E}.pbtn.sink b{color:#F2C14E}
.pbtn:hover{border-color:var(--gold)}
.shaper .srow{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.shaper input[type=range]{flex:1;accent-color:var(--gold);height:28px}
.status{font-size:13px;color:var(--muted);margin:6px 0 0}
.notes{list-style:none;padding:0;margin:10px 0 14px;display:flex;flex-direction:column;gap:14px}
.notes b{font-family:var(--serif)}.notes p{font-size:14px;margin:6px 0 0;line-height:1.6;color:#4C4434}
.dt{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.dt th{text-align:left;font-weight:600;color:#6F6450;border-bottom:1px solid #D9CCAE;padding:4px 6px}
.dt td{padding:4px 6px;border-bottom:1px solid #EEE4CC}.dt td.hit{color:#2E7D62;font-weight:600}.dt td.miss{color:#B5412E;font-weight:600}
.review{list-style:none;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:10px}
.review li{border-left:3px solid var(--jade);padding:2px 0 2px 12px}.review b{font-family:var(--serif)}.review p{font-size:14px;margin:3px 0 0;color:#4C4434;line-height:1.6}

.spot{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--panel);border:1px solid var(--gold);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.plain{margin:0 0 4px;font-size:15px;line-height:1.7;color:#E6DCC4}
.pz-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.pz-row b{font-size:15px;color:var(--paper);font-family:var(--serif);font-weight:500;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{background:rgba(244,235,214,.06);border:1px solid rgba(244,235,214,.28);border-radius:999px;padding:6px 14px;font-size:14px}
.chipb.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}

.ecard{background:rgba(244,235,214,.06);border:1px solid rgba(224,176,75,.4);border-radius:12px;padding:12px 14px;margin-bottom:4px}
.card .ecard{background:#fff;border-color:#D9CCAE;margin-bottom:10px}
.ecard .eh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}.ecard .eh b{font-family:var(--serif);font-size:16px}.ecard .eh span{font-size:12px;border:1px solid currentColor;border-radius:999px;padding:1px 8px;opacity:.8}
.ecard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0 0 8px;font-size:13px}.ecard dt{opacity:.65}.ecard dd{margin:0}
.ecard .ex{font-family:var(--serif);font-size:15px;line-height:1.7;margin:0 0 6px}.ecard .nt{font-size:13px;line-height:1.6;margin:0;opacity:.85}
.cards h3{font-family:var(--serif);font-size:16px;margin:14px 0 6px}.tst{margin:0;padding-left:1.4em;font-size:14px;line-height:1.7}
.seqlist{margin:0 0 10px;padding-left:1.6em;display:flex;flex-direction:column;gap:4px;font-size:15px}.seqlist li.empty{color:var(--muted)}
.chipb.used{opacity:.35}.ghost{align-self:flex-start;background:none;border:1px solid rgba(244,235,214,.3);border-radius:10px;padding:7px 14px;font-size:14px;color:var(--muted)}
#actions .chips{gap:8px}
#objection{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%) rotate(-6deg);font-family:var(--serif);font-weight:900;font-size:clamp(40px,9vw,84px);color:#fff;background:var(--cinnabar);padding:6px 28px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none;z-index:5}
@media (prefers-reduced-motion: no-preference){#objection.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(.3)}100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}}}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="3D 遊戲場景"></canvas>
  <div id="spots"></div>
  <div id="bubbles"></div>
  <header id="hud" hidden>
    <div class="chap"><span id="chapNo"></span><strong id="chapTitle"></strong></div>
    <div class="meters">
      <div class="lamp" aria-label="真相值">
        <svg viewBox="0 0 40 52" aria-hidden="true"><circle cx="20" cy="26" r="17" fill="#1E3A5A" stroke="#E0B04B" stroke-width="2"/><circle id="mGlow" cx="20" cy="26" r="12" fill="#F2C14E" opacity=".3"/><path d="M8 34 L16 22 L21 29 L26 20 L33 34 Z" fill="#0E2A22" opacity=".75"/></svg>
        <div class="lab"><div class="row"><span>真相值</span><b id="mStage">40</b></div><div class="bar"><i id="mBar"></i></div><div class="row"><span>分數</span><b id="score">0</b></div><span id="mVal" hidden></span></div>
      </div>
      <button class="tool" id="assist" aria-label="學伴提示，扣兩分"><svg viewBox="0 0 24 24" fill="none" stroke="#E0B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>學伴提示</button>
      <button class="tool" id="notebook"><svg viewBox="0 0 24 24" fill="none" stroke="#E0B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM9 8h6M9 12h6"/></svg>證物冊<small id="nbCount" style="color:var(--muted);font-size:11px;margin-left:4px">0</small></button>
    </div>
  </header>
  <div id="objection" hidden aria-hidden="true">有矛盾！</div>
  <div id="toast" hidden role="status"><b id="toastT"></b><span id="toastD"></span></div>
  <div id="toast" hidden role="status"><b id="toastT"></b><span id="toastD"></span></div>
  <div id="assistBubble" hidden role="status"></div>
  <section id="dialog" hidden aria-live="polite">
    <div class="who"><i class="dot" id="whoDot"></i><span id="whoName"></span></div>
    <p id="line"></p>
    <div id="actions"></div>
  </section>
  <div id="overlay"></div>
</div>

idence": "zhouyu", "show": "fire", "caption": "黃蓋詐降，戰船滿載柴草衝向曹軍連船，乘風放火。"}, {"id": "r2", "button": "查看當日的風", "evidence": "wind", "show": "wind", "caption": "史書記載：當時東南風很急。"}, {"id": "r3", "button": "按《武帝紀》重演", "evidence": "wudi", "show": "plague", "caption": "曹軍營中瘟疫流行，士兵大量病死，曹操於是退兵。"}, {"id": "r4", "button": "讀曹操的書信", "evidence": "cao_letter", "show": "self", "caption": "曹操說：遇上疾病，是我自己燒船退兵的。"}]}, {"id": "court", "title": "公堂對質", "type": "cross_exam", "env": "morning", "lines": {"enter": "說書人來了。逐句聽他的證詞，找出和史料矛盾的地方，出示證據。", "win": "說書人：唉，原來我說的都是小說……不過故事好聽，我還是會照講的！"}, "testimony": [{"text": "草船借箭，是諸葛亮在赤壁之戰時想出的妙計！", "press": "我小時候聽師父講的，他說千真萬確。", "answer": "weilue", "reveal": "《魏略》記載以船受箭的是孫權，在公元 213 年的濡須，不是諸葛亮，也不在赤壁。"}, {"text": "這件事，正史《三國志》寫得清清楚楚！", "press": "諸葛亮傳裡一定有寫，你自己去看！", "answer": "sgz_zhuge", "reveal": "《三國志・諸葛亮傳》只記載諸葛亮出使東吳、說服孫權聯合抗曹，根本沒有草船借箭。"}, {"text": "赤壁那把火，是諸葛亮作法借來東風點的！", "press": "不是神機妙算，怎會剛好有東風？", "answer": "zhouyu", "reveal": "《周瑜傳》記載火攻是黃蓋提出並執行的；東南風只是當時的天氣。"}, {"text": "就連曹操自己也承認，是被周瑜打敗的！", "press": "敗軍之將，當然要認輸啦。", "answer": "cao_letter", "reveal": "曹操在信中說是自己燒船撤退，周瑜只是「虛獲此名」。他根本不肯承認敗給周瑜。"}]}], "deduction": [{"question": "草船借箭的故事，最早可以追溯到哪裡？", "options": ["《魏略》記載孫權在濡須以船受箭", "《三國志・諸葛亮傳》的記載", "曹操寫給孫權的書信", "陳壽親眼所見的赤壁之戰"], "answer": 0, "explain": "《魏略》的孫權受箭事件，後來被小說移花接木，改成諸葛亮在赤壁借箭。"}, {"question": "為甚麼曹魏一方的記載強調「大疫」，東吳一方的記載強調「火攻」？", "options": ["雙方立場不同，各自強調對自己有利的原因", "其中一方一定在說謊", "瘟疫和火攻不可能同時發生", "史官記錯了日期"], "answer": 0, "explain": "兩者可以同時存在。立場會影響史料強調甚麼、淡化甚麼，所以要多方比對。"}], "gate": {"question": "判斷一份史料的可信程度，最應該考慮甚麼？", "options": ["作者立場、成書時間和史料性質", "故事是否精彩動人", "書本是否廣為流傳", "內容是否和戲曲一致"], "answer": 0, "explain": "史料要問三件事：誰寫的、甚麼時候寫的、是甚麼性質的材料。流傳廣、故事好聽，都不等於可信。"}, "endings": {"best": {"title": "真相大白", "text": "你分清了小說與史實，也看懂了不同立場的史料。"}, "normal": {"title": "大致查明", "text": "案件已破，但有些證據可以出示得更準確。"}, "fail": {"title": "疑點重重", "text": "你被說書人帶偏了好幾次。記住：好聽的故事不一定是歷史。"}}, "debrief": "草船借箭來自小說的移花接木，赤壁大火是黃蓋的火攻，曹操卻說是自己燒船。查史料，要問誰寫的、甚麼時候寫、為甚麼這樣寫。"}</script>

/* characters: slot + skin; every skin follows the character spec (body, 2 eyes, 2 legs) */
E.PAL={G:[0xFF8A1C,0xD9631A],O:[0x10C77A,0x0A9E5E],A:[0x1677E8,0x0F55B8],I:[0xFDD015,0xE5A80E],P:[0xE8577E,0xC23E63]};
E.hex=n=>'#'+n.toString(16).padStart(6,'0');
const NAVY=0x0B1F5E;
function rrect(w,h,r){const s=new THREE.Shape();s.moveTo(-w+r,0);s.lineTo(w-r,0);s.quadraticCurveTo(w,0,w,r);s.lineTo(w,h-r);s.quadraticCurveTo(w,h,w-r,h);s.lineTo(-w+r,h);s.quadraticCurveTo(-w,h,-w,h-r);s.lineTo(-w,r);s.quadraticCurveTo(-w,0,-w+r,0);return s;}
function shapeFor(id){
  const S=[];let eyes;
  if(id==='A'){const s=new THREE.Shape();s.moveTo(-.54,0);s.lineTo(.54,0);s.lineTo(0,.95);s.closePath();S.push(s);eyes=[[-.14,.3,.13],[.14,.3,.13]];}
  if(id==='I'){S.push(rrect(.27,.96,.05));eyes=[[-.15,.64,.15],[.15,.64,.15]];}
  if(id==='P'){S.push(rrect(.3,.8,.28));eyes=[[-.12,.56,.12],[.12,.56,.12]];}
  if(id==='G'){const s=new THREE.Shape(),R=.46,r=.26,cy=.47,a0=.62,a1=Math.PI*2-.72;s.absarc(0,cy,R,a0,a1,false);s.absarc(0,cy,r,a1,a0,true);S.push(s);
    const t=new THREE.Shape();const P=[[.14,.62],[.62,.62],[.62,.14],[.5,.14],[.5,.42],[.27,.19],[.18,.28],[.41,.5],[.14,.5]];t.moveTo(P[0][0],P[0][1]);P.slice(1).forEach(p=>t.lineTo(p[0],p[1]));t.closePath();S.push(t);
    eyes=[[-.16,.88,.13],[.1,.88,.13]];}
  if(id==='O'){const s=new THREE.Shape(),cy=.46;s.absarc(0,cy,.44,0,Math.PI*2,false);const hole=new THREE.Path();hole.absarc(0,cy,.25,0,Math.PI*2,true);s.holes.push(hole);S.push(s);eyes=[[-.3,.78,.13],[-.05,.88,.13]];}

E.chars={};
E.makeChar=function(slot,id,costume){
  const [col,dk]=E.PAL[id];const {S,eyes}=shapeFor(id);const M=E.M,mesh=E.mesh,box=E.box;
  const root=new THREE.Group();scene.add(root);
  const hip=new THREE.Group();hip.position.y=.47;root.add(hip);const body=new THREE.Group();hip.add(body);
  S.forEach(s=>{const g=new THREE.ExtrudeGeometry(s,{depth:.26,bevelEnabled:true,bevelThickness:.05,bevelSize:.035,bevelSegments:3,curveSegments:28});g.translate(0,0,-.13);mesh(g,M(col),0,0,0,body);});
  const eyeObjs=eyes.map(([x,y,r])=>{const g=new THREE.Group();g.position.set(x,y,.2);body.add(g);
    const o=mesh(new THREE.CylinderGeometry(r+.03,r+.03,.03,28),M(col),0,0,-.012,g);o.rotation.x=Math.PI/2;
    const w=mesh(new THREE.CylinderGeometry(r,r,.035,28),new THREE.MeshBasicMaterial({color:0xffffff}),0,0,.006,g);w.rotation.x=Math.PI/2;
    const p=mesh(new THREE.CylinderGeometry(r*.56,r*.56,.03,24),new THREE.MeshBasicMaterial({color:NAVY}),0,0,.03,g);p.rotation.x=Math.PI/2;return {g,p,x,y,r};});
  const legs=[-1,1].map(sd=>{const piv=new THREE.Group();piv.position.set(sd*.13,.47,0);root.add(piv);
    box(.115,.44,.125,col,0,-.22,0,piv);box(.118,.07,.128,dk,0,-.06,0,piv);
    const f=mesh(new THREE.SphereGeometry(.5,14,10),M(col),sd*.07,-.44,.04,piv);f.scale.set(.34,.2,.3);return piv;});
  const sh=mesh(new THREE.CircleGeometry(.48,24),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.2,depthWrite:false}),0,.02,0,root);sh.rotation.x=-Math.PI/2;
  const c={slot,id,root,hip,body,eyes:eyeObjs,legs,target:new THREE.Vector3(),speed:3,phase:Math.random()*6,blinkAt:1+Math.random()*3,blinkT:0,emote:null,emoteT:0,talk:false,face:null,lookAt:null,onArrive:null};
  root.scale.setScalar(1.25);
  const bb=new THREE.Box3().setFromObject(body);const topY=bb.max.y;
  (costume||[]).forEach(k=>{
    if(k==='goggles'){const lensM=new THREE.MeshPhongMaterial({color:0xE8FAFF,transparent:true,opacity:.1,depthWrite:false,shininess:120,specular:0xFFFFFF});eyeObjs.forEach(e=>{mesh(new THREE.TorusGeometry(e.r+.05,.012,6,28),new THREE.MeshPhongMaterial({color:0xD8E6EE,transparent:true,opacity:.85}),e.x,e.y,.27,body);const l=mesh(new THREE.CircleGeometry(e.r+.045,28),lensM,e.x,e.y,.285,body);l.renderOrder=5;});
      const y=eyeObjs[0].y;box(Math.abs(eyeObjs[1].x-eyeObjs[0].x)-.1,.018,.012,0xD8E6EE,(eyeObjs[0].x+eyeObjs[1].x)/2,y,.27,body);}
    if(k==='hardhat'||k==='hardhat_o'){const hc=k==='hardhat'?0xF2C81A:0xF27A1A;const d=mesh(new THREE.SphereGeometry(.2,16,10,0,Math.PI*2,0,Math.PI/2),M(hc),0,topY-.05,0,body);d.scale.set(1,.85,1);mesh(new THREE.CylinderGeometry(.27,.27,.025,20),M(hc),0,topY-.05,0,body);box(.04,.08,.36,hc,0,topY+.08,0,body);}
    if(k==='cap'){const d=mesh(new THREE.SphereGeometry(.17,14,8,0,Math.PI*2,0,Math.PI/2),M(0xE0574A),0,topY-.04,0,body);d.scale.set(1,.8,1);box(.3,.025,.18,0xC23E33,0,topY-.03,.17,body);}
    if(k==='ru_hat'){box(.5,.04,.28,0x2A2A33,-.03,1.06,0,body);box(.22,.13,.2,0x2A2A33,-.03,1.14,0,body);}
    if(k==='coin'){const cn=mesh(new THREE.CylinderGeometry(.09,.09,.03,20),M(0xE8B93A,{emissive:0x4A3000}),0,.12,.205,body);cn.rotation.x=Math.PI/2;box(.04,.04,.035,0x3A2A10,0,.12,.225,body);}
    if(k==='tie'){box(.1,.05,.03,0x1E2A44,0,.36,.21,body);const t=box(.08,.22,.03,0x2F4A8A,0,.22,.21,body);}
    if(k==='hood'){const hd=mesh(new THREE.ConeGeometry(.32,.36,4),M(0x2A2F3A,{flatShading:true}),0,1.05,0,body);hd.rotation.y=Math.PI/4;}
    if(k==='beacon'){const lg=new THREE.Group();lg.position.set(0,1.32,0);body.add(lg);E.mesh(new THREE.CylinderGeometry(.12,.14,.07,12),M(0x4A4F58),0,-.04,0,lg);
      const dome=mesh(new THREE.SphereGeometry(.12,14,8,0,Math.PI*2,0,Math.PI/2),M(0x3FD08A,{emissive:0x1AA060}),0,0,0,lg);
      const pl=new THREE.PointLight(0x7CFFC0,1,8,1.5);lg.add(pl);c.lamp={g:lg,mat:dome.material.clone(),light:pl,beacon:true,baseY:1.32};dome.material=c.lamp.mat;}
    if(k==='lantern'){const lg=new THREE.Group();lg.position.set(.55,1.35,0);root.add(lg);
      const lb=mesh(new THREE.SphereGeometry(.5,14,10),M(0xC8452F,{emissive:0xFF7A2A}),0,0,0,lg);lb.scale.set(.3,.36,.3);
      mesh(new THREE.CylinderGeometry(.1,.1,.06,10),M(0xE0B04B),0,.2,0,lg);mesh(new THREE.CylinderGeometry(.1,.1,.06,10),M(0xE0B04B),0,-.2,0,lg);

};
E.emote=function(c,type){c.emote=type;c.emoteT=0;};
E.lookFocus=null;E.lampValue=()=>.6;
const tv=new THREE.Vector3(),tv2=new THREE.Vector3(),tv3=new THREE.Vector3();
function updateChar(c,dt,t){
  const p=c.root.position;tv.copy(c.target).sub(p);tv.y=0;const dist=tv.length();let moving=false;
  if(dist>.04){moving=true;p.addScaledVector(tv.normalize(),Math.min(dist,c.speed*dt));}
  else if(c.onArrive){const f=c.onArrive;c.onArrive=null;f();}
  const yawT=moving?Math.atan2(tv.x,tv.z):(c.face!=null?c.face:Math.atan2(camera.position.x-p.x,camera.position.z-p.z));
  let dy=yawT-c.root.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));c.root.rotation.y+=dy*Math.min(1,dt*8);

  if(c.talk){const k=Math.sin(t*15)*.045;sy+=k;sx-=k*.6;}
  if(c.emote){c.emoteT+=dt;const e=c.emoteT;
    if(c.emote==='hop')by+=Math.max(0,Math.sin(e*9))*.35*Math.max(0,1-e/1.1);

    if(c.emote==='slump'){const f=Math.max(0,1-Math.max(0,e-1.2)/.6);sy-=.12*Math.sin(Math.min(1,e/.5)*Math.PI/2)*f;sx+=.06*f;}
    if(e>1.9)c.emote=null;}

  let bl=1;if(c.blinkT>0){c.blinkT-=dt;bl=Math.max(.08,Math.abs(c.blinkT/.07-1));}

  if(c.lamp){const b=E.lampValue();c.lamp.light.intensity=.25+b*1.9;if(c.lamp.beacon){c.lamp.mat.emissive.setRGB(.9-b*.8,.15+b*.6,.1+b*.3);c.lamp.light.color.setRGB(1-b*.5,.3+b*.7,.3+b*.45);}else{c.lamp.mat.emissive.setRGB(.25+b*.75,.12+b*.36,.04);c.lamp.g.position.y=1.35+Math.sin(t*1.6)*.06;c.lamp.g.rotation.z=Math.sin(t*1.3)*.08;}}
}

/* camera */
const cam=E.cam={p0:new THREE.Vector3(),p1:new THREE.Vector3(),l0:new THREE.Vector3(),l1:new THREE.Vector3(),look:new THREE.Vector3(),t:1,dur:1,res:null,idle:null};
const par={x:0,y:0,cx:0,cy:0};E.parallax=1;
addEventListener('pointermove',e=>{par.x=e.clientX/innerWidth-.5;par.y=e.clientY/innerHeight-.5;});
E.camTo=function(pos,look,dur){cam.p0.copy(camera.position);cam.l0.copy(cam.look);cam.p1.copy(pos);cam.l1.copy(look);cam.t=0;cam.dur=RM?.01:dur;return new Promise(r=>cam.res=r);};

function updateCam(dt,t){

/* 3D-anchored UI */
const pv=new THREE.Vector3();
E.project=function(v,el){pv.copy(v).project(camera);if(pv.z>1||Math.abs(pv.x)>1.15||Math.abs(pv.y)>1.15){el.style.visibility='hidden';return;}
  el.style.visibility='';el.style.left=((pv.x+1)/2*canvas.clientWidth)+'px';el.style.top=((1-pv.y)/2*canvas.clientHeight)+'px';};
const bubbles=[];
E.floatBubble=function(c,text,ms){const el=document.createElement('div');el.className='bub';el.textContent=text;$('bubbles').appendChild(el);const b={c,el};bubbles.push(b);
  setTimeout(()=>{el.remove();const i=bubbles.indexOf(b);if(i>=0)bubbles.splice(i,1);},ms||3000);};
E.anchors=[];


/* occlusion fade: anything between the camera and what it looks at becomes see-through */
E.fade={on:true,extra:null,list:new Map(),tick:0};
const fray=new THREE.Raycaster(),fdir=new THREE.Vector3();
function occlusion(dt){const F=E.fade;if(!F.on||!scene)return;const now=performance.now();F.tick++;
  for(const k in E.chars){const c=E.chars[k];if(c&&c.root)c.root.userData.isChar=true;}
  if(F.tick%4===0){const tg=[cam.look].concat(F.extra||[]);
    for(const t of tg){fdir.copy(t).sub(camera.position);const dist=fdir.length();if(dist<1)continue;fdir.normalize();fray.set(camera.position,fdir);fray.near=.2;fray.far=Math.max(.5,dist-.9);
      const hits=fray.intersectObjects(scene.children,true);
      for(const h of hits){const m=h.object;if(!m.isMesh||m.userData.noFade||m===E.ground||Array.isArray(m.material)||m.material.visible===false)continue;
        let o=m,isChar=false;while(o){if(o.userData&&o.userData.isChar){isChar=true;break;}o=o.parent;}if(isChar)continue;const g=m.geometry,p=g&&g.parameters;
        if(p&&((p.width&&p.width>30)||(p.radius&&p.radius>30)))continue;
        let rec=F.list.get(m);if(!rec){const src=m.material,cl=src.clone();cl.transparent=true;cl.depthWrite=false;rec={src,cl,base:src.transparent?src.opacity:1};cl.opacity=rec.base;m.material=cl;F.list.set(m,rec);}rec.seen=now;}}}
  F.list.forEach((rec,m)=>{const hid=now-rec.seen<450;const want=hid?Math.min(rec.base,.22):rec.base;rec.cl.opacity+=(want-rec.cl.opacity)*Math.min(1,dt*9);

/* loop */
const clock=E.clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  updateEnv(dt);updateCam(dt,t);
  Object.values(E.chars).forEach(c=>updateChar(c,dt,t));
  if(E.onFrame)E.onFrame(dt,t);
  occlusion(dt);
  bubbles.forEach(b=>E.project(tv.copy(b.c.root.position).add(tv2.set(0,2.35,0)),b.el));
  E.anchors.forEach(a=>{if(!a.el.hidden)E.project(a.pos,a.el);});

}
E.start=()=>requestAnimationFrame(frame);

/* dialog */
E.SPK={};let typing=null;
E.setTalker=function(key){Object.values(E.chars).forEach(c=>c.talk=false);E.lookFocus=null;const c=E.chars[key];if(c){c.talk=true;E.lookFocus=c;}};

};

<script>/* Detective mode (source-based investigation) built on ENG */
(function(){
"use strict";
const E=ENG,$=E.$,V=(x,y,z)=>new THREE.Vector3(x,y,z);

window.__det=st;
E.init({canvas:$('scene'),onResize:()=>{},onFrame});E.bindDialog();E.parallax=.1;

  const show={
    fire:async()=>{const tg=X.fleet;await anim(3,k=>{X.fire.forEach((s,i)=>{s.position.z=X.c.z+3.5-k*11.5;s.position.x=X.c.x-8+i*4;});});
      X.fire.forEach(s=>puff(s.position.clone().add(V(0,.8,0)),0xFF8A2A,6,1.2,1,1.2,.35));for(let i=0;i<tg.length;i++){const s=tg[i];setTimeout(()=>{for(let k=0;k<3;k++)puff(s.position.clone().add(V(0,1,0)),k?0xFFB23A:0xFF5A1A,8,1.4,1.2,1.6,.4);s.children.forEach(m=>{if(m.material&&m.material.color)m.material=M(0x2A2420);});},i*260);}
      E.flash(false,0xFF6A2A);await E.sleep(2600);for(let i=0;i<14;i++)puff(V(X.c.x-9+Math.random()*18,1.5,X.c.z-9),0x4A4A4A,2,.8,.6,3,.6,1.01);},
    wind:async()=>{st.windOn=true;for(let i=0;i<30;i++){const m=mesh(new THREE.BoxGeometry(1.4,.03,.03),new THREE.MeshBasicMaterial({color:0xFFFFFF,transparent:true,opacity:.7}),X.c.x+8+Math.random()*6,1+Math.random()*4,X.c.z+4+Math.random()*4,E.scene);m.rotation.y=.8;st.fx.push({m,v:V(-6,0,-6),g:0,life:2.2});}await E.sleep(2200);},
    plague:async()=>{X.tents.forEach(t=>{for(let k=0;k<4;k++)puff(t.position.clone().add(V(0,1,0)),0x9AB86A,3,.5,.3,3,.5,1.005);});E.flash(false,0x5A6A3A);await E.sleep(2500);},
    self:async()=>{for(let i=X.fleet.length-1;i>=0;i--){const s=X.fleet[i];puff(s.position.clone().add(V(0,1,0)),0xFF8A2A,6,1,1,1.4,.35);await E.sleep(180);}E.emote(CH.rival,'shake');await E.sleep(1400);}
  };
  await new Promise(res=>{const draw=()=>{const nodes=l.replays.map(rp=>{const b=E.btn(done.has(rp.id)?'chipb used':'chipb',rp.button,async()=>{if(st.busy||done.has(rp.id))return;st.busy=true;E.actions([]);E.hideDialog();
        await show[rp.show]();toast(rp.button.replace('按','').replace('重演',''),rp.caption,'');await getCard(rp.evidence,'mentor');done.add(rp.id);st.busy=false;if(done.size>=l.replays.length)res();else{E.actions([]);E.showLine('mentor','還有 '+(l.replays.length-done.size)+' 種說法。').then(draw);}});return b;});
      const w=document.createElement('div');w.className='chips';nodes.forEach(n=>w.appendChild(n));E.actions([w]);};
    E.actions([]);E.showLine('mentor','選一份史料，重演當時的情形。').then(draw);});
  meter(6);await E.say('mentor',l.lines.after);
}
async function locCourt(l){
  await E.say('mentor',l.lines.enter);const R=CH.rival;
  for(let i=0;i<l.testimony.length;i++){const t=l.testimony[i];st.hint='這句證詞，和哪一份證物的記載矛盾？打開證物冊對照作者和內容。';
    for(;;){const act=await new Promise(async res=>{E.actions([]);E.emote(R,'hop');await E.showLine('rival','證詞 '+(i+1)+'：'+t.text);E.actions([E.btn('ghost','追問',()=>res('press')),E.btn('next','出示證據',()=>res('present')),E.skipBtn(()=>res('skip'),'跳過這句，看答案')]);});
      if(act==='press'){await E.say('rival',t.press);continue;}
      if(act==='skip'){if(!st.cards.includes(t.answer))st.cards.push(t.answer);await E.say('mentor','應該出示的是'+EV[t.answer].name+'。'+t.reveal);break;}
      const pick=await new Promise(async res=>{E.actions([]);await E.showLine('narrator','出示哪一份證物？');const w=document.createElement('div');w.className='pgrid';st.cards.forEach(id=>w.appendChild(E.btn('pbtn','<span>'+EV[id].name+'</span>',()=>res(id))));E.actions([w,E.btn('ghost','返回',()=>res(null))]);});
      if(!pick)continue;
      if(pick===t.answer){meter(GM.scoring.present_right);addScore(GM.scoring.present_right);E.flash(true);E.emote(R,'shake');E.emote(CH.companion,'hop');
        const o=$('objection');o.hidden=false;o.classList.remove('pop');void o.offsetWidth;o.classList.add('pop');await E.sleep(900);o.hidden=true;
        await E.say('mentor',t.reveal);break;}
      st.wrongs++;meter(GM.scoring.present_wrong);E.emote(R,'hop');E.flash(false);toast('這份證物對不上',EV[pick].name+'的內容和這句證詞沒有直接矛盾。','bad');await E.say('rival','哈！這和我說的有甚麼關係？');}
  }
  E.emote(R,'slump');await E.say('rival',l.lines.win);
}
const RUN={investigate:locTeahouse,timeline:locLibrary,arrow_boat:locRuxu,replay:locChibi,cross_exam:locCourt};

/* final */
async function finale(){
  for(const q of C.deduction){const dis=new Set();let w=0;for(;;){const i=await E.ask('mentor',q.question,q.options,dis,{skip:true});if(i===-1){w=99;break;}if(i===q.answer)break;w++;dis.add(i);meter(-3);E.emote(CH.mentor,'shake');}
    if(w===99)await E.say('mentor','答案是「'+q.options[q.answer]+'」。'+q.explain);else{addScore(Math.max(2,GM.scoring.deduction_first_try-w*GM.scoring.wrong_penalty));await E.say('mentor','沒錯。'+q.explain);}}
  const g=C.gate,dis=new Set();let w=0;for(;;){const i=await E.ask('gatekeeper',g.question,g.options,dis,{skip:true});if(i===-1){w=99;break;}if(i===g.answer)break;w++;dis.add(i);E.emote(CH.gatekeeper,'shake');}
  if(w===99)await E.say('gatekeeper','答案是「'+g.options[g.answer]+'」。'+g.explain);else{addScore(Math.max(2,GM.scoring.gate_first_try-w*GM.scoring.wrong_penalty));meter(5);await E.say('gatekeeper','結案。'+g.explain);}
}
async function main(){
  E.start();E.overlay('<div class="title"><div class="v">'+C.meta.short_title+'</div><div class="v a">'+C.meta.author+'</div><div class="side"><p>'+C.meta.title_lines.join('<br>')+'</p><button class="primary" id="go">接案</button></div></div>',true);
  $('go').focus();await E.waitClick('#go');
  E.overlay('<div class="card"><h2>本案人物</h2><div class="cast">'+Object.values(C.npc_slots).map(x=>'<div>'+E.glyph(x.character_id)+'<p style="margin:0"><b>'+x.display_name+'</b><br><span>'+x.persona+'</span></p></div>').join('')+'</div><p class="sub">你是史館的新任查案官。收集史料、比較說法，最後在公堂上用證據拆穿錯誤的說法。右上角的「真相值」會隨你的判斷升降。</p><button class="primary" id="go">出發</button></div>',true);
  await E.waitClick('#go');E.clearOverlay();$('hud').hidden=false;
  for(let i=0;i<C.locations.length;i++){const l=C.locations[i];st.loc=i;
    E.overlay('<div class="chapcard"><small>第'+E.NUM[i]+'幕</small><h2>'+l.title+'</h2></div>',true);await Promise.race([E.sleep(E.RM?800:1800),new Promise(r=>$('overlay').addEventListener('click',r,{once:true}))]);E.clearOverlay();
    $('chapNo').textContent='第'+E.NUM[i]+'幕';$('chapTitle').textContent=l.title;E.setEnv(l.env);await goTo(l.id,l.type==='cross_exam');
    await RUN[l.type](l);E.hideDialog();st.hint=null;}
  await finale();E.hideDialog();
  const tier=GM.endings.find(e=>st.meter>=e.min_meter).id,EN=C.endings[tier];E.flash(true);Object.values(CH).forEach(c=>E.emote(c,'hop'));await E.sleep(700);
  E.overlay('<div class="card"><p class="sub" style="margin:0">結案報告</p><h2>'+EN.title+'</h2><p>'+EN.text+'</p><div class="stats"><div><b>'+Math.round(st.meter)+'</b>真相值</div><div><b>'+st.score+'</b>分數</div><div><b>'+st.wrongs+'</b>出示錯誤</div></div>'+
    '<p style="margin-top:6px"><b>拆穿的說法</b></p><ul class="review">'+C.locations.find(x=>x.type==='cross_exam').testimony.map(t=>'<li><b>'+t.text+'</b><p>'+t.reveal+'</p></li>').join('')+'</ul><p style="font-family:var(--serif)">裴松之：'+C.debrief+'</p><button class="primary" id="again">再查一次</button></div>',true);
  await E.waitClick('#again');location.reload();
}
main();
})();
</script>
