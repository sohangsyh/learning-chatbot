<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenMAIC-GamePlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--sky1:#2F6BFF;--sky2:#3D7BFF;--sky3:#5A8DFF;--surface:#F2F7FF;--soft:#DFEAFF;--ink:#0F1E45;--muted:#4A5B85;--line:#C3D5F7;--sun:#FFC931;--sun2:#D9A200;--coral:#FF4F5A;--coral2:#C8333D;--grape:#6D4BFF;--mint:#00BFA5;--mint2:#008C79;--sky:#2F6BFF;
  --cG:#FF8A1C;--cO:#10C77A;--cA:#1677E8;--cI:#F5B800;--user:#FFF0B3;--shadow:0 5px 0 rgba(10,30,90,.22),0 14px 30px rgba(10,30,90,.22);
  --round:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--sans:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1F55E8;--sky2:#2A62F0;--sky3:#3A72F5;--surface:#203A8F;--soft:#2A4AA6;--ink:#FFFFFF;--muted:#C9D7FF;--line:#3D5FC4;--user:#6B5410;--shadow:0 5px 0 rgba(5,15,60,.35),0 14px 30px rgba(5,15,60,.35);color-scheme:dark}}
:root[data-theme="dark"]{--sky1:#1F55E8;--sky2:#2A62F0;--sky3:#3A72F5;--surface:#203A8F;--soft:#2A4AA6;--ink:#FFFFFF;--muted:#C9D7FF;--line:#3D5FC4;--user:#6B5410;--shadow:0 5px 0 rgba(5,15,60,.35),0 14px 30px rgba(5,15,60,.35);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-size:16px;background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.18),transparent 40%),linear-gradient(160deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%) fixed;color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font-family:inherit}
/* floating shapes */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fl{position:absolute;width:var(--s);height:var(--s);opacity:.5;animation:drift var(--t) ease-in-out infinite;animation-delay:var(--d);transform:rotate(var(--r))}
.flO{border-radius:50%;border:calc(var(--s)*.22) solid var(--c)}.flA{background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:4px}
.flI{background:var(--c);width:calc(var(--s)*.45);border-radius:4px}.flG{border-radius:50%;border:calc(var(--s)*.22) solid var(--c);border-right-color:transparent}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-28px) rotate(calc(var(--r) + 40deg))}}
/* header */
header.top{position:relative;z-index:2;margin:12px clamp(10px,2vw,22px) 0;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:10px 14px 10px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.logo{width:48px;height:48px;border-radius:16px;background:conic-gradient(var(--cG) 0 25%,var(--cO) 0 50%,var(--cA) 0 75%,var(--cI) 0);display:grid;place-items:center;animation:spinIn 1s cubic-bezier(.3,1.6,.5,1)}
.logo span{width:34px;height:34px;border-radius:11px;background:var(--surface);display:grid;place-items:center;font:800 20px var(--round);color:var(--ink)}
@keyframes spinIn{from{transform:rotate(-180deg) scale(.4)}}
.brand h1{margin:0;font:800 clamp(19px,2.2vw,24px)/1.1 var(--round);letter-spacing:-.01em;color:var(--ink)}
.brand p{margin:1px 0 0;color:var(--muted);font-size:13px;font-weight:500}
.crew{display:flex;align-items:flex-end;gap:3px;height:52px;margin-left:6px}.crew .mascot{width:34px;height:44px}
.tabs{display:flex;gap:6px;margin-left:auto;background:var(--soft);padding:5px;border-radius:18px}
.tab{border:0;font:700 15px var(--round);padding:9px 18px;border-radius:14px;cursor:pointer;background:transparent;color:var(--muted);transition:background .2s,color .2s,transform .15s}
.tab:hover{transform:translateY(-1px)}.tab[aria-selected="true"]{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral2)}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}.lang button{border:0;background:none;font:700 13px var(--round);color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--grape);color:#fff}
#engChip{border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 13px var(--round);border-radius:999px;padding:6px 12px;cursor:pointer;display:none;align-items:center;gap:6px}#engChip .dot{width:10px;height:10px;border-radius:50%}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
main{position:relative;z-index:1;flex:1;min-height:0}.panel[hidden]{display:none!important}
/* studio */
#gen{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;height:100%;padding:14px clamp(10px,2vw,22px)}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.chathead{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}.chathead h2{margin:0;font:800 20px var(--round)}.chathead .sp{flex:1}
#track{list-style:none;margin:6px 16px 4px;padding:28px 6px 8px;display:flex;justify-content:space-between;position:relative}
#track::before{content:"";position:absolute;left:30px;right:30px;top:46px;border-top:4px dashed var(--line)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:1;flex:1}
.pad{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--round);background:var(--soft);color:var(--muted);border:3px solid var(--line);transition:all .3s;transform:rotate(45deg)}
.pad b{transform:rotate(-45deg)}
.lab{font:700 12px var(--round);color:var(--muted);white-space:nowrap}
.stop[data-status="run"] .pad{background:var(--sun);border-color:var(--sun2);color:var(--ink);animation:wob 1s ease-in-out infinite}
.stop[data-status="done"] .pad{background:var(--mint);border-color:var(--mint2);color:#fff}.stop[data-status="done"] .lab{color:var(--mint2)}
.stop[data-status="fail"] .pad{background:var(--coral);border-color:var(--coral2);color:#fff}
@keyframes wob{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.15)}}
.runner{position:absolute;top:-6px;width:34px;height:42px;transition:left .7s cubic-bezier(.4,1.5,.6,1);z-index:2;pointer-events:none}.runner .mascot{width:34px;height:42px;animation:hop .7s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#msgs{flex:1;overflow:auto;padding:12px clamp(10px,2vw,24px) 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:min(800px,96%);opacity:0;transform:translateY(14px) scale(.96);transition:opacity .35s,transform .45s cubic-bezier(.3,1.5,.5,1)}.msg.in{opacity:1;transform:none}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.av{flex:0 0 46px;width:46px;height:52px;display:grid;place-items:end center}.av .mascot{width:38px;height:47px}.av svg:not(.mascot){width:42px;height:42px}
.bub{position:relative;background:#FFFFFF;color:#0F1E45;border:3px solid var(--c,var(--line));border-radius:22px 22px 22px 6px;padding:11px 16px;line-height:1.75;font-size:16px;min-width:0;box-shadow:0 4px 0 color-mix(in srgb,var(--c,#000) 25%,transparent)}
.msg.user .bub{background:var(--user);border-color:var(--sun);border-radius:22px 22px 6px 22px;box-shadow:0 4px 0 var(--sun2)}
.who{display:block;font:700 13px var(--round);color:var(--c);filter:brightness(.85);margin-bottom:1px}
.bub b.h{display:block;font:800 19px var(--round);margin-bottom:4px}.bub b.h.big{font-size:22px}.sub{color:var(--muted);font-size:13px}
.typing{display:inline-flex;gap:4px;vertical-align:middle}.typing i{width:8px;height:8px;border-radius:50%;background:var(--c);animation:dot 1s ease-in-out infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-6px);opacity:1}}.pending .tt{color:var(--muted)}
.mascot.talk{animation:talk 1.8s ease-in-out infinite;transform-origin:bottom}.mascot .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes talk{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-3px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot.bob{animation:bob 2.2s ease-in-out infinite;transform-origin:bottom}.b1{animation-delay:.25s!important}.b2{animation-delay:.5s!important}.b3{animation-delay:.75s!important}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
dl.an{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 0}dl.an dt{color:var(--muted);font:700 13px var(--round);padding-top:3px}dl.an dd{margin:0}
.kp{display:flex;flex-wrap:wrap;gap:6px}.kp span{background:#E7F8F6;color:#0E6E64;border-radius:999px;padding:2px 11px;font-size:13px;font-weight:500}.kp.mis span{background:#FFE9E9;color:#B03A3A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kp span{background:#1E4A54;color:#BFF5EE}:root:not([data-theme="light"]) .kp.mis span{background:#5A2533;color:#FFD3D3}}
.warn{background:#FFF4CF;border:2px dashed var(--sun2);padding:8px 12px;border-radius:14px;margin:6px 0;color:#6A5000}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:10px 0 4px}
.tile{text-align:left;border:0;border-radius:22px;padding:0;cursor:pointer;background:var(--soft);color:var(--ink);box-shadow:0 5px 0 var(--line);overflow:hidden;animation:popIn .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*.12s);transition:transform .18s}
.tile:hover:not(:disabled){transform:translateY(-4px) rotate(-1.2deg)}.tile:active:not(:disabled){transform:translateY(2px)}.tile:disabled{opacity:.5;cursor:default}
@keyframes popIn{from{opacity:0;transform:scale(.6) rotate(-6deg)}}
.tile .art{height:92px;display:grid;place-items:center;position:relative}.tile .art svg{width:62px;height:62px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.tile .badge{position:absolute;top:9px;left:9px;background:#fff;color:var(--ink);font:800 12px var(--round);padding:2px 10px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.tile .tb{display:block;padding:10px 14px 14px}.tile .tn{display:block;font:800 18px var(--round)}.tile .tw{display:block;font-size:14px;color:var(--muted);margin:3px 0 9px;line-height:1.5}
.xp{display:block;height:10px;background:var(--line);border-radius:999px;overflow:hidden}.xp i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:999px;animation:grow 1.2s ease-out both .3s}
@keyframes grow{from{width:0}}.xpl{display:block;font:700 11px var(--round);color:var(--muted);margin-top:3px}
.cart{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;margin-top:8px}
.result .bub{animation:glow 2.4s ease-in-out 2}@keyframes glow{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--sun) 45%,transparent)}}
.cover{position:relative;display:block;width:100%;padding:0;border:0;border-radius:18px;overflow:hidden;aspect-ratio:16/9;background:var(--soft);cursor:pointer}.cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.cover:hover img{transform:scale(1.06)}.cover .pl{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,transparent 45%,rgba(27,42,74,.45))}
.cover .pl span{width:58px;height:58px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:0 5px 0 var(--sun2);transition:transform .2s}.cover .pl svg{width:22px;height:22px;margin-left:4px}.cover:hover .pl span{transform:scale(1.12) rotate(-8deg)}
.nocover{width:100%;height:100%;display:grid;place-items:center}.nocover svg{width:70px;height:70px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.chip{font:800 12px var(--round);border-radius:999px;padding:3px 11px;color:#fff}.chip.soft{background:var(--soft);color:var(--ink)}
ol.parts{margin:6px 0;padding-left:1.3em;font-size:14px;line-height:1.8}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gbtn{border:0;font:800 14px var(--round);border-radius:14px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink);background:var(--sun);box-shadow:0 4px 0 var(--sun2);transition:transform .12s}
.gbtn:hover{transform:translateY(-2px)}.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun2)}.gbtn.go{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint2)}.gbtn.alt{background:var(--soft);box-shadow:0 4px 0 var(--line)}.gbtn:disabled{opacity:.5;transform:none}
.compose{padding:10px clamp(10px,2vw,20px) 14px;background:var(--soft);border-top:3px dashed var(--line)}
.exs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:9px}.ex{font:700 13px var(--round);border:0;background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;box-shadow:0 3px 0 var(--line);transition:transform .15s}
.ex:hover{transform:translateY(-2px) rotate(-2deg)}.ex i{width:11px;height:11px;border-radius:50%}
.gl{margin-left:auto;display:flex;align-items:center;gap:6px;font:700 12px var(--round);color:var(--muted)}.gl select{width:auto;padding:5px 8px;border-radius:10px}
.row{display:flex;gap:10px;align-items:stretch}#input{flex:1;font-size:15px;border:3px solid var(--line);border-radius:20px;padding:11px 15px;min-height:62px;max-height:200px;resize:vertical;background:var(--surface);color:var(--ink)}
#input:focus{outline:none;border-color:var(--grape)}#send{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral2);font-size:17px;padding:0 22px;border-radius:20px}
#send:hover:not(:disabled){animation:jelly .5s}@keyframes jelly{30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.06)}}
/* engine */
aside.side{min-height:0;overflow:auto}
.engine{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:16px}
.engine h2{margin:0;font:800 20px var(--round);display:flex;align-items:center;gap:8px}.engine h2::before{content:"";width:28px;height:28px;border-radius:9px;background:conic-gradient(var(--coral),var(--sun),var(--mint),var(--sky),var(--grape),var(--coral));animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.engine>p{margin:2px 0 10px;color:var(--muted);font-size:13px}
#provCards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prov{position:relative;border:3px solid var(--line);background:var(--soft);border-radius:18px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);transition:transform .15s,border-color .2s}
.prov:hover{transform:translateY(-2px)}.prov.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));box-shadow:0 4px 0 var(--c)}
.pm{width:36px;height:36px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font:800 18px var(--round)}.pn{font:800 13px var(--round);text-align:center;line-height:1.2}.pk{font-size:11px;color:var(--muted);min-height:14px}
label.f{display:block;font:700 12px var(--round);color:var(--muted);margin:10px 0 4px}
select,input[type=password],input[type=text]{width:100%;font-size:14px;padding:9px 11px;border:3px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink)}
#customModel{margin-top:6px}.keyrow{display:flex;gap:6px}.iconb{border:3px solid var(--line);background:var(--soft);border-radius:12px;cursor:pointer;padding:0 10px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin:8px 0 0}.note{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0 0}.okline{margin:12px 0 0;color:var(--mint2);font:800 14px var(--round)}
.warnline{background:#FFF4CF;color:#6A5000;padding:8px 10px;border-radius:12px}
/* library */
#lib{height:100%;overflow:auto;padding:14px clamp(10px,2.5vw,36px) 40px}
.banner{position:relative;border-radius:30px;padding:24px 28px;background:linear-gradient(120deg,#FF4F5A,#FF8A1C 55%,#FFC931);color:#fff;overflow:hidden;box-shadow:var(--shadow);display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.banner h2{font:800 clamp(26px,3.4vw,40px)/1 var(--round);margin:0}.banner p{margin:6px 0 0;opacity:.92}.banner .crew{margin-left:auto;height:74px}.banner .crew .mascot{width:48px;height:62px}
.banner .cl{position:absolute;background:rgba(255,255,255,.18);border-radius:999px;animation:cloud 22s linear infinite}
@keyframes cloud{from{transform:translateX(-30%)}to{transform:translateX(130vw)}}
.sect{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 12px}.sect h3{font:800 25px var(--round);margin:0;color:#fff}.sect .sub{color:#E3ECFF}
.fchips{display:flex;flex-wrap:wrap;gap:6px}.fchip{border:0;background:var(--surface);color:var(--ink);font:800 13px var(--round);border-radius:999px;padding:6px 13px;cursor:pointer;box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--c,var(--line));transition:transform .15s}
.fchip:hover{transform:translateY(-2px)}.fchip[aria-pressed="true"]{background:var(--c,#FF4F5A);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.gcard{position:relative;background:var(--surface);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .2s;animation:popIn .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*.05s)}
.gcard:hover{transform:translateY(-6px) rotate(-.8deg)}.gcard:nth-child(even):hover{transform:translateY(-6px) rotate(.8deg)}.gcard .cover{border-radius:0}
.ribbon{position:absolute;top:12px;left:12px;color:#fff;font:800 12px var(--round);padding:3px 11px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.2);z-index:2}
.gb{padding:12px 16px 16px;display:flex;flex-direction:column;flex:1}.gcard h4{font:800 19px var(--round);margin:0 0 5px}
.mb{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--round);color:var(--muted)}.mi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center}.mi svg{width:16px;height:16px}
.gcard .d{font-size:14.5px;line-height:1.6;color:var(--muted);margin:6px 0 10px;flex:1}.lvl{font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:26px;border:3px dashed var(--line);border-radius:24px;color:var(--muted);background:var(--surface)}.empty .mascot{width:52px;height:66px;animation:bob 2s ease-in-out infinite}
#playModal{position:fixed;inset:0;background:rgba(14,20,48,.85);z-index:30;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top,0px)) 12px 12px;animation:fade .25s}#playModal[hidden]{display:none}@keyframes fade{from{opacity:0}}
.pbar{display:flex;align-items:center;gap:10px;color:#fff;padding:0 4px 8px}.pbar b{font:800 20px var(--round);flex:1}#player{flex:1;width:100%;border:0;border-radius:20px;background:#000}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--grape);color:#fff;padding:11px 20px;border-radius:999px;z-index:40;font:800 14px var(--round);box-shadow:0 5px 0 #5A3FD0;animation:popIn .4s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:35}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.msg{opacity:1;transform:none}}
@media (max-width:920px){body{overflow:auto}#gen{grid-template-columns:1fr;height:auto;min-height:100%}.chat{min-height:calc(100dvh - 150px)}
  aside.side{position:fixed;left:8px;right:8px;bottom:8px;z-index:25;transform:translateY(120%);transition:transform .35s cubic-bezier(.3,1.3,.5,1);max-height:78vh}body.engopen aside.side{transform:none}
  #engChip{display:inline-flex}.crew{display:none}.tabs{order:3;width:100%;margin-left:0}.tab{flex:1}.tools{margin-left:auto}.cart{grid-template-columns:1fr}.lab{font-size:10px}#track{margin:4px 6px}.gl span{display:none}}
.testrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}#testRes{font-size:13px;font-weight:600}#testRes.ok{color:var(--mint2)}#testRes.bad{color:var(--coral2)}
.adv{margin-top:12px;border-top:2px dashed var(--line);padding-top:8px}.adv summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
#atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.att{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px;font-size:13px}
.att b{font-weight:600;max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.att small{color:var(--muted)}.att button{border:0;background:var(--soft);border-radius:8px;cursor:pointer;width:24px;height:24px;color:var(--ink)}.att.busy{color:var(--muted);animation:dot 1.2s ease-in-out infinite}
.iconbtn{border:3px solid var(--line);background:var(--surface);border-radius:16px;font-size:22px;width:52px;cursor:pointer;flex:0 0 auto}.iconbtn:hover{border-color:var(--grape)}
.sendcol{display:flex;flex-direction:column;gap:6px}.sendcol #send{flex:1}.gbtn.small{font-size:12px;padding:5px 10px;justify-content:center}
.attline{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.attline span{font-size:12px;background:rgba(255,255,255,.6);border-radius:8px;padding:1px 8px}
.chat.drop{outline:4px dashed var(--grape);outline-offset:-8px}
ol.plan{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:8px}.pl{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px}.pl.none{opacity:.7}.pl label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer}.pl small{display:block;color:var(--muted);margin-top:3px}
.pl .vb{font-size:12px;background:var(--grape);color:#fff;border-radius:999px;padding:1px 9px}.pl em{font-style:normal;font-weight:700}.pl em.ok{color:var(--mint2)}.pl em.unk{color:#B08000}.pl em.bad{color:var(--coral2)}.pl input{width:18px;height:18px}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><div class="logo"><span>G</span></div><div><h1 data-t="title">OpenMAIC-GamePlay</h1><p data-t="tag"></p></div></div>
  <div class="crew" id="crew" aria-hidden="true"></div>
  <nav class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="true" data-p="gen" data-t="tabStudio"></button><button class="tab" role="tab" aria-selected="false" data-p="lib" data-t="tabLib"></button></nav>
  <div class="tools"><button id="engChip" aria-label="AI"></button><div class="lang" role="group" aria-label="Language"><button data-l="zh" aria-pressed="true">中</button><button data-l="en" aria-pressed="false">EN</button></div></div>
</header>
<main>
  <section id="gen" class="panel">
    <div class="chat">
      <div class="chathead"><h2 data-t="tabStudio"></h2><span class="sp"></span><button id="newChat" class="gbtn alt">＋ <span data-t="newChat"></span></button></div>
      <ol id="track" aria-label="progress"></ol>
      <div id="msgs" aria-live="polite"></div>
      <div class="compose">
        <div class="exs"><button class="ex"><i style="background:var(--cG)"></i><span></span></button><button class="ex"><i style="background:var(--cO)"></i><span></span></button><button class="ex"><i style="background:var(--cA)"></i><span></span></button>
          <label class="gl"><span data-t="gameLang"></span><select id="gl"><option value="zh">繁體中文</option><option value="en">English</option></select></label></div>
        <div id="atts" hidden></div>
        <div class="row"><button id="attachBtn" class="iconbtn" type="button">📎</button><input type="file" id="fileIn" multiple accept=".docx,.pptx,.pdf,.txt,.md,.doc,.ppt" hidden><textarea id="input" aria-label="lesson"></textarea><div class="sendcol"><button id="send" class="gbtn" data-t="send"></button><button id="clearBtn" class="gbtn alt small" type="button">🗑 <span id="clearLbl"></span></button></div></div>
      </div>
    </div>
    <aside class="side"><div class="engine"><h2 data-t="engTitle"></h2><p data-t="engSub"></p><div id="provCards"></div><div id="engineBody"></div></div></aside>
  </section>
  <section id="lib" class="panel" hidden>
    <div class="banner"><span class="cl" style="width:180px;height:44px;top:18px;left:0"></span><span class="cl" style="width:120px;height:32px;top:90px;left:-20%;animation-delay:-9s"></span><div><h2 data-t="libTitle"></h2><p data-t="libSub"></p></div><div class="crew" id="crew2" aria-hidden="true"></div></div>
    <div class="sect"><h3 data-t="mine"></h3><span class="sub" data-t="mineSub"></span></div><div id="mine" class="grid"></div>
    <div class="sect"><h3 data-t="demos"></h3><div class="fchips" id="subjChips" role="group"></div></div><div id="demos" class="grid"></div>
  </section>
</main>
<div id="playModal" hidden role="dialog" aria-modal="true" aria-labelledby="playTitle"><div class="pbar"><b id="playTitle"></b><button id="closePlay" class="gbtn">✕ <span data-t="close"></span></button></div><iframe id="player" title="game"></iframe></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div id="toast" hidden role="status"></div>
<script type="application/json" id="d-src">%%SRC%%</script>
<script type="application/json" id="d-demos">%%DEMOS%%</script>
<script>%%APP%%</script>
</body>
</html>
